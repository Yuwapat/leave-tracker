        // 🔒 ล็อกสิทธิ์ถาวรให้ ID 44 (พิมลาภัสร์) เป็น admin และ ID 25 (งามจิต) เป็น hr
        function normalizeRole(rawRole, id = "") {
            const strId = String(id).trim();
            if (strId === "44") return "admin"; 
            if (strId === "25") return "hr";    
            
            if (!rawRole) return "teacher";
            const str = String(rawRole).toLowerCase().trim();
            if (str.includes("admin") || str.includes("แอดมิน") || str.includes("ผู้ดูแล")) return "admin";
            if (str.includes("hr") || str.includes("บุคคล")) return "hr";
            if (str.includes("maid") || str.includes("แม่บ้าน")) return "maid";
            if (str.includes("janitor") || str.includes("พ่อบ้าน") || str.includes("ภารโรง")) return "janitor";
            return "teacher";
        }

        function App() {
            const [users, setUsers] = React.useState(() => {
                const saved = localStorage.getItem("leave_users");
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        return parsed.map(u => ({
                            ...u,
                            role: normalizeRole(u.role, u.id)
                        }));
                    } catch (e) {
                        return initialUsers;
                    }
                }
                return initialUsers;
            });

            const [currentUser, setCurrentUser] = React.useState(() => {
                const saved = localStorage.getItem("leave_current_user");
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed) {
                            return {
                                ...parsed,
                                role: normalizeRole(parsed.role, parsed.id)
                            };
                        }
                    } catch (e) {
                        return null;
                    }
                }
                return null;
            });

            const [holidays, setHolidays] = React.useState(() => {
                const saved = localStorage.getItem("leave_holidays");
                return saved ? JSON.parse(saved) : initialHolidays;
            });

            const [activities, setActivities] = React.useState(() => {
                const saved = localStorage.getItem("leave_activities");
                return saved ? JSON.parse(saved) : initialActivities;
            });

            const [leaves, setLeaves] = React.useState([]);
            const [loginId, setLoginId] = React.useState("");
            const [loginPassword, setLoginPassword] = React.useState("");
            const [activeTab, setActiveTab] = React.useState("admin"); 
            const [adminSubTab, setAdminSubTab] = React.useState("leaves"); 
            const [selectedTeacherId, setSelectedTeacherId] = React.useState("");
            const [formData, setFormData] = React.useState({ startDate: "", endDate: "", type: "personal", reason: "", period: "all_day" });
            const [notification, setNotification] = React.useState(null);
            const [isLoading, setIsLoading] = React.useState(false);

            // Modals State
            const [showAddTeacherModal, setShowAddTeacherModal] = React.useState(false);
            const [newTeacher, setNewTeacher] = React.useState({ prefix: "นาย", name: "", email: "", sickQuota: 30, personalQuota: 15, role: "teacher", password: "1234", photo: "", hireDate: "" });
            const [showEditTeacherModal, setShowEditTeacherModal] = React.useState(false);
            const [editingTeacher, setEditingTeacher] = React.useState(null);
            const [showAddHolidayModal, setShowAddHolidayModal] = React.useState(false);
            const [newHoliday, setNewHoliday] = React.useState({ date: "", name: "" });
            const [showAddActivityModal, setShowAddActivityModal] = React.useState(false);
            const [newActivity, setNewActivity] = React.useState({ date: "", name: "", session: "morning" });
            const [confirmDialog, setConfirmDialog] = React.useState({ isOpen: false, title: "", message: "", onConfirm: null });

            React.useEffect(() => { localStorage.setItem("leave_users", JSON.stringify(users)); }, [users]);
            React.useEffect(() => { localStorage.setItem("leave_current_user", currentUser ? JSON.stringify(currentUser) : ""); }, [currentUser]);
            React.useEffect(() => { localStorage.setItem("leave_holidays", JSON.stringify(holidays)); }, [holidays]);
            React.useEffect(() => { localStorage.setItem("leave_activities", JSON.stringify(activities)); }, [activities]);

            // Sync with Google Sheets
            React.useEffect(() => {
                if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) return;
                
                const fetchSheetData = async () => {
                    setIsLoading(true);
                    try {
                        const response = await fetch(GOOGLE_SHEET_URL);
                        const data = await response.json();
                        
                        if (data.users && Array.isArray(data.users) && data.users.length > 0) {
                            const mappedUsers = data.users.map(u => {
                                const userId = String(u.id || u.ID || "");
                                return {
                                    id: userId,
                                    prefix: u.prefix || u.Prefix || "",
                                    name: u.name || u.Name || "",
                                    role: normalizeRole(u.role || u.Role, userId),
                                    password: String(u.password !== undefined ? u.password : (u.Password !== undefined ? u.Password : "1234")),
                                    email: u.email || u.Email || "",
                                    sickQuota: Number(u.sickquota !== undefined ? u.sickquota : (u.sickQuota !== undefined ? u.sickQuota : (u.SickQuota !== undefined ? u.SickQuota : 30))),

                                    setCurrentUser(currentMatched);

                                let parsedBreakdown = [];
                                if (l.breakdown) {
                                    try { parsedBreakdown = JSON.parse(l.breakdown); } catch (e) { parsedBreakdown = []; }
                                }
                                return {
                                    id: l.id || l.ID || "",
                                    teacherId: String(l.teacherid || l.teacherId || l.TeacherID || ""),
                                    teacherName: l.teachername || l.teacherName || l.TeacherName || "",
                                    startDate: l.startdate || l.startDate || l.StartDate || "",
                                    endDate: l.enddate || l.endDate || l.EndDate || "",
                                    type: l.type || l.Type || "",
                                    period: l.period || l.Period || "all_day",
                                    reason: l.reason || l.Reason || "",
                                    totalDeducted: Number(l.totaldeducted !== undefined ? l.totaldeducted : (l.totalDeducted !== undefined ? l.totalDeducted : (l.TotalDeducted !== undefined ? l.TotalDeducted : 1))),
                                    status: l.status || l.Status || "approved",
                                    breakdown: parsedBreakdown,
                                    createdAt: l.createdat || l.createdAt || l.CreatedAt || "",
                                    dutyFeeDeduction: Number(l.dutyfeededuction !== undefined ? l.dutyfeededuction : (l.dutyFeeDeduction !== undefined ? l.dutyFeeDeduction : (l.DutyFeeDeduction !== undefined ? l.DutyFeeDeduction : 0)))

                            });

                    const userRole = normalizeRole(currentUser.role, currentUser.id);

                        setActiveTab("admin");
                    } else {
                        setSelectedTeacherId(currentUser.id);
                        setActiveTab("teacher");
                    }
                }

            React.useEffect(() => {
                if (formData.period !== "all_day" && formData.startDate) {
                    setFormData(prev => ({ ...prev, endDate: prev.startDate }));
                }
            }, [formData.startDate, formData.period]);

            const getTeacherStats = (teacherId) => {
                const teacherObj = users.find(u => String(u.id) === String(teacherId));
                if (!teacherObj) return { sickUsed: 0, personalUsed: 0, personalDeductedFromLeaves: 0, latePenalty: 0, lateCount: 0, dutyFeeTotal: 0 };
                
                const userLeaves = leaves.filter(l => String(l.teacherId) === String(teacherId) && l.status === "approved");
                
                const sickUsed = userLeaves
                    .filter(l => l.type === "sick")
                    .reduce((sum, l) => sum + l.totalDeducted, 0);
                    
                const personalDeductedFromLeaves = userLeaves
                    .filter(l => l.type === "personal")
                    .reduce((sum, l) => sum + l.totalDeducted, 0);

                const dutyFeeTotal = userLeaves.reduce((sum, l) => sum + (l.dutyFeeDeduction || 0), 0);
                    
                const lateCount = teacherObj.lateCount || 0;
                const latePenalty = lateCount >= 4 ? Math.floor((lateCount - 1) / 3) : 0;
                const personalUsed = personalDeductedFromLeaves + latePenalty;
                
                return { 
                    sickUsed, 
                    personalUsed, 
                    personalDeductedFromLeaves, 
                    latePenalty, 
                    lateCount,
                    dutyFeeTotal
                };
            };

            const selectedTeacherStats = selectedTeacher ? getTeacherStats(selectedTeacherId) : null;

            const handleImageUpload = (file, callback) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64Str = canvas.toDataURL('image/jpeg', 0.85);
                        callback(base64Str);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

                        ...matched,
                        role: normalizeRole(matched.role, matched.id)

                        fetch(GOOGLE_SHEET_URL, {

                        }).catch(err => console.error("Login notify error:", err));

                } else {
                    showToast("ข้อมูลประจำตัวหรือรหัสผ่านไม่ถูกต้อง", "error");
                }
            };

            const formatThaiDate = (dateStr) => {
                if (!dateStr) return "-";
                const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = new Date(dateStr);
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            const getLocalDateString = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const isWeekend = (date) => {
                const day = date.getDay();
                return day === 0 || day === 6; 
            };

            const isSchoolHoliday = (dateStr) => holidays.some(h => h.date === dateStr);
            const getHolidayName = (dateStr) => {
                const hol = holidays.find(h => h.date === dateStr);
                return hol ? hol.name : "";
            };
            const getSchoolActivity = (dateStr) => activities.find(a => a.date === dateStr);

            const calculateLeaveDays = (startDateStr, endDateStr, period = "all_day") => {
                const actualEndDateStr = period !== "all_day" ? startDateStr : endDateStr;
                if (!startDateStr || !actualEndDateStr) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };
                
                const start = new Date(startDateStr);
                const end = new Date(actualEndDateStr);
                
                if (end < start) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };

                const breakdown = [];
                let totalDeducted = 0;
                let totalDutyFee = 0;

                let current = new Date(start.getTime());
                while (current <= end) {
                    const dateStr = getLocalDateString(current);
                    
                    if (isWeekend(current) || isSchoolHoliday(dateStr)) {
                        const hName = getHolidayName(dateStr);
                        const reasonLabel = isWeekend(current) ? "วันหยุดสุดสัปดาห์" : `วันหยุดราชการ (${hName})`;
                        breakdown.push({ date: dateStr, base: 0, penalty: 0, penaltyReason: reasonLabel, final: 0 });
                    } else {
                        let base = period !== "all_day" ? 0.5 : 1.0;
                        let penalty = 0;
                        let penaltyReason = period !== "all_day" ? "อัตราลาครึ่งวัน" : "อัตราลาปกติ";

                        const schoolActivity = getSchoolActivity(dateStr);
                        let finalDeductedForDay = base;

                        if (schoolActivity) {
                            finalDeductedForDay = period !== "all_day" ? 0.75 : 1.5;
                            penaltyReason = `วันกิจกรรมพิเศษ (${schoolActivity.name})`;
                        }

                        // หักค่าเวร
                        totalDutyFee += (period !== "all_day" ? 50 : 100);

                        breakdown.push({ date: dateStr, base: base, penalty: penalty, penaltyReason: penaltyReason, final: finalDeductedForDay });
                        totalDeducted += finalDeductedForDay;
                    }
                    current.setDate(current.getDate() + 1);
                }
                return { total: totalDeducted, breakdown, dutyFeeDeduction: totalDutyFee };
            };

            const leaveCalculation = calculateLeaveDays(formData.startDate, formData.endDate, formData.period);

            const handleRequestLeave = (e) => {
                e.preventDefault();
                if (!formData.startDate || !formData.reason) {
                    showToast("กรุณากรอกข้อมูลวันที่และเหตุผลการลาให้ครบถ้วน", "error");
                    return;
                }

                const targetTeacher = users.find(u => String(u.id) === String(selectedTeacherId));
                const stats = getTeacherStats(selectedTeacherId);
                const calc = calculateLeaveDays(formData.startDate, formData.endDate, formData.period);

                if (calc.total === 0) {
                    showToast("วันที่เลือกเป็นวันหยุด ไม่คิดหักวันลา", "error");
                    return;
                }

                const currentBalance = formData.type === "personal" 
                    ? targetTeacher.personalQuota - stats.personalUsed
                    : targetTeacher.sickQuota - stats.sickUsed;

                if (calc.total > currentBalance) {
                    showToast(`สิทธิ์วันลาคงเหลือไม่เพียงพอ (ต้องการ ${calc.total} วัน แต่คงเหลือ ${currentBalance} วัน)`, "error");
                    return;
                }

                const newRequest = {
                    id: "L" + Date.now().toString().slice(-6),
                    teacherId: selectedTeacherId,
                    teacherName: `${targetTeacher.prefix}${targetTeacher.name}`,
                    startDate: formData.startDate,
                    endDate: formData.period !== "all_day" ? formData.startDate : formData.endDate,
                    type: formData.type,
                    period: formData.period,
                    reason: formData.reason,
                    totalDeducted: calc.total,
                    dutyFeeDeduction: calc.dutyFeeDeduction,
                    status: "approved",
                    breakdown: calc.breakdown,
                    createdAt: getLocalDateString(new Date())
                };

                setLeaves([newRequest, ...leaves]);
                setFormData({ startDate: "", endDate: "", type: "personal", reason: "", period: "all_day" });
                showToast("ยื่นคำขอและบันทึกประวัติวันลาเรียบร้อยแล้ว");

                // บันทึกลง Google Sheets
                if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: "requestLeave",
                            ...newRequest
                        })
                    }).catch(err => console.error("Sheet save error:", err));
                }
            };

            const handleDeleteLeave = (leaveId) => {
                triggerConfirm(
                    "ยืนยันการยกเลิกรายการใบลา",
                    "ระบบจะทำการคืนสิทธิ์วันลาให้บุคลากรโดยอัตโนมัติ",
                    () => {
                        setLeaves(leaves.filter(l => l.id !== leaveId));
                        showToast("ยกเลิกรายการและคืนสิทธิ์วันลาเรียบร้อยแล้ว");

                        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                            fetch(GOOGLE_SHEET_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: "deleteLeave", leaveId })
                            }).catch(err => console.error("Sheet delete error:", err));
                        }
                    }
                );
            };

            const renderAvatar = (teacherObj, sizeClass = "w-10 h-10 text-xs") => {
                if (teacherObj && teacherObj.photo) {
                    return (
                        <div className="relative flex-shrink-0">
                            <img 
                                src={teacherObj.photo} 
                                alt={teacherObj.name} 
                                className={`${sizeClass.split(' ')[0]} ${sizeClass.split(' ')[1]} rounded-full object-cover border-2 border-emerald-700 shadow-sm`}
                                onError={(e) => {
                                    e.target.style.display = 'none';
                                    if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                                }}
                            />
                            <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold items-center justify-center border-2 border-white shadow-sm uppercase text-center flex-shrink-0 hidden`}>
                                {teacherObj.name ? teacherObj.name.trim().charAt(0) : "?"}
                            </div>
                        </div>
                    );
                }
                const initialChar = teacherObj && teacherObj.name ? teacherObj.name.trim().charAt(0) : "?";
                return (
                    <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold flex items-center justify-center border-2 border-white shadow-sm uppercase text-center flex-shrink-0`}>
                        {initialChar}
                    </div>
                );
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 relative">
                        <div className="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                            <header className="luxury-gradient text-white p-8 text-center relative border-b-4 border-emerald-700">
                                <div className="w-20 h-20 flex items-center justify-center mx-auto mb-3">
                                    <img 
                                        src="logo.png" 
                                        alt="Yuwapat Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            if (e.target.src.indexOf('logo.png') !== -1) {
                                                e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                            }
                                        }}
                                    />
                                </div>
                                <h2 className="text-lg font-bold tracking-wide text-white">Yuwapat Early Childhood School</h2>
                                <p className="text-xs text-emerald-100 mt-1 font-medium">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                            </header>

                            {notification && (
                                <div className="mx-6 mt-4 p-3 text-xs rounded-xl border flex items-center gap-2 bg-red-50 text-red-800 border-red-100">
                                    <i className="fa-solid fa-circle-exclamation text-red-500"></i>
                                    <span className="font-semibold">{notification.message}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="p-8 space-y-4">
                                <div className="space-y-1 text-left">
                                    <label className="block text-slate-700 text-xs font-bold">อีเมลโรงเรียน / ชื่อผู้ใช้งาน</label>
                                    <input 
                                        type="text" 
                                        placeholder="กรอกรหัสประจำตัว หรือ Username"
                                        value={loginId}
                                        onChange={(e) => setLoginId(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 text-slate-800 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700 text-sm font-semibold"
                                        required
                                    />
                                </div>

                                <div className="space-y-1 text-left">
                                    <label className="block text-slate-700 text-xs font-bold">รหัสผ่านเข้าใช้งาน</label>
                                    <input 
                                        type="password" 
                                        placeholder="กรอกรหัสผ่าน (เริ่มต้น 1234)"
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 text-slate-800 px-4 py-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700 text-sm font-semibold"
                                        required
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 px-6 rounded-xl transition duration-200 shadow text-xs uppercase tracking-wider"
                                >
                                    เข้าสู่ระบบความปลอดภัย
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const currentRole = normalizeRole(currentUser.role, currentUser.id);
            const isAdminOrHr = currentRole === "admin" || currentRole === "hr";

            return (
                <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
                    
                    <header className="luxury-gradient text-white shadow-lg sticky top-0 z-30 border-b border-emerald-700/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between gap-4">
                            
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 flex items-center justify-center flex-shrink-0">
                                    <img 
                                        src="logo.png" 
                                        alt="Yuwapat Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            if (e.target.src.indexOf('logo.png') !== -1) {
                                                e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                            }
                                        }}
                                    />
                                </div>
                                <div className="text-center sm:text-left">
                                    <h1 className="text-base sm:text-lg font-bold tracking-wide text-white">Yuwapat Early Childhood School</h1>
                                    <p className="text-xs text-emerald-200 font-medium">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 flex-wrap justify-center">
                                {isAdminOrHr && (
                                    <div className="flex bg-navy-950 p-1 rounded-xl border border-emerald-700/30">
                                        <button 
                                            onClick={() => setActiveTab("teacher")}
                                            className={`px-4 py-2 rounded-lg text-xs font-bold transition ${activeTab === 'teacher' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            พอร์ทัลบุคลากร
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab("admin")}
                                            className={`px-4 py-2 rounded-lg text-xs font-bold transition ${activeTab === 'admin' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            บริหารจัดการทรัพยากรบุคคล (ADMIN)
                                        </button>
                                    </div>
                                )}

                                <div className="flex items-center gap-2 bg-navy-950 pl-3 pr-1.5 py-1.5 rounded-xl border border-emerald-700/30">
                                    <div className="text-right">
                                        <p className="text-[10px] font-bold text-emerald-500 uppercase tracking-wider">
                                            {currentRole === 'admin' ? 'ผู้ดูแลระบบสูงสุด' : currentRole === 'hr' ? 'เจ้าหน้าที่งานบุคคล' : 'ครูผู้สอน / บุคลากร'}
                                        </p>
                                        <p className="text-xs font-bold text-white">{currentUser.prefix}{currentUser.name}</p>
                                    </div>
                                    <button 
                                        onClick={handleLogout}
                                        className="bg-red-600 hover:bg-red-700 text-white w-8 h-8 rounded-lg flex items-center justify-center transition shadow"
                                        title="ออกจากระบบ"
                                    >
                                        <i className="fa-solid fa-power-off text-xs"></i>
                                    </button>
                                </div>
                            </div>

                        </div>
                    </header>

                    {notification && (
                        <div className="fixed top-20 right-4 z-50 animate-bounce">
                            <div className={`shadow-xl rounded-2xl p-4 flex items-center gap-3 border ${notification.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
                                <i className={`fa-solid ${notification.type === 'error' ? 'fa-circle-xmark text-red-500' : 'fa-circle-check text-emerald-600'} text-xl`}></i>
                                <div>
                                    <p className="font-bold text-sm">ระบบแจ้งเตือน</p>
                                    <p className="text-xs mt-0.5">{notification.message}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm border text-center">
                                <i className="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-3"></i>
                                <h3 className="text-sm font-bold text-slate-800">{confirmDialog.title}</h3>
                                <p className="text-xs text-slate-500 mt-2">{confirmDialog.message}</p>
                                <div className="grid grid-cols-2 gap-3 mt-5">
                                    <button 
                                        onClick={() => setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null })}
                                        className="bg-slate-100 text-slate-700 font-bold py-2 rounded-xl text-xs"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={confirmDialog.onConfirm}
                                        className="bg-red-600 text-white font-bold py-2 rounded-xl text-xs shadow"
                                    >
                                        ยืนยันทำรายการ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
                        
                        {activeTab === "teacher" && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                
                                <div className="space-y-6 lg:col-span-1 text-left">
                                    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                        {isAdminOrHr ? (
                                            <div className="mb-4">
                                                <label className="block text-xs font-bold text-slate-700 mb-1">เลือกมุมมองบุคลากร</label>
                                                <select 
                                                    value={selectedTeacherId}
                                                    onChange={(e) => setSelectedTeacherId(e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-200 text-slate-800 px-3 py-2.5 rounded-xl font-bold text-xs"
                                                >
                                                    {users.map(u => (
                                                        <option key={u.id} value={u.id}>
                                                            [{u.id}] {u.prefix}{u.name} ({u.role === 'teacher' ? 'ครู' : u.role === 'maid' ? 'แม่บ้าน' : u.role === 'janitor' ? 'พ่อบ้าน' : u.role})
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        ) : null}

                                        {selectedTeacher && (
                                            <div className="bg-navy-900 text-white rounded-xl p-4 shadow relative overflow-hidden">
                                                <div className="flex items-center gap-3">
                                                    {renderAvatar(selectedTeacher, "w-12 h-12 text-sm")}
                                                    <div className="overflow-hidden text-left">
                                                        <p className="text-[10px] text-emerald-400 font-mono">รหัสประจำตัว: {selectedTeacher.id}</p>
                                                        <h3 className="font-bold text-sm text-white truncate">{selectedTeacher.prefix}{selectedTeacher.name}</h3>
                                                        <p className="text-[11px] text-slate-300">
                                                            {selectedTeacher.role === 'teacher' ? 'ครูผู้สอน / บุคลากรทางการศึกษา' : selectedTeacher.role === 'maid' ? 'เจ้าหน้าที่แม่บ้าน' : selectedTeacher.role === 'janitor' ? 'เจ้าหน้าที่พ่อบ้าน' : 'เจ้าหน้าที่บริหาร'}
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {selectedTeacher && selectedTeacherStats && (
                                        <div className="space-y-4">
                                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">ลากิจส่วนตัว</span>
                                                        <h4 className="text-3xl font-extrabold text-slate-800 mt-3">
                                                            {(selectedTeacher.personalQuota - selectedTeacherStats.personalUsed).toFixed(1)}
                                                            <span className="text-xs font-normal text-slate-400 ml-1">วันคงเหลือ</span>
                                                        </h4>
                                                    </div>
                                                    <div className="bg-emerald-50 text-emerald-700 p-3 rounded-xl border border-emerald-100">
                                                        <i className="fa-solid fa-briefcase text-lg"></i>
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-4 pt-3 border-t border-slate-100 text-xs space-y-1.5 text-slate-600">
                                                    <div className="flex justify-between">
                                                        <span>สถิติเข้าปฏิบัติงานสาย:</span>
                                                        <span className="font-bold">{selectedTeacherStats.lateCount} ครั้ง (-{selectedTeacherStats.latePenalty} วัน)</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>หักสะสมค่าปฏิบัติงานเวร:</span>
                                                        <span className="font-bold text-red-600">{selectedTeacherStats.dutyFeeTotal} บาท</span>
                                                    </div>
                                                </div>

                                                <div className="mt-3 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-400 font-medium">
                                                    <span>โควตาตั้งต้น: {selectedTeacher.personalQuota} วัน</span>
                                                    <span>ยื่นลาจริง: {selectedTeacherStats.personalDeductedFromLeaves.toFixed(1)} วัน</span>
                                                </div>
                                            </div>

                                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">ลาป่วย</span>
                                                        <h4 className="text-3xl font-extrabold text-slate-800 mt-3">
                                                            {(selectedTeacher.sickQuota - selectedTeacherStats.sickUsed).toFixed(1)}
                                                            <span className="text-xs font-normal text-slate-400 ml-1">วันคงเหลือ</span>
                                                        </h4>
                                                    </div>
                                                    <div className="bg-emerald-50 text-emerald-700 p-3 rounded-xl border border-emerald-100">
                                                        <i className="fa-solid fa-heart-pulse text-lg"></i>
                                                    </div>
                                                </div>
                                                <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between text-xs text-slate-400 font-medium">
                                                    <span>โควตาตั้งต้น: {selectedTeacher.sickQuota} วัน</span>
                                                    <span>ใช้ลาป่วยรวม: {selectedTeacherStats.sickUsed.toFixed(1)} วัน</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-6 lg:col-span-2 text-left">
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                                        <h2 className="text-base font-bold text-slate-800 mb-4 border-b pb-3 border-slate-100 flex items-center gap-2">
                                            <i className="fa-regular fa-paper-plane text-emerald-700"></i>
                                            แบบฟอร์มยื่นการลาและสรุปผลการคำนวณวันลา
                                        </h2>

                                        <form onSubmit={handleRequestLeave} className="space-y-5">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-slate-700 text-xs font-bold mb-1">วันที่เริ่มลา</label>
                                                    <input 
                                                        type="date" 
                                                        value={formData.startDate}
                                                        onChange={(e) => setFormData({ ...formData, startDate: e.target.value })}
                                                        className="w-full bg-slate-50 border border-slate-200 text-slate-800 px-3.5 py-2.5 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-700"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 text-xs font-bold mb-1">สิ้นสุดวันที่</label>
                                                    <input 
                                                        type="date" 
                                                        value={formData.period !== "all_day" ? formData.startDate : formData.endDate}
                                                        onChange={(e) => setFormData({ ...formData, endDate: e.target.value })}
                                                        disabled={formData.period !== "all_day"}
                                                        className={`w-full px-3.5 py-2.5 rounded-xl text-xs font-semibold ${formData.period !== "all_day" ? "bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200" : "bg-slate-50 border border-slate-200 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700"}`}
                                                        required={formData.period === "all_day"}
                                                    />
                                                </div>
                                            </div>

                                    e.preventDefault();
                                    if (!newTeacher.name) return;
                                    const newId = String(users.length + 1);
                                    const u = { ...newTeacher, id: newId, lateCount: 0, forgotTimeCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0 };
                                    setUsers([...users, u]);

                                    // อัปโหลดรูปไป Google Drive หากมีการเลือกรูป
                                    if (newTeacher.photo && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: newId,
                                                base64: newTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowAddTeacherModal(false);
                                    showToast(`เพิ่มบุคลากรเรียบร้อยแล้ว`);
                                }} className="space-y-3 text-xs">
                                    <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border">
                                        {newTeacher.photo ? (
                                            <img src={newTeacher.photo} className="w-12 h-12 rounded-full object-cover border-2 border-emerald-700" />
                                        ) : (
                                            <div className="w-12 h-12 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-lg"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เลือกรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setNewTeacher({ ...newTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-[10px] text-slate-500"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={newTeacher.name}
                                            onChange={(e) => setNewTeacher({ ...newTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1">บทบาทหน้าที่</label>
                                            <select 
                                                value={newTeacher.role}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, role: e.target.value })}
                                                className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            >
                                                <option value="teacher">ครูผู้สอน</option>
                                                <option value="maid">แม่บ้าน</option>
                                                <option value="janitor">พ่อบ้าน</option>
                                                <option value="hr">ฝ่ายบุคคล (HR)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1">รหัสผ่านเข้าใช้</label>
                                            <input 
                                                type="text" 
                                                value={newTeacher.password}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, password: e.target.value })}
                                                className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl shadow mt-2">
                                        บันทึกข้อมูลบุคลากร
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showEditTeacherModal && editingTeacher && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border text-left">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-sm font-bold text-slate-800">แก้ไขข้อมูลบุคลากร</h3>
                                    <button onClick={() => setShowEditTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    setUsers(users.map(u => u.id === editingTeacher.id ? editingTeacher : u));

                                    // ส่งรูปอัปโหลดไป Google Drive
                                    if (editingTeacher.photo && editingTeacher.photo.startsWith("data:image") && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: editingTeacher.id,
                                                base64: editingTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowEditTeacherModal(false);
                                    showToast("ปรับปรุงข้อมูลเรียบร้อยแล้ว");
                                }} className="space-y-3 text-xs">
                                    <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border">
                                        {editingTeacher.photo ? (
                                            <img src={editingTeacher.photo} className="w-12 h-12 rounded-full object-cover border-2 border-emerald-700" />
                                        ) : (
                                            <div className="w-12 h-12 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-lg"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เปลี่ยนรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setEditingTeacher({ ...editingTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-[10px] text-slate-500"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={editingTeacher.name}
                                            onChange={(e) => setEditingTeacher({ ...editingTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1">โควตาลากิจส่วนตัว</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.personalQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, personalQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1">โควตาลาป่วย</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.sickQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, sickQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl shadow mt-2">
                                        บันทึกปรับปรุงข้อมูล
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAddHolidayModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm border text-left">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-sm font-bold text-slate-800">เพิ่มวันหยุดราชการประจำปฏิทิน</h3>
                                    <button onClick={() => setShowAddHolidayModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newHoliday.date || !newHoliday.name) return;
                                    setHolidays([...holidays, newHoliday]);
                                    setNewHoliday({ date: "", name: "" });
                                    setShowAddHolidayModal(false);
                                    showToast("เพิ่มวันหยุดเรียบร้อยแล้ว");
                                }} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">เลือกวันที่</label>
                                        <input 
                                            type="date" 
                                            value={newHoliday.date}
                                            onChange={(e) => setNewHoliday({ ...newHoliday, date: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">ชื่อวันหยุด</label>
                                        <input 
                                            type="text" 
                                            placeholder="วันสงกรานต์, วันเข้าพรรษา..."
                                            value={newHoliday.name}
                                            onChange={(e) => setNewHoliday({ ...newHoliday, name: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl shadow mt-2">
                                        บันทึกวันหยุด
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAddActivityModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm border text-left">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-sm font-bold text-slate-800">เพิ่มกิจกรรมพิเศษประจำโรงเรียน</h3>
                                    <button onClick={() => setShowAddActivityModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newActivity.date || !newActivity.name) return;
                                    setActivities([...activities, newActivity]);
                                    setNewActivity({ date: "", name: "", session: "morning" });
                                    setShowAddActivityModal(false);
                                    showToast("บันทึกวันกิจกรรมเรียบร้อยแล้ว");
                                }} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">เลือกวันที่</label>
                                        <input 
                                            type="date" 
                                            value={newActivity.date}
                                            onChange={(e) => setNewActivity({ ...newActivity, date: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">ชื่อกิจกรรม</label>
                                        <input 
                                            type="text" 
                                            placeholder="พิธีไหว้ครู, วันวิทยาศาสตร์..."
                                            value={newActivity.name}
                                            onChange={(e) => setNewActivity({ ...newActivity, name: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1">ช่วงเวลาจัดงาน</label>
                                        <select 
                                            value={newActivity.session}
                                            onChange={(e) => setNewActivity({ ...newActivity, session: e.target.value })}
                                            className="w-full bg-slate-50 border px-3 py-2 rounded-xl"
                                        >
                                            <option value="morning">ครึ่งเช้า</option>
                                            <option value="afternoon">ครึ่งบ่าย</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-navy-900 text-white font-bold py-3 rounded-xl shadow mt-2">
                                        บันทึกวันกิจกรรม
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-navy-950 text-slate-400 py-6 text-center text-xs mt-10">
                        <p>© ๒๕๖๙ ระบบบริหารจัดการวันลาและสถิติการปฏิบัติงาน - โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
