                                            <option value="middayLong">ออกนอกสถานที่ &gt; 1.30 ชม. (หักลากิจ 0.5 วัน)</option>
                                            <option value="missedMeeting">ขาดการประชุมพบกันฉันน้องพี่ (หักลากิจ 1 วัน)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">หมายเหตุเพิ่มเติม</label>
                                        <input 
                                            type="text" 
                                            placeholder="ระบุสาเหตุหรือหมายเหตุประกอบ..."
                                            value={disciplineForm.note}
                                            onChange={(e) => setDisciplineForm({ ...disciplineForm, note: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl font-medium"
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-navy-900 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกประวัติย้อนหลัง
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showViewDisciplineModal && viewDisciplineTeacher && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-2xl border text-left flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <div className="flex items-center gap-3">
                                        {renderAvatar(viewDisciplineTeacher, "w-12 h-12 text-sm")}
                                        <div>
                                            <h3 className="text-base sm:text-lg font-bold text-slate-800">
                                                ประวัติการลงเวลา & สถิติวินัยสะสม
                                            </h3>
                                            <p className="text-xs text-slate-500 font-bold">
                                                {viewDisciplineTeacher.prefix}{viewDisciplineTeacher.name} (รหัส: {viewDisciplineTeacher.id})
                                            </p>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowViewDisciplineModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>

                                <div className="overflow-y-auto flex-1 space-y-6 pr-2">
                                    {isAdminOrHr && (
                                        <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3">
                                            <h4 className="font-bold text-slate-800 text-sm flex items-center gap-2 border-b pb-2">
                                                <i className="fa-solid fa-sliders text-emerald-700"></i>
                                                ปรับปรุงสถิติตัวเลขสะสมรายบุคคล
                                            </h4>

                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs sm:text-sm">
                                                <div className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                                    <span className="font-bold text-slate-700">1. เข้างานสาย:</span>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "lateCount", -1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">-</button>
                                                        <span className="font-mono font-bold text-base px-2">{viewDisciplineTeacher.lateCount || 0}</span>
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "lateCount", 1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">+</button>
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                                    <span className="font-bold text-slate-700">2. ลืมสแกนเวลา:</span>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "forgotTimeCount", -1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">-</button>
                                                        <span className="font-mono font-bold text-base px-2">{viewDisciplineTeacher.forgotTimeCount || 0}</span>
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "forgotTimeCount", 1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">+</button>
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                                    <span className="font-bold text-slate-700">3. นอกสถานที่ (> 1.30 ชม.):</span>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "middayOutLongCount", -1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">-</button>
                                                        <span className="font-mono font-bold text-base px-2">{viewDisciplineTeacher.middayOutLongCount || 0}</span>
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "middayOutLongCount", 1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">+</button>
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                                                    <span className="font-bold text-slate-700">4. ขาดการประชุมพบกัน:</span>
                                                    <div className="flex items-center gap-2">
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "missedMeetingCount", -1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">-</button>
                                                        <span className="font-mono font-bold text-base px-2">{viewDisciplineTeacher.missedMeetingCount || 0}</span>
                                                        <button onClick={() => handleUpdateDisciplineCount(viewDisciplineTeacher.id, "missedMeetingCount", 1)} className="w-7 h-7 bg-slate-100 hover:bg-slate-200 border rounded-lg flex items-center justify-center font-extrabold text-slate-700">+</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div>
                                        <h4 className="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                                            <i className="fa-solid fa-clock-rotate-left text-emerald-700"></i>
                                            รายการบันทึกข้อบกพร่องตามวันที่
                                        </h4>

                                        {disciplineLogs.filter(l => String(l.teacherId) === String(viewDisciplineTeacher.id)).length === 0 ? (
                                            <div className="text-center py-8 bg-slate-50 rounded-2xl border border-slate-200 text-slate-400">
                                                <p className="font-semibold text-xs sm:text-sm">ไม่มีรายการบันทึกข้อบกพร่องตามวันที่ย้อนหลัง</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {disciplineLogs.filter(l => String(l.teacherId) === String(viewDisciplineTeacher.id)).map((log) => (
                                                    <div key={log.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs sm:text-sm">
                                                        <div>
                                                            <span className="font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full text-xs">
                                                                {log.typeName}
                                                            </span>
                                                            <p className="font-bold text-slate-800 mt-2">{formatThaiDate(log.date)}</p>
                                                            <p className="text-xs text-slate-500 mt-0.5">{log.note}</p>
                                                        </div>
                                                        {isAdminOrHr && (
                                                            <button 
                                                                onClick={() => {
                                                                    setDisciplineLogs(disciplineLogs.filter(item => item.id !== log.id));
                                                                    showToast("ลบรายการเรียบร้อยแล้ว");
                                                                }}
                                                                className="text-slate-400 hover:text-red-500 p-2 rounded-lg"
                                                            >
                                                                <i className="fa-solid fa-trash-can text-base"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowViewDisciplineModal(false)}
                                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs sm:text-sm mt-5"
                                >
                                    ปิดหน้าต่าง
                                </button>
                            </div>
                        </div>
                    )}

                    {showAddTeacherModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-lg border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">บันทึกเพิ่มข้อมูลบุคลากรใหม่</h3>
                                    <button onClick={() => setShowAddTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newTeacher.name) return;
                                    const newId = String(users.length + 1);
                                    const u = { ...newTeacher, id: newId, lateCount: 0, forgotTimeCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0 };
                                    setUsers([...users, u]);

                                    if (newTeacher.photo && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: newId,
                                                base64: newTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowAddTeacherModal(false);
                                    showToast(`เพิ่มข้อมูลบุคลากรเรียบร้อยแล้ว`);
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div className="flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        {newTeacher.photo ? (
                                            <img src={newTeacher.photo} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-700 shadow" />
                                        ) : (
                                            <div className="w-14 h-14 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-xl"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เลือกรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setNewTeacher({ ...newTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-slate-200 file:text-slate-800 hover:file:bg-slate-300 cursor-pointer"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={newTeacher.name}
                                            onChange={(e) => setNewTeacher({ ...newTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">บทบาทหน้าที่</label>
                                            <select 
                                                value={newTeacher.role}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, role: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 rounded-xl font-bold"
                                            >
                                                <option value="teacher">ครูผู้สอน</option>
                                                <option value="maid">แม่บ้าน</option>
                                                <option value="janitor">พ่อบ้าน</option>
                                                <option value="hr">ฝ่ายบุคคล (HR)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">รหัสผ่านเข้าใช้งาน</label>
                                            <input 
                                                type="text" 
                                                value={newTeacher.password}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, password: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกข้อมูลบุคลากร
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showEditTeacherModal && editingTeacher && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-lg border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">แก้ไขข้อมูลบุคลากร</h3>
                                    <button onClick={() => setShowEditTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    setUsers(users.map(u => u.id === editingTeacher.id ? editingTeacher : u));

                                    if (editingTeacher.photo && editingTeacher.photo.startsWith("data:image") && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: editingTeacher.id,
                                                base64: editingTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowEditTeacherModal(false);
                                    showToast("ปรับปรุงข้อมูลเรียบร้อยแล้ว");
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div className="flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        {editingTeacher.photo ? (
                                            <img src={editingTeacher.photo} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-700 shadow" />
                                        ) : (
                                            <div className="w-14 h-14 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-xl"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เปลี่ยนรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setEditingTeacher({ ...editingTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-slate-200 file:text-slate-800 hover:file:bg-slate-300 cursor-pointer"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={editingTeacher.name}
                                            onChange={(e) => setEditingTeacher({ ...editingTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">โควตาลากิจส่วนตัว</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.personalQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, personalQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">โควตาลาป่วย</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.sickQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, sickQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกปรับปรุงข้อมูล
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-navy-950 text-slate-400 py-8 text-center text-xs sm:text-sm mt-12 border-t border-emerald-700/30">
                        <p>© ๒๕๖๙ ระบบบริหารจัดการวันลาและสถิติการปฏิบัติงาน - โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์ (ปีการศึกษา {selectedYear})</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
