        function normalizeRole(rawRole, id = "") {
            const strId = String(id).trim();
            if (strId === "44") return "admin"; 
            if (strId === "25") return "hr";    
            
            if (!rawRole) return "teacher";
            const str = String(rawRole).toLowerCase().trim();
            if (str.includes("admin") || str.includes("แอดมิน") || str.includes("ผู้ดูแล")) return "admin";
            if (str.includes("hr") || str.includes("บุคคล")) return "hr";
            if (str.includes("maid") || str.includes("แม่บ้าน")) return "maid";
            if (str.includes("janitor") || str.includes("พ่อบ้าน") || str.includes("ภารโรง")) return "janitor";
            return "teacher";
        }

        function getNthSaturdayOfMonth(dateObj) {
            if (dateObj.getDay() !== 6) return 0;
            const day = dateObj.getDate();
            return Math.ceil(day / 7);
        }

        function isMaidSaturdayOff(teacherId, dateObj) {
            if (dateObj.getDay() !== 6) return false;
            const nthSat = getNthSaturdayOfMonth(dateObj);
            const strId = String(teacherId);

            if (nthSat === 1 && (strId === "52" || strId === "57")) return true;
            if (nthSat === 2 && (strId === "53" || strId === "54")) return true;
            if (nthSat === 3 && (strId === "56" || strId === "60")) return true;
            if (nthSat === 4 && strId === "55") return true;
            return false;
        }

            const handleImageUpload = (file, callback) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 240;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64Str = canvas.toDataURL('image/jpeg', 0.85);
                        callback(base64Str);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            const showToast = (message, type = "success") => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const triggerConfirm = (title, message, onConfirmCallback) => {
                setConfirmDialog({
                    isOpen: true,
                    title,
                    message,
                    onConfirm: () => {
                        onConfirmCallback();
                        setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null });
                    }
                });
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const input = loginId.trim().toLowerCase();
                const matched = users.find(u => 
                    (u.email && u.email.toLowerCase() === input) || 
                    (String(u.id).toLowerCase() === input)
                );
                
                if (matched && matched.password === loginPassword) {
                    const normalizedUser = { ...matched, role: normalizeRole(matched.role, matched.id) };
                    setCurrentUser(normalizedUser);
                    showToast(`ยินดีต้อนรับ ${normalizedUser.prefix}${normalizedUser.name}`);
                    setLoginId("");
                    setLoginPassword("");

                    if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                        fetch(GOOGLE_SHEET_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                action: "loginNotify",
                                teacherId: normalizedUser.id,
                                name: `${normalizedUser.prefix}${normalizedUser.name}`,
                                role: normalizedUser.role === 'admin' ? 'ผู้ดูแลระบบสูงสุด' : normalizedUser.role === 'hr' ? 'เจ้าหน้าที่งานบุคคล' : 'ครูผู้สอน / บุคลากร',
                                loginTime: new Date().toLocaleString("th-TH")
                            })
                        }).catch(err => console.warn("Login notify note:", err));
                    }
                } else {
                    showToast("ข้อมูลประจำตัวหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง", "error");
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                showToast("ออกจากระบบเรียบร้อยแล้ว");
            };

            const formatThaiDate = (dateStr) => {
                if (!dateStr) return "-";
                const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = new Date(dateStr);
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            const getLocalDateString = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const isNonWorkingDay = (dateObj, targetUser) => {
                const dateStr = getLocalDateString(dateObj);
                const dayOfWeek = dateObj.getDay();

                if (holidays.some(h => h.date === dateStr)) return true;

                const userRole = normalizeRole(targetUser ? targetUser.role : "teacher", targetUser ? targetUser.id : "");

                if (userRole === "maid" || userRole === "janitor") {
                    if (dayOfWeek === 0) return true; 
                    if (dayOfWeek === 6) { 
                        return isMaidSaturdayOff(targetUser.id, dateObj);
                    }
                    return false;
                } else {
                    return dayOfWeek === 0 || dayOfWeek === 6;
                }
            };

            const getHolidayName = (dateStr) => {
                const hol = holidays.find(h => h.date === dateStr);
                return hol ? hol.name : "";
            };
            const getSchoolActivity = (dateStr) => activities.find(a => a.date === dateStr);

            const calculateLeaveDays = (startDateStr, endDateStr, period = "all_day", targetUser = selectedTeacher) => {
                const actualEndDateStr = period !== "all_day" ? startDateStr : endDateStr;
                if (!startDateStr || !actualEndDateStr || !targetUser) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };
                
                const start = new Date(startDateStr);
                const end = new Date(actualEndDateStr);
                if (end < start) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };

                const breakdown = [];
                let totalDeducted = 0;
                let totalDutyFee = 0;

                const userRole = normalizeRole(targetUser.role, targetUser.id);
                const isMaidOrJanitor = userRole === "maid" || userRole === "janitor";

                let current = new Date(start.getTime());
                while (current <= end) {
                    const dateStr = getLocalDateString(current);
                    const dayOfWeek = current.getDay(); 

                    if (isNonWorkingDay(current, targetUser)) {
                        const hName = getHolidayName(dateStr);
                        const reasonLabel = hName ? `วันหยุดราชการ (${hName})` : "วันหยุดประจำสัปดาห์";
                        breakdown.push({ date: dateStr, base: 0, penaltyReason: reasonLabel, final: 0 });
                    } else {
                        let baseDeduction = 1.0;
                        let reason = "อัตราการลาตามเกณฑ์ปกติ";

                        const schoolActivity = getSchoolActivity(dateStr);
                        const isMeetingDay = schoolActivity && (schoolActivity.name.includes("ประชุม") || schoolActivity.name.includes("ฉันท์พี่น้อง"));

                        if (!isMaidOrJanitor && isMeetingDay) {
                            if (period === "afternoon") {
                                baseDeduction = 1.5;
                                reason = "ตรงวันประชุมพบกันฉันท์พี่น้อง (ช่วงครึ่งวันบ่าย)";
                            } else if (period === "all_day") {
                                baseDeduction = 2.0;
                                reason = "ตรงวันประชุมพบกันฉันท์พี่น้อง (เต็มวัน)";
                            }
                        } else if (schoolActivity) {
                            const isActivityAllDay = schoolActivity.session === "all_day";
                            if (period === "all_day") {
                                baseDeduction = isActivityAllDay ? 2.0 : 1.5;
                                reason = `ตรงวันกิจกรรมพิเศษประจำโรงเรียน (${schoolActivity.name})`;
                            } else {
                                baseDeduction = isActivityAllDay ? 1.5 : 1.0;
                                reason = `ตรงวันกิจกรรมพิเศษประจำโรงเรียน (${schoolActivity.name}) [ครึ่งวัน]`;
                            }
                        } 
                        else {
                            if (period === "all_day") {
                                if (dayOfWeek === 5 || dayOfWeek === 1) { 
                                    baseDeduction = 2.0;
                                    reason = "ลาเต็มวันติดวันหยุดเสาร์-อาทิตย์";
                                } else {
                                    baseDeduction = 1.0;
                                    reason = "เต็มวันปกติ";
                                }
                            } else if (period === "afternoon" && dayOfWeek === 5) { 
                                baseDeduction = 1.5;
                                reason = "ลาครึ่งวันบ่ายติดวันเสาร์";
                            } else if (period === "morning" && dayOfWeek === 1) { 
                                baseDeduction = 1.5;
                                reason = "ลาครึ่งวันเช้าติดวันอาทิตย์";
                            } else {
                                baseDeduction = 0.5;
                                reason = "ลาครึ่งวันปกติ";
                            }
                        }

                        if (!isMaidOrJanitor) {
                            totalDutyFee += (period !== "all_day" ? 50 : 100);
                        }

                        breakdown.push({ date: dateStr, base: period !== "all_day" ? 0.5 : 1.0, penaltyReason: reason, final: baseDeduction });
                        totalDeducted += baseDeduction;
                    }
                    current.setDate(current.getDate() + 1);
                }
                return { total: totalDeducted, breakdown, dutyFeeDeduction: totalDutyFee };
            };

            const leaveCalculation = calculateLeaveDays(formData.startDate, formData.endDate, formData.period, selectedTeacher);

            const handleRequestLeave = (e) => {
                e.preventDefault();
                if (!formData.startDate || !formData.reason) {
                    showToast("กรุณากรอกข้อมูลวันที่และเหตุผลการลาให้ครบถ้วน", "error");
                    return;
                }

                const targetTeacher = users.find(u => String(u.id) === String(selectedTeacherId));
                const stats = getTeacherStats(selectedTeacherId);
                const calc = calculateLeaveDays(formData.startDate, formData.endDate, formData.period, targetTeacher);

                if (calc.total === 0) {
                    showToast("วันที่เลือกเป็นวันหยุดประจำสัปดาห์หรือวันหยุดราชการ ไม่คิดหักวันลา", "error");
                    return;
                }

                const typeThaiName = formData.type === "personal" ? "ลากิจส่วนตัว" : "ลาป่วย";
                const periodThaiName = formData.period === "all_day" ? "เต็มวัน" : (formData.period === "morning" ? "ครึ่งวันเช้า" : "ครึ่งวันบ่าย");

                const newRequest = {
                    id: "L" + Date.now().toString().slice(-6),
                    teacherId: selectedTeacherId,
                    teacherName: `${targetTeacher.prefix}${targetTeacher.name}`,
                    startDate: formData.startDate,
                    endDate: formData.period !== "all_day" ? formData.startDate : formData.endDate,
                    type: formData.type,
                    typeThai: typeThaiName,
                    period: formData.period,
                    periodThai: periodThaiName,
                    reason: formData.reason,
                    totalDeducted: calc.total,
                    dutyFeeDeduction: calc.dutyFeeDeduction,
                    status: "อนุมัติแล้ว",
                    breakdown: calc.breakdown,
                    createdAt: getLocalDateString(new Date())
                };

                setLeaves([newRequest, ...leaves]);
                setFormData({ startDate: "", endDate: "", type: "personal", reason: "", period: "all_day" });
                showToast("ยื่นคำขอและบันทึกประวัติวันลาเรียบร้อยแล้ว");

                if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: "requestLeave",
                            id: newRequest.id,
                            teacherId: newRequest.teacherId,
                            teacherName: newRequest.teacherName,
                            startDate: newRequest.startDate,
                            endDate: newRequest.endDate,
                            type: typeThaiName, 
                            period: periodThaiName, 
                            reason: newRequest.reason,
                            totalDeducted: newRequest.totalDeducted,
                            status: "อนุมัติแล้ว",
                            breakdown: newRequest.breakdown,
                            createdAt: newRequest.createdAt,
                            dutyFeeDeduction: newRequest.dutyFeeDeduction
                        })
                    }).catch(err => console.warn("Sheet save note:", err));
                }
            };

            const handleDeleteLeave = (leaveId) => {
                triggerConfirm(
                    "ยืนยันการยกเลิกรายการใบขอลา",
                    "ระบบจะทำการคืนสิทธิ์วันลาให้บุคลากรโดยอัตโนมัติ",
                    () => {
                        setLeaves(leaves.filter(l => l.id !== leaveId));
                        showToast("ยกเลิกรายการและคืนสิทธิ์วันลาเรียบร้อยแล้ว");

                        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                            fetch(GOOGLE_SHEET_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: "deleteLeave", leaveId })
                            }).catch(err => console.warn("Sheet delete note:", err));
                        }
                    }
                );
            };

            const handleUpdateDisciplineCount = (teacherId, field, delta) => {
                setUsers(users.map(u => {
                    if (String(u.id) === String(teacherId)) {
                        const currentVal = Number(u[field] || 0);
                        const newVal = Math.max(0, currentVal + delta);
                        const updated = { ...u, [field]: newVal };

                        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                            fetch(GOOGLE_SHEET_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: "updateCount", teacherId: teacherId, field: field, count: newVal })
                            }).catch(err => console.warn("Update note:", err));
                        }
                        return updated;
                    }
                    return u;
                }));
                showToast("ปรับปรุงสถิติตามข้อบังคับเรียบร้อยแล้ว");
            };

            const handleUpdateUserField = (teacherId, actionType, fieldValue) => {
                setUsers(users.map(u => {
                    if (String(u.id) === String(teacherId)) {
                        let updated = { ...u };
                        if (actionType === "updateRole") updated.role = fieldValue;
                        if (actionType === "updatePassword") updated.password = fieldValue;
                        if (actionType === "updateEmail") updated.email = fieldValue;

                        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                            fetch(GOOGLE_SHEET_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    action: actionType,
                                    teacherId: teacherId,
                                    role: actionType === "updateRole" ? fieldValue : undefined,
                                    password: actionType === "updatePassword" ? fieldValue : undefined,
                                    email: actionType === "updateEmail" ? fieldValue : undefined
                                })
                            }).catch(err => console.warn("Sync user field note:", err));
                        }
                        return updated;
                    }
                    return u;
                }));
                showToast("บันทึกการปรับเปลี่ยนเรียบร้อยแล้ว");
            };

            const handleAddDisciplineLog = (e) => {
                e.preventDefault();
                if (!disciplineForm.teacherId || !disciplineForm.date) {
                    showToast("กรุณากรอกข้อมูลวันที่และบุคลากรให้ครบถ้วน", "error");
                    return;
                }

                const logTypeLabels = {
                    late: "เข้าปฏิบัติงานสาย",
                    forgotTime: "ลืมบันทึกเวลาเข้า-ออกงาน",
                    middayShort: "ออกนอกสถานที่ 1.01 - 1.30 ชั่วโมง (นับว่ามาสาย 1 ครั้ง)",
                    middayLong: "ออกนอกสถานที่ตั้งแต่ 1.31 ชั่วโมงขึ้นไป (หักลากิจ 0.5 วัน)",
                    missedMeeting: "ขาดการประชุมพบกันฉันท์พี่น้อง (หักลากิจ 1 วัน)"
                };

                const newLog = {
                    id: "LOG" + Date.now(),
                    teacherId: disciplineForm.teacherId,
                    date: disciplineForm.date,
                    type: disciplineForm.type,
                    typeName: logTypeLabels[disciplineForm.type] || disciplineForm.type,
                    note: disciplineForm.note || "ไม่มีระบุหมายเหตุ",
                    createdAt: getLocalDateString(new Date())
                };

                setDisciplineLogs([newLog, ...disciplineLogs]);

                const fieldMapping = {
                    late: "lateCount",
                    forgotTime: "forgotTimeCount",
                    middayShort: "middayOutShortCount",
                    middayLong: "middayOutLongCount",
                    missedMeeting: "missedMeetingCount"
                };

                if (fieldMapping[disciplineForm.type]) {
                    handleUpdateDisciplineCount(disciplineForm.teacherId, fieldMapping[disciplineForm.type], 1);
                }

                setShowAddDisciplineModal(false);
                setDisciplineForm({ teacherId: "", date: "", type: "forgotTime", note: "" });
                showToast("ลงบันทึกประวัติตามวันที่เรียบร้อยแล้ว");
            };

            const renderAvatar = (teacherObj, sizeClass = "w-12 h-12 text-sm") => {
                if (teacherObj && teacherObj.photo) {
                    return (
                        <div className="relative flex-shrink-0">
                            <img 
                                src={teacherObj.photo} 
                                alt={teacherObj.name} 
                                className={`${sizeClass.split(' ')[0]} ${sizeClass.split(' ')[1]} rounded-full object-cover border-2 border-emerald-700 shadow-sm`}
                                onError={(e) => {
                                    e.target.style.display = 'none';
                                    if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                                }}
                            />
                            <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold items-center justify-center border-2 border-white shadow-sm uppercase text-center flex-shrink-0 hidden`}>
                                {teacherObj.name ? teacherObj.name.trim().charAt(0) : "?"}
                            </div>
                        </div>
                    );
                }
                const initialChar = teacherObj && teacherObj.name ? teacherObj.name.trim().charAt(0) : "?";
                return (
                    <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold flex items-center justify-center border-2 border-white shadow-sm uppercase text-center flex-shrink-0`}>
                        {initialChar}
                    </div>
                );
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 relative font-['Sarabun']">
                        <div className="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
                            <header className="luxury-gradient text-white p-8 text-center relative border-b-4 border-emerald-700">
                                <div className="w-24 h-24 flex items-center justify-center mx-auto mb-4">
                                    <img 
                                        src="logo.png" 
                                        alt="Yuwapat Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            if (e.target.src.indexOf('logo.png') !== -1) {
                                                e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                            }
                                        }}
                                    />
                                </div>
                                <h2 className="text-xl font-extrabold tracking-wide text-white">Yuwapat Early Childhood School</h2>
                                <p className="text-sm text-emerald-100 mt-1.5 font-medium">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                                <p className="text-xs text-slate-300 mt-1">ระบบบริหารจัดการวันลาและสถิติการปฏิบัติงานบุคลากร</p>
                            </header>

                            {notification && (
                                <div className="mx-8 mt-5 p-4 text-xs sm:text-sm rounded-xl border flex items-center gap-3 bg-red-50 text-red-800 border-red-200">
                                    <i className="fa-solid fa-circle-exclamation text-red-500 text-lg"></i>
                                    <span className="font-semibold">{notification.message}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="p-8 space-y-5">
                                <div className="space-y-1.5 text-left">
                                    <label className="block text-slate-700 text-xs sm:text-sm font-bold uppercase tracking-wide">อีเมลสังกัดโรงเรียน / รหัสประจำตัว</label>
                                    <input 
                                        type="text" 
                                        placeholder="กรอกรหัสประจำตัว หรือ Username"
                                        value={loginId}
                                        onChange={(e) => setLoginId(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-4 py-3.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700 text-sm sm:text-base font-semibold"
                                        required
                                    />
                                </div>

                                <div className="space-y-1.5 text-left">
                                    <label className="block text-slate-700 text-xs sm:text-sm font-bold uppercase tracking-wide">รหัสผ่านเข้าสู่ระบบ</label>
                                    <input 
                                        type="password" 
                                        placeholder="กรอกรหัสผ่าน (เริ่มต้น 1234)"
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-4 py-3.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-700 text-sm sm:text-base font-semibold"
                                        required
                                    />
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition duration-200 shadow-md text-sm sm:text-base uppercase tracking-wider mt-2"
                                >
                                    เข้าสู่ระบบความปลอดภัย
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const currentRole = normalizeRole(currentUser.role, currentUser.id);
            const isAdminOrHr = currentRole === "admin" || currentRole === "hr";

            // STREAMING_CHUNK:Rendering main navbar with FontAwesome icons and action header...
            return (
                <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
                    
                    <header className="luxury-gradient text-white shadow-xl sticky top-0 z-30 border-b border-emerald-700/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                            
                            <div className="flex items-center gap-3.5">
                                <div className="w-14 h-14 flex items-center justify-center flex-shrink-0">
                                    <img 
                                        src="logo.png" 
                                        alt="Yuwapat Logo" 
                                        className="w-full h-full object-contain"
                                        onError={(e) => {
                                            if (e.target.src.indexOf('logo.png') !== -1) {
                                                e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                            }
                                        }}
                                    />
                                </div>
                                <div className="text-center sm:text-left">
                                    <h1 className="text-lg sm:text-xl font-bold tracking-wide text-white">Yuwapat Early Childhood School</h1>
                                    <p className="text-xs sm:text-sm text-emerald-200 font-medium">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 flex-wrap justify-center">
                                {isAdminOrHr && (
                                    <div className="flex bg-navy-950 p-1.5 rounded-xl border border-emerald-700/40">
                                        <button 
                                            onClick={() => setActiveTab("teacher")}
                                            className={`px-4 py-2.5 rounded-lg text-xs sm:text-sm font-bold transition flex items-center gap-2 ${activeTab === 'teacher' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                        >
                                            <i className="fa-solid fa-user"></i>
                                            พอร์ทัลบุคลากร
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab("admin")}

                                        <h4 className="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                                            <i className="fa-solid fa-clock-rotate-left text-emerald-700"></i>
                                            รายการบันทึกข้อบกพร่องตามวันที่
                                        </h4>

                                        {disciplineLogs.filter(l => String(l.teacherId) === String(viewDisciplineTeacher.id)).length === 0 ? (
                                            <div className="text-center py-8 bg-slate-50 rounded-2xl border border-slate-200 text-slate-400">
                                                <p className="font-semibold text-xs sm:text-sm">ไม่มีรายการบันทึกข้อบกพร่องตามวันที่ย้อนหลัง</p>
                                            </div>
                                        ) : (
                                            <div className="space-y-3">
                                                {disciplineLogs.filter(l => String(l.teacherId) === String(viewDisciplineTeacher.id)).map((log) => (
                                                    <div key={log.id} className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex justify-between items-center text-xs sm:text-sm">
                                                        <div>
                                                            <span className="font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-full text-xs">
                                                                {log.typeName}
                                                            </span>
                                                            <p className="font-bold text-slate-800 mt-2">{formatThaiDate(log.date)}</p>
                                                            <p className="text-xs text-slate-500 mt-0.5">{log.note}</p>
                                                        </div>
                                                        {isAdminOrHr && (
                                                            <button 
                                                                onClick={() => {
                                                                    setDisciplineLogs(disciplineLogs.filter(item => item.id !== log.id));
                                                                    showToast("ลบรายการเรียบร้อยแล้ว");
                                                                }}
                                                                className="text-slate-400 hover:text-red-500 p-2 rounded-lg"
                                                            >
                                                                <i className="fa-solid fa-trash-can text-base"></i>
                                                            </button>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setShowViewDisciplineModal(false)}
                                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl text-xs sm:text-sm mt-5"
                                >
                                    ปิดหน้าต่าง
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal เพิ่มพนักงานใหม่ */}
                    {showAddTeacherModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-lg border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">บันทึกเพิ่มข้อมูลบุคลากรใหม่</h3>
                                    <button onClick={() => setShowAddTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newTeacher.name) return;
                                    const newId = String(users.length + 1);
                                    const u = { ...newTeacher, id: newId, lateCount: 0, forgotTimeCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0 };
                                    setUsers([...users, u]);

                                    if (newTeacher.photo && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: newId,
                                                base64: newTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowAddTeacherModal(false);
                                    showToast(`เพิ่มข้อมูลบุคลากรเรียบร้อยแล้ว`);
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div className="flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        {newTeacher.photo ? (
                                            <img src={newTeacher.photo} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-700 shadow" />
                                        ) : (
                                            <div className="w-14 h-14 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-xl"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เลือกรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setNewTeacher({ ...newTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-xs text-slate-500"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={newTeacher.name}
                                            onChange={(e) => setNewTeacher({ ...newTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">บทบาทหน้าที่</label>
                                            <select 
                                                value={newTeacher.role}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, role: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 rounded-xl font-bold"
                                            >
                                                <option value="teacher">ครูผู้สอน</option>
                                                <option value="maid">แม่บ้าน</option>
                                                <option value="janitor">พ่อบ้าน</option>
                                                <option value="hr">ฝ่ายบุคคล (HR)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">รหัสผ่านเข้าใช้งาน</label>
                                            <input 
                                                type="text" 
                                                value={newTeacher.password}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, password: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกข้อมูลบุคลากร
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal แก้ไขพนักงาน */}
                    {showEditTeacherModal && editingTeacher && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-lg border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">แก้ไขข้อมูลบุคลากร</h3>
                                    <button onClick={() => setShowEditTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    setUsers(users.map(u => u.id === editingTeacher.id ? editingTeacher : u));

                                    if (editingTeacher.photo && editingTeacher.photo.startsWith("data:image") && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: editingTeacher.id,
                                                base64: editingTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowEditTeacherModal(false);
                                    showToast("ปรับปรุงข้อมูลเรียบร้อยแล้ว");
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div className="flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        {editingTeacher.photo ? (
                                            <img src={editingTeacher.photo} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-700 shadow" />
                                        ) : (
                                            <div className="w-14 h-14 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-xl"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เปลี่ยนรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setEditingTeacher({ ...editingTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-xs text-slate-500"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={editingTeacher.name}
                                            onChange={(e) => setEditingTeacher({ ...editingTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">โควตาลากิจส่วนตัว</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.personalQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, personalQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">โควตาลาป่วย</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.sickQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, sickQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกปรับปรุงข้อมูล
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal เพิ่มวันหยุด */}
                    {showAddHolidayModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">เพิ่มวันหยุดราชการประจำปฏิทิน</h3>
                                    <button onClick={() => setShowAddHolidayModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newHoliday.date || !newHoliday.name) return;
                                    setHolidays([...holidays, newHoliday]);
                                    setNewHoliday({ date: "", name: "" });
                                    setShowAddHolidayModal(false);
                                    showToast("เพิ่มวันหยุดเรียบร้อยแล้ว");
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">เลือกวันที่</label>
                                        <input 
                                            type="date" 
                                            value={newHoliday.date}
                                            onChange={(e) => setNewHoliday({ ...newHoliday, date: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อวันหยุดราชการ</label>
                                        <input 
                                            type="text" 
                                            placeholder="วันสงกรานต์, วันเข้าพรรษา..."
                                            value={newHoliday.name}
                                            onChange={(e) => setNewHoliday({ ...newHoliday, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกวันหยุด
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal เพิ่มกิจกรรม */}
                    {showAddActivityModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">เพิ่มกิจกรรมพิเศษประจำโรงเรียน</h3>
                                    <button onClick={() => setShowAddActivityModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newActivity.date || !newActivity.name) return;
                                    setActivities([...activities, newActivity]);
                                    setNewActivity({ date: "", name: "", session: "morning" });
                                    setShowAddActivityModal(false);
                                    showToast("บันทึกวันกิจกรรมเรียบร้อยแล้ว");
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">เลือกวันที่จัดกิจกรรม</label>
                                        <input 
                                            type="date" 
                                            value={newActivity.date}
                                            onChange={(e) => setNewActivity({ ...newActivity, date: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อกิจกรรมประจำโรงเรียน</label>
                                        <input 
                                            type="text" 
                                            placeholder="พิธีไหว้ครู, กิจกรรมวันสัปดาห์วิทยาศาสตร์..."
                                            value={newActivity.name}
                                            onChange={(e) => setNewActivity({ ...newActivity, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ช่วงเวลาจัดกิจกรรม</label>
                                        <select 
                                            value={newActivity.session}
                                            onChange={(e) => setNewActivity({ ...newActivity, session: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 rounded-xl font-bold"
                                        >
                                            <option value="morning">ครึ่งวันเช้า</option>
                                            <option value="afternoon">ครึ่งวันบ่าย</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-navy-900 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกวันกิจกรรม
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-navy-950 text-slate-400 py-8 text-center text-xs sm:text-sm mt-12 border-t border-emerald-700/30">
                        <p>© ๒๕๖๙ ระบบบริหารจัดการวันลาและสถิติการปฏิบัติงาน - โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
