        // ☀️ ช่วงเวลา Summer Course
        const SUMMER_COURSES = [
            { start: "2026-09-28", end: "2026-10-09", name: "Summer Course October 2026" },
            { start: "2027-03-01", end: "2027-03-26", name: "Summer Course March 2027" }
        ];

        function isDateInSummer(dateStr) {
            return SUMMER_COURSES.some(s => dateStr >= s.start && dateStr <= s.end);
        }

        // ฟังก์ชันค้นหาฟิลด์แบบยืดหยุ่นสูง (Case & Language insensitive)
        function getField(obj, ...keys) {
            if (!obj || typeof obj !== "object") return undefined;
            for (const k of keys) {
                if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== "") {
                    return obj[k];
                }
            }
            const normalizedLookup = keys.map(k => String(k).toLowerCase().replace(/[\s_\-]/g, ""));
            for (const [prop, val] of Object.entries(obj)) {
                const normProp = String(prop).toLowerCase().replace(/[\s_\-]/g, "");
                if (normalizedLookup.includes(normProp) && val !== undefined && val !== null && String(val).trim() !== "") {
                    return val;
                }
            }
            return undefined;
        }

        // คำนวณปีการศึกษาจากวันที่ (๑ พ.ค. - ๓๐ เม.ย.)
        function getAcademicYearFromDate(dateStr) {
            if (!dateStr) return "2569";
            const str = String(dateStr).trim();
            let year = 2026, month = 5;

            if (str.includes("-")) {
                const parts = str.split("-");
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10);
                } else if (parts[2] && parts[2].length >= 4) {
                    year = parseInt(parts[2], 10);
                    month = parseInt(parts[1], 10);
                }
            } else if (str.includes("/")) {
                const parts = str.split("/");
                if (parts[0].length === 4) {
                    year = parseInt(parts[0], 10);
                    month = parseInt(parts[1], 10);
                } else if (parts[2] && parts[2].length >= 4) {
                    year = parseInt(parts[2], 10);
                    month = parseInt(parts[1], 10);
                }
            }

            if (year > 2400) {
                return String(month >= 5 ? year : year - 1);
            }
            const beYear = month >= 5 ? (year + 543) : (year - 1 + 543);
            return String(beYear);
        }

        function normalizeRole(rawRole, id = "") {
            const strId = String(id).trim();
            if (strId === "44") return "admin"; 
            if (strId === "25") return "hr";    
            if (!rawRole) return "teacher";
            const str = String(rawRole).toLowerCase().trim();
            if (str.includes("admin") || str.includes("แอดมิน")) return "admin";
            if (str.includes("hr") || str.includes("บุคคล")) return "hr";
            if (str.includes("maid") || str.includes("แม่บ้าน")) return "maid";
            if (str.includes("janitor") || str.includes("พ่อบ้าน")) return "janitor";
            return "teacher";
        }

        function getNthSaturdayOfMonth(dateObj) {
            if (dateObj.getDay() !== 6) return 0;
            return Math.ceil(dateObj.getDate() / 7);
        }

        function isMaidSaturdayOff(teacherId, dateObj) {
            if (dateObj.getDay() !== 6) return false;
            const nthSat = getNthSaturdayOfMonth(dateObj);
            const strId = String(teacherId);

            if (nthSat === 1 && (strId === "52" || strId === "57")) return true;
            if (nthSat === 2 && (strId === "53" || strId === "54")) return true;
            if (nthSat === 3 && (strId === "56" || strId === "60")) return true;
            if (nthSat === 4 && strId === "55") return true;
            return false;
        }

            React.useEffect(() => { localStorage.setItem("leave_users", JSON.stringify(users)); }, [users]);
            React.useEffect(() => { localStorage.setItem("leave_holidays_all", JSON.stringify(allHolidays)); }, [allHolidays]);
            React.useEffect(() => { localStorage.setItem("leave_activities_all", JSON.stringify(allActivities)); }, [allActivities]);
            React.useEffect(() => { localStorage.setItem("leave_leaves", JSON.stringify(leaves)); }, [leaves]);
            React.useEffect(() => { localStorage.setItem("leave_discipline_logs", JSON.stringify(disciplineLogs)); }, [disciplineLogs]);
            React.useEffect(() => { if (activeTab) localStorage.setItem("leave_active_tab", activeTab); }, [activeTab]);
            React.useEffect(() => { if (adminSubTab) localStorage.setItem("leave_admin_sub_tab", adminSubTab); }, [adminSubTab]);
            React.useEffect(() => { if (selectedTeacherId) localStorage.setItem("leave_selected_teacher_id", selectedTeacherId); }, [selectedTeacherId]);

            // กรองวันหยุดและกิจกรรมตามปีการศึกษาที่เลือก
            const currentYearHolidays = React.useMemo(() => {
                return allHolidays.filter(h => {
                    const y = h.academicYear || h.AcademicYear || getAcademicYearFromDate(h.date);
                    return String(y) === String(selectedYear);
                });
            }, [allHolidays, selectedYear]);

            const currentYearActivities = React.useMemo(() => {
                return allActivities.filter(a => {
                    const y = a.academicYear || a.AcademicYear || getAcademicYearFromDate(a.date);
                    return String(y) === String(selectedYear);
                });
            }, [allActivities, selectedYear]);

            // กรองใบลาตามปีการศึกษาที่เลือก
            const currentYearLeaves = React.useMemo(() => {
                return leaves.filter(l => {
                    const y = l.academicYear || l.AcademicYear || getAcademicYearFromDate(l.startDate);
                    return String(y) === String(selectedYear);
                });
            }, [leaves, selectedYear]);

            // 🔄 ฟังก์ชันดึงข้อมูลจาก Google Sheets (เพิ่ม Cache-Busting + ขยาย Timeout ป้องกันหลุดในเครื่องอื่น)
            const fetchSheetData = React.useCallback(async (showNotification = false) => {
                if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) return;
                setIsSyncing(true);
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 25000); // 25 วินาทีรองรับ cold start

                    // เพิ่มพารามิเตอร์ ?nocache ป้องกันเบราว์เซอร์เครื่องอื่นจำแคชว่างเปล่า
                    const cacheBusterUrl = `${GOOGLE_SHEET_URL}?nocache=${Date.now()}`;
                    const response = await fetch(cacheBusterUrl, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (!response.ok) throw new Error("HTTP error " + response.status);

                    const data = await response.json();
                    
                    // 1. ซิงก์ Users
                    if (data.users && Array.isArray(data.users) && data.users.length > 0) {
                        const mappedUsers = data.users.map(u => {
                            const userId = String(getField(u, "ID", "id", "รหัส", "รหัสประจำตัว", "ลำดับ") || "").trim();
                            const sickVal = getField(u, "SickQuota", "sickQuota", "sickquota", "โควตาลาป่วย", "สิทธิ์ลาป่วย", "ลาป่วย", "sick_quota");
                            const personalVal = getField(u, "PersonalQuota", "personalQuota", "personalquota", "โควตาลากิจ", "โควตาลากิจส่วนตัว", "สิทธิ์ลากิจ", "ลากิจ", "personal_quota");

                            return {
                                id: userId,
                                prefix: String(getField(u, "Prefix", "prefix", "คำนำหน้า", "คำนำหน้านาม") || ""),
                                name: String(getField(u, "Name", "name", "ชื่อ", "ชื่อ-นามสกุล", "ชื่อ นามสกุล") || ""),
                                role: normalizeRole(getField(u, "Role", "role", "ตำแหน่ง", "หน้าที่"), userId),
                                password: String(getField(u, "Password", "password", "รหัสผ่าน") !== undefined ? getField(u, "Password", "password", "รหัสผ่าน") : "1234"),
                                email: String(getField(u, "Email", "email", "อีเมล", "username") || ""),
                                sickQuota: sickVal !== undefined ? Number(sickVal) : 30,
                                personalQuota: personalVal !== undefined ? Number(personalVal) : 15,
                                lateCount: Number(getField(u, "LateCount", "lateCount", "latecount", "สาย", "มาสาย") || 0),
                                forgotTimeCount: Number(getField(u, "ForgotTimeCount", "forgotTimeCount", "forgottimecount", "ลืมสแกน", "ลืมบันทึกเวลา") || 0),
                                middayOutShortCount: Number(getField(u, "MiddayOutShortCount", "middayOutShortCount", "middayoutshortcount") || 0),
                                middayOutLongCount: Number(getField(u, "MiddayOutLongCount", "middayOutLongCount", "middayoutlongcount") || 0),
                                missedMeetingCount: Number(getField(u, "MissedMeetingCount", "missedMeetingCount", "missedmeetingcount") || 0),
                                photo: String(getField(u, "Photo", "photo", "รูป", "รูปภาพ") || ""),
                                hireDate: String(getField(u, "HireDate", "hireDate", "hiredate", "วันที่เริ่มงาน") || "")
                            };
                        }).filter(validU => validU.id && validU.name);

                        if (mappedUsers.length > 0) {
                            setUsers(mappedUsers);
                            localStorage.setItem("leave_users", JSON.stringify(mappedUsers));
                        }
                    }

                    // 2. ซิงก์ Leaves
                    if (data.leaves && Array.isArray(data.leaves)) {
                        const mappedLeaves = data.leaves.map(l => {
                            let parsedBreakdown = getField(l, "Breakdown", "breakdown", "รายละเอียด") || "";
                            if (typeof parsedBreakdown === "string" && parsedBreakdown.trim().startsWith("[")) {
                                try { parsedBreakdown = JSON.parse(parsedBreakdown); } catch (e) {}
                            }
                            
                            const rawType = String(getField(l, "Type", "type", "ประเภท", "ประเภทการลา") || "");
                            const mappedType = (rawType.includes("ป่วย") || rawType.toLowerCase() === "sick") ? "sick" : "personal";
                            const sDate = String(getField(l, "StartDate", "startDate", "startdate", "วันที่เริ่ม", "วันที่เริ่มลา") || "");
                            const eDate = String(getField(l, "EndDate", "endDate", "enddate", "สิ้นสุดวันที่", "วันที่สิ้นสุด") || sDate);
                            const acYear = String(getField(l, "AcademicYear", "academicYear", "academicyear", "ปีการศึกษา") || getAcademicYearFromDate(sDate));
                            const deductedVal = getField(l, "TotalDeducted", "totalDeducted", "totaldeducted", "ยอดหัก", "ยอดหักวันลา", "วันลาที่หัก");

                            return {
                                id: String(getField(l, "ID", "id", "รหัสใบลา") || ""),
                                teacherId: String(getField(l, "TeacherID", "teacherId", "teacherid", "รหัสครู", "รหัสบุคลากร", "รหัส") || "").trim(),
                                teacherName: String(getField(l, "TeacherName", "teacherName", "teachername", "ชื่อครู", "ชื่อ-นามสกุล") || ""),
                                startDate: sDate,
                                endDate: eDate,
                                type: mappedType,
                                period: String(getField(l, "Period", "period", "ช่วงเวลา", "ช่วง") || "all_day"),
                                reason: String(getField(l, "Reason", "reason", "เหตุผล", "ความจำเป็น") || ""),
                                totalDeducted: deductedVal !== undefined ? Number(deductedVal) : 1,
                                status: String(getField(l, "Status", "status", "สถานะ") || "อนุมัติแล้ว"),
                                breakdown: parsedBreakdown,
                                createdAt: String(getField(l, "CreatedAt", "createdAt", "createdat", "วันที่บันทึก") || ""),
                                dutyFeeDeduction: Number(getField(l, "DutyFeeDeduction", "dutyFeeDeduction", "dutyfeededuction", "หักค่าเวร") || 0),
                                summerFeeDeduction: Number(getField(l, "SummerFeeDeduction", "summerFeeDeduction", "summerfeededuction", "หักค่าสอนSummer") || 0),
                                academicYear: acYear
                            };
                        });
                        const validLeaves = mappedLeaves.filter(ml => ml.id || ml.startDate);
                        setLeaves(validLeaves);
                        localStorage.setItem("leave_leaves", JSON.stringify(validLeaves));
                    }

                    // 3. ซิงก์ Holidays
                    if (data.holidays && Array.isArray(data.holidays)) {
                        const mappedHolidays = data.holidays.map(h => {
                            const dStr = String(getField(h, "Date", "date", "วันที่") || "");
                            return {
                                date: dStr,
                                name: String(getField(h, "Name", "name", "ชื่อวันหยุด", "วันหยุด") || ""),
                                session: String(getField(h, "Session", "session", "ช่วงเวลา", "ช่วง") || "all_day"),
                                academicYear: String(getField(h, "AcademicYear", "academicYear", "academicyear", "ปีการศึกษา") || getAcademicYearFromDate(dStr))
                            };
                        }).filter(h => h.date && h.name);
                        setAllHolidays(mappedHolidays);
                        localStorage.setItem("leave_holidays_all", JSON.stringify(mappedHolidays));
                    }

                    // 4. ซิงก์ Activities
                    if (data.activities && Array.isArray(data.activities)) {
                        const mappedActivities = data.activities.map(a => {
                            const dStr = String(getField(a, "Date", "date", "วันที่") || "");
                            return {
                                date: dStr,
                                name: String(getField(a, "Name", "name", "ชื่อกิจกรรม", "กิจกรรม") || ""),
                                session: String(getField(a, "Session", "session", "ช่วงเวลา", "ช่วง") || "all_day"),
                                academicYear: String(getField(a, "AcademicYear", "academicYear", "academicyear", "ปีการศึกษา") || getAcademicYearFromDate(dStr))
                            };
                        }).filter(a => a.date && a.name);
                        setAllActivities(mappedActivities);
                        localStorage.setItem("leave_activities_all", JSON.stringify(mappedActivities));
                    }

                    setSyncStatus("success");
                    if (showNotification) {
                        setNotification({ message: `อัปเดตข้อมูลสดจาก Google Sheets เรียบร้อยแล้ว (บุคลากร ${data.users?.length || 0} ท่าน, ใบลา ${data.leaves?.length || 0} รายการ)`, type: "success" });
                        setTimeout(() => setNotification(null), 3000);
                    }
                } catch (error) {
                    console.warn("Google Sheet sync notice:", error.message || error);
                    setSyncStatus("error");
                    if (showNotification) {
                        setNotification({ message: "ไม่สามารถเชื่อมต่อ Google Sheets ได้ในขณะนี้ ระบบใช้ข้อมูลที่บันทึกไว้ล่าสุด", type: "error" });
                        setTimeout(() => setNotification(null), 4000);
                    }
                } finally {
                    setIsSyncing(false);
                }
            }, []);

            // อัปเดตข้อมูล Session แบบเรียลไทม์: หากข้อมูล User ในระบบมีการเปลี่ยนแปลง (เช่น แอดมินเปลี่ยน Role) จะปรับอัปเดตลง Session ด้วย
            React.useEffect(() => {
                // 1. ดึงข้อมูลทันทีเมื่อเปิดหน้าเว็บไซต์ครั้งแรก
                fetchSheetData(false);

                // 2. 🔄 ระบบ Auto-Sync: แอบดึงข้อมูลใหม่จาก Google Sheets ทุกๆ 30 วินาที
                const pollingInterval = setInterval(() => {
                    // ใส่ false เพื่อให้มันดึงข้อมูลเงียบๆ เบื้องหลัง ไม่ต้องมีแจ้งเตือนสีเขียวเด้งกวนใจคุณครู
                    fetchSheetData(false);
                }, 30000); // 30000 มิลลิวินาที = 30 วินาที (ปรับตัวเลขนี้ได้ตามต้องการ)

                // 3. ทำลายตัวจับเวลาเมื่อปิดหน้าเว็บ ป้องกันระบบค้าง
                return () => clearInterval(pollingInterval);
            }, [fetchSheetData]);

            React.useEffect(() => {
                if (currentUser) {
                    const userRole = normalizeRole(currentUser.role, currentUser.id);
                    if (userRole === "admin" || userRole === "hr") {
                        if (!selectedTeacherId && users.length > 0) {
                            const firstTeacher = users.find(u => u.role !== "admin" && u.role !== "hr") || users[0];
                            if (firstTeacher) setSelectedTeacherId(firstTeacher.id);
                        }
                    } else {
                        setSelectedTeacherId(currentUser.id);
                        setActiveTab("teacher");
                    }
                }
            }, [currentUser, users, selectedTeacherId]);

            // คำนวณสถิติเฉพาะปีการศึกษาที่เลือก (จับคู่รหัส ID และชื่อครูอย่างแม่นยำ)
            const getTeacherStats = (teacherId) => {
                const teacherObj = users.find(u => String(u.id).trim() === String(teacherId).trim());
                if (!teacherObj) return { sickUsed: 0, personalUsed: 0, personalDeductedFromLeaves: 0, latePenalty: 0, lateCount: 0, dutyFeeTotal: 0, summerFeeTotal: 0, userLeavesList: [] };
                
                const userLeaves = currentYearLeaves.filter(l => {
                    const lId = String(l.teacherId || "").trim();
                    const tId = String(teacherId || "").trim();
                    const isIdMatch = (lId === tId) || (!isNaN(lId) && !isNaN(tId) && parseInt(lId, 10) === parseInt(tId, 10));
                    const isNameMatch = l.teacherName && teacherObj.name && l.teacherName.replace(/\s+/g, '').includes(teacherObj.name.replace(/\s+/g, ''));
                    
                    const isApproved = !l.status || l.status.includes("อนุมัติ") || l.status.toLowerCase().includes("approved");
                    const isNotCanceled = !l.status || (!l.status.includes("ยกเลิก") && !l.status.includes("ไม่อนุมัติ"));

                    return (isIdMatch || isNameMatch) && isApproved && isNotCanceled;
                });
                
                const sickUsed = userLeaves
                    .filter(l => l.type === "sick" || l.type === "ลาป่วย")
                    .reduce((sum, l) => sum + Number(l.totalDeducted || 0), 0);
                    
                const personalDeductedFromLeaves = userLeaves
                    .filter(l => l.type === "personal" || l.type === "ลากิจส่วนตัว" || l.type === "ลากิจ")
                    .reduce((sum, l) => sum + Number(l.totalDeducted || 0), 0);

                const dutyFeeTotal = userLeaves.reduce((sum, l) => sum + Number(l.dutyFeeDeduction || 0), 0);
                const summerFeeTotal = userLeaves.reduce((sum, l) => sum + Number(l.summerFeeDeduction || 0), 0);
                    
                const lateCount = Number(teacherObj.lateCount || 0);
                const forgotScanCount = Number(teacherObj.forgotTimeCount || 0);
                
                const latePenalty = Math.floor(lateCount / 3);
                const forgotScanPenalty = Math.floor(forgotScanCount / 3);

                const middayOutLongPenalty = (Number(teacherObj.middayOutLongCount) || 0) * 0.5;
                const missedMeetingPenalty = (Number(teacherObj.missedMeetingCount) || 0) * 1.0;

                const personalUsed = personalDeductedFromLeaves + latePenalty + forgotScanPenalty + middayOutLongPenalty + missedMeetingPenalty;
                
                return { 
                    sickUsed, 
                    personalUsed, 
                    personalDeductedFromLeaves, 
                    latePenalty, 
                    forgotScanPenalty,
                    middayOutLongPenalty,
                    missedMeetingPenalty,
                    lateCount,
                    forgotTimeCount: forgotScanCount,
                    middayOutShortCount: Number(teacherObj.middayOutShortCount) || 0,
                    middayOutLongCount: Number(teacherObj.middayOutLongCount) || 0,
                    missedMeetingCount: Number(teacherObj.missedMeetingCount) || 0,
                    dutyFeeTotal,
                    summerFeeTotal,
                    userLeavesList: userLeaves
                };
            };

            const selectedTeacher = users.find(u => String(u.id) === String(selectedTeacherId));
            const selectedTeacherStats = selectedTeacher ? getTeacherStats(selectedTeacherId) : null;

            const handleImageUpload = (file, callback) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 240;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_SIZE) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            }
                        } else {
                            if (height > MAX_SIZE) {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64Str = canvas.toDataURL('image/jpeg', 0.85);
                        callback(base64Str);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            const showToast = (message, type = "success") => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const triggerConfirm = (title, message, onConfirmCallback) => {
                setConfirmDialog({
                    isOpen: true,
                    title,
                    message,
                    onConfirm: () => {
                        onConfirmCallback();
                        setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null });
                    }
                });
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const input = loginId.trim().toLowerCase();
                const matched = users.find(u => 
                    (u.email && u.email.toLowerCase() === input) || 
                    (String(u.id).toLowerCase() === input)
                );
                
                if (matched && matched.password === loginPassword) {
                    const normalizedUser = { ...matched, role: normalizeRole(matched.role, matched.id) };
                    setCurrentUser(normalizedUser);
                    
                    // หากผู้ใช้ติ๊ก Checkbox ให้เก็บข้อมูลผู้ใช้ลง Local Storage ไว้ถาวร (จนกว่าจะ Logout)
                    if (rememberMe) {
                        localStorage.setItem("leave_remembered_user", JSON.stringify(normalizedUser));
                    }

                    showToast(`ยินดีต้อนรับ ${normalizedUser.prefix}${normalizedUser.name}`);
                    setLoginId("");
                    setLoginPassword("");

                    if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                        fetch(GOOGLE_SHEET_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({
                                action: "loginNotify",
                                teacherId: normalizedUser.id,
                                name: `${normalizedUser.prefix}${normalizedUser.name}`,
                                role: normalizedUser.role === 'admin' ? 'ผู้ดูแลระบบสูงสุด' : normalizedUser.role === 'hr' ? 'เจ้าหน้าที่งานบุคคล' : 'ครูผู้สอน / บุคลากร',
                                loginTime: new Date().toLocaleString("th-TH")
                            })
                        }).catch(err => console.warn("Login notify note:", err));
                    }
                } else {
                    showToast("ข้อมูลประจำตัวหรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง", "error");
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                // ล้างแคชการจำรหัสผ่านทิ้งทั้งหมด
                localStorage.removeItem("leave_remembered_user");
                setRememberMe(false);
                showToast("ออกจากระบบและล้างความจำบัญชีเรียบร้อยแล้ว");
            };

            const formatThaiDate = (dateStr) => {
                if (!dateStr) return "-";
                const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = new Date(dateStr);
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            const getLocalDateString = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const getHolidayObj = (dateStr) => currentYearHolidays.find(h => h.date === dateStr);
            const getSchoolActivity = (dateStr) => currentYearActivities.find(a => a.date === dateStr);

            const calculateLeaveDays = (startDateStr, endDateStr, period = "all_day", targetUser = selectedTeacher, isCovid = false) => {
                const actualEndDateStr = period !== "all_day" ? startDateStr : endDateStr;
                if (!startDateStr || !actualEndDateStr || !targetUser) return { total: 0, breakdown: [], dutyFeeDeduction: 0, summerFeeDeduction: 0 };
                
                const start = new Date(startDateStr);
                const end = new Date(actualEndDateStr);
                if (end < start) return { total: 0, breakdown: [], dutyFeeDeduction: 0, summerFeeDeduction: 0 };

                const breakdown = [];
                let totalDeducted = 0;
                let totalDutyFee = 0;
                let totalSummerFee = 0;

                const userRole = normalizeRole(targetUser.role, targetUser.id);
                const isMaidOrJanitor = userRole === "maid" || userRole === "janitor";

                let current = new Date(start.getTime());
                while (current <= end) {
                    const dateStr = getLocalDateString(current);
                    const dayOfWeek = current.getDay(); 
                    const hol = getHolidayObj(dateStr);
                    const isHolidayAllDay = hol && (!hol.session || hol.session === "all_day");
                    const isHolidayHalfDay = hol && hol.session && hol.session !== "all_day";

                    let isWeeklyOff = false;
                    if (isMaidOrJanitor) {
                        isWeeklyOff = (dayOfWeek === 0) || (dayOfWeek === 6 && isMaidSaturdayOff(targetUser.id, current));
                    } else {
                        isWeeklyOff = (dayOfWeek === 0 || dayOfWeek === 6);
                    }

                    if (isHolidayAllDay || isWeeklyOff) {
                        const hName = hol ? hol.name : "วันหยุดประจำสัปดาห์";
                        breakdown.push({ date: dateStr, base: 0, penaltyReason: `วันหยุด (${hName})`, final: 0 });
                    } else if (isHolidayHalfDay && hol.session === period) {
                        breakdown.push({ date: dateStr, base: 0, penaltyReason: `วันหยุดโรงเรียน (${hol.name})`, final: 0 });
                    } else {
                        let baseDeduction = 1.0;
                        let reason = "อัตราการลาตามเกณฑ์ปกติ";

                        const schoolActivity = getSchoolActivity(dateStr);
                        const isMeetingDay = schoolActivity && (schoolActivity.name.includes("ประชุม") || schoolActivity.name.includes("ฉันน้องพี่"));

                        if (isCovid) {
                            if (schoolActivity) {
                                const isActivityAllDay = schoolActivity.session === "all_day";
                                if (period === "all_day") {
                                    baseDeduction = isActivityAllDay ? 2.0 : 1.5;
                                    reason = `ลาป่วยโควิด-19 ตรงวันกิจกรรมพิเศษ (${schoolActivity.name})`;
                                } else {
                                    baseDeduction = isActivityAllDay ? 1.5 : 1.0;
                                    reason = `ลาป่วยโควิด-19 ตรงวันกิจกรรมพิเศษ (${schoolActivity.name}) [ครึ่งวัน]`;
                                }
                            } else {
                                baseDeduction = period !== "all_day" ? 0.5 : 1.0;
                                reason = "ลาป่วยตรวจพบเชื้อโควิด-19 (ไม่คิดหักเพิ่มติดวันหยุด)";
                            }
                        } else {
                            if (!isMaidOrJanitor && isMeetingDay) {
                                if (period === "afternoon") {
                                    baseDeduction = 1.5;
                                    reason = "ตรงวันประชุมพบกันฉันน้องพี่ (ช่วงครึ่งวันบ่าย)";
                                } else if (period === "all_day") {
                                    baseDeduction = 2.0;
                                    reason = "ตรงวันประชุมพบกันฉันน้องพี่ (เต็มวัน)";
                                } else {
                                    baseDeduction = 0.5;
                                    reason = "ช่วงเช้าปกติ (มีการประชุมช่วงบ่าย)";
                                }
                            } else if (schoolActivity) {
                                const isActivityAllDay = schoolActivity.session === "all_day";
                                if (period === "all_day") {
                                    baseDeduction = isActivityAllDay ? 2.0 : 1.5;
                                    reason = `ตรงวันกิจกรรมพิเศษประจำโรงเรียน (${schoolActivity.name})`;
                                } else {
                                    baseDeduction = isActivityAllDay ? 1.5 : 1.0;

                                }
                            } else {
                                if (period === "all_day") {
                                    if (dayOfWeek === 5 || dayOfWeek === 1) { 
                                        baseDeduction = 2.0;
                                        reason = "ลาเต็มวันติดวันหยุดเสาร์-อาทิตย์";

                            totalSummerFee += (period !== "all_day" ? 100 : 200);
                        }

                        breakdown.push({ date: dateStr, base: period !== "all_day" ? 0.5 : 1.0, penaltyReason: reason, final: baseDeduction });
                        totalDeducted += baseDeduction;
                    }

                                    <input 
                                        type="password" 
                                        placeholder="กรอกรหัสผ่าน (เริ่มต้น 1234)"
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-4 py-3.5 rounded-xl font-semibold text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-emerald-700"
                                        required
                                    />
                                </div>

                                <div className="flex items-center gap-2 mt-2">
                                    <input 
                                        type="checkbox" 
                                        id="rememberMe" 
                                        checked={rememberMe}
                                        onChange={(e) => setRememberMe(e.target.checked)}
                                        className="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500 cursor-pointer"
                                    />
                                    <label htmlFor="rememberMe" className="text-sm font-bold text-slate-600 cursor-pointer select-none">
                                        จดจำการเข้าสู่ระบบในเครื่องนี้ (Auto-login)
                                    </label>
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition duration-200 shadow-md text-sm sm:text-base uppercase tracking-wider mt-4"
                                >
                                    เข้าสู่ระบบความปลอดภัย
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const currentRole = normalizeRole(currentUser.role, currentUser.id);
            const isAdminOrHr = currentRole === "admin" || currentRole === "hr";

            return (
                <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
                    {/* Header ปรับแต่งจัดวางองค์ประกอบให้เรียบร้อย สวยงาม สมดุล */}
                    <header className="luxury-gradient text-white shadow-xl sticky top-0 z-30 border-b border-emerald-700/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                            <div className="flex flex-col lg:flex-row items-center justify-between gap-3">
                                {/* ฝั่งซ้าย: โลโก้ และ ชื่อโรงเรียน */}
                                <div className="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
                                    <div className="flex items-center gap-3">
                                        <div className="w-11 h-11 sm:w-13 sm:h-13 flex items-center justify-center flex-shrink-0 bg-white/10 rounded-2xl p-1.5 border border-white/20 shadow-inner">
                                            <img 
                                                src="logo.png" 
                                                alt="Yuwapat Logo" 
                                                className="w-full h-full object-contain drop-shadow"
                                                onError={(e) => {
                                                    if (e.target.src.indexOf('logo.png') !== -1) {
                                                        e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                                    }
                                                }}
                                            />
                                        </div>
                                        <div>
                                            <h1 className="text-base sm:text-lg font-extrabold text-white tracking-tight leading-tight">Yuwapat Early Childhood School</h1>
                                            <p className="text-xs text-emerald-200 font-medium">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                                        </div>
                                    </div>

                                    {/* แสดงโปรไฟล์ย่อสำหรับหน้าจอขนาดเล็ก */}
                                    <div className="flex lg:hidden items-center gap-2 bg-navy-950/80 px-2.5 py-1.5 rounded-xl border border-emerald-500/30">
                                        <div className="text-right">
                                            <p className="text-[10px] font-bold text-emerald-400 uppercase leading-none">{currentRole === 'admin' ? 'แอดมิน' : currentRole === 'hr' ? 'HR' : 'บุคลากร'}</p>
                                            <p className="text-xs font-bold text-white truncate max-w-[100px]">{currentUser.name}</p>
                                        </div>
                                        <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 text-white w-7 h-7 rounded-lg flex items-center justify-center transition">
                                            <i className="fa-solid fa-power-off text-xs"></i>
                                        </button>
                                    </div>
                                </div>

                                {/* ฝั่งขวา: เครื่องมือควบคุม (ปีการศึกษา, สลับแท็บ, และโปรไฟล์ผู้ใช้) */}
                                <div className="flex items-center gap-2.5 flex-wrap w-full lg:w-auto justify-end">
                                    {/* 🎓 ตัวเลือกปีการศึกษา & ปุ่มซิงก์ */}
                                    <div className="flex items-center bg-navy-950/90 px-3 py-1.5 rounded-xl border border-emerald-500/40 shadow-sm">
                                        <i className="fa-solid fa-graduation-cap text-emerald-400 mr-2 text-xs"></i>
                                        <span className="text-xs font-bold text-slate-300 mr-2 hidden sm:inline">ปีการศึกษา:</span>
                                        <select 
                                            value={selectedYear}
                                            onChange={(e) => setSelectedYear(e.target.value)}
                                            className="bg-navy-900 border border-emerald-600/50 text-emerald-300 px-2.5 py-1 rounded-lg text-xs font-extrabold focus:outline-none focus:ring-1 focus:ring-emerald-400 cursor-pointer"
                                        >
                                            <option value="2568">2568 (1 พ.ค. 68 – 30 เม.ย. 69)</option>
                                            <option value="2569">2569 (1 พ.ค. 69 – 30 เม.ย. 70)</option>
                                            <option value="2570">2570 (1 พ.ค. 70 – 30 เม.ย. 71)</option>
                                            <option value="2571">2571 (1 พ.ค. 71 – 30 เม.ย. 72)</option>
                                        </select>
                                        <button 
                                            onClick={() => fetchSheetData(true)}
                                            disabled={isSyncing}
                                            className={`ml-2 text-slate-300 hover:text-emerald-400 p-1 transition ${isSyncing ? 'animate-spin text-emerald-400' : ''}`}
                                            title="ซิงก์ดึงข้อมูลสดจากชีทใหม่"
                                        >
                                            <i className="fa-solid fa-rotate text-xs"></i>
                                        </button>
                                    </div>

                                    {/* ปุ่มสลับแท็บสำหรับ Admin / HR */}
                                    {isAdminOrHr && (
                                        <div className="flex bg-navy-950/90 p-1 rounded-xl border border-emerald-700/40 shadow-sm">
                                            <button 
                                                onClick={() => setActiveTab("teacher")}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeTab === 'teacher' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                <i className="fa-solid fa-user text-xs"></i>
                                                พอร์ทัลบุคลากร
                                            </button>
                                            <button 
                                                onClick={() => setActiveTab("admin")}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeTab === 'admin' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                <i className="fa-solid fa-user-shield text-xs"></i>
                                                บริหารบุคคล (ADMIN/HR)
                                            </button>
                                        </div>
                                    )}

                                    {/* บล็อกผู้ใช้งานปัจจุบัน (แสดงบนหน้าจอขนาดใหญ่) */}
                                    <div className="hidden lg:flex items-center gap-2.5 bg-navy-950/90 pl-3.5 pr-2 py-1.5 rounded-xl border border-emerald-700/40 shadow-sm">
                                        <div className="text-right">
                                            <p className="text-[10px] font-bold text-emerald-400 uppercase leading-none">
                                                {currentRole === 'admin' ? 'ผู้ดูแลระบบสูงสุด' : currentRole === 'hr' ? 'งานบุคคล (HR)' : 'บุคลากร'}
                                            </p>
                                            <p className="text-xs font-bold text-white mt-0.5 leading-none">{currentUser.prefix}{currentUser.name}</p>
                                        </div>
                                        <button 
                                            onClick={handleLogout}
                                            className="bg-red-600 hover:bg-red-700 text-white w-7 h-7 rounded-lg flex items-center justify-center transition shadow"
                                            title="ออกจากระบบ"
                                        >
                                            <i className="fa-solid fa-power-off text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {notification && (
                        <div className="fixed top-20 right-4 z-50 animate-bounce">
                            <div className="shadow-2xl rounded-2xl p-4 flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-800">
                                <i className="fa-solid fa-circle-check text-emerald-600 text-2xl"></i>
                                <div>
                                    <p className="font-bold text-sm">ระบบแจ้งเตือนสารสนเทศ</p>
                                    <p className="text-xs mt-0.5">{notification.message}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md border text-center">
                                <i className="fa-solid fa-triangle-exclamation text-amber-500 text-4xl mb-4"></i>
                                <h3 className="text-base sm:text-lg font-bold text-slate-800">{confirmDialog.title}</h3>
                                <p className="text-xs sm:text-sm text-slate-600 mt-2">{confirmDialog.message}</p>
                                <div className="grid grid-cols-2 gap-3 mt-6">
                                    <button 
                                        onClick={() => setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null })}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs sm:text-sm"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={confirmDialog.onConfirm}
                                        className="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm shadow"
                                    >
                                        ยืนยันการทำรายการ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === "teacher" && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="space-y-6 lg:col-span-1 text-left">
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                                        {isAdminOrHr ? (
                                            <div className="mb-5">
                                                <label className="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">เลือกมุมมองบุคลากร ({users.length} ท่าน)</label>
                                                <select 
                                                    value={selectedTeacherId}
                                                    onChange={(e) => setSelectedTeacherId(e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-3.5 py-3 rounded-xl font-bold text-xs sm:text-sm"
                                                >
                                                    {users.map(u => (
                                                        <option key={u.id} value={u.id}>
                                                            [{u.id}] {u.prefix}{u.name} ({u.role === 'admin' ? 'แอดมิน' : u.role === 'hr' ? 'HR' : u.role === 'teacher' ? 'ครู' : u.role === 'maid' ? 'แม่บ้าน' : 'พ่อบ้าน'})
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        ) : null}

                                        {selectedTeacher && (
                                            <div className="bg-navy-900 text-white rounded-2xl p-5 shadow-md relative overflow-hidden">
                                                <div className="flex items-center gap-4">
                                                    {renderAvatar(selectedTeacher, "w-14 h-14 text-base")}
                                                    <div className="overflow-hidden text-left">
                                                        <p className="text-xs text-emerald-400 font-mono font-bold">รหัสประจำตัว: {selectedTeacher.id}</p>
                                                        <h3 className="font-extrabold text-base text-white truncate">{selectedTeacher.prefix}{selectedTeacher.name}</h3>
                                                        <p className="text-xs text-slate-300 mt-0.5">
                                                            {selectedTeacher.role === 'teacher' ? 'ครูผู้สอน / บุคลากรทางการศึกษา' : selectedTeacher.role === 'maid' ? 'เจ้าหน้าที่แม่บ้าน' : selectedTeacher.role === 'janitor' ? 'เจ้าหน้าที่พ่อบ้าน' : 'เจ้าหน้าที่บริหาร'}
                                                        </p>
                                                        <div className="inline-block mt-2 bg-emerald-950/80 border border-emerald-500/50 px-2 py-0.5 rounded text-[11px] font-bold text-emerald-300">
                                                            ปีการศึกษา {selectedYear}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 gap-2.5 mt-4">
                                                    <button 
                                                        onClick={() => {
                                                            setViewDisciplineTeacher(selectedTeacher);
                                                            setShowViewDisciplineModal(true);
                                                        }}
                                                        className="w-full bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 shadow"
                                                    >
                                                        <i className="fa-solid fa-calendar-check text-sm"></i>
                                                        ตรวจสอบประวัติการลงเวลา & สถิติวินัย
                                                    </button>
                                                    
                                                    <button 
                                                        onClick={() => {
                                                            const isMaid = selectedTeacher.role === "maid" || selectedTeacher.role === "janitor";
                                                            setRuleTab(isMaid ? "maid" : "teacher");
                                                            setShowRuleModal(true);
                                                        }}
                                                        className="w-full bg-slate-800 hover:bg-slate-700 text-emerald-300 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 border border-emerald-500/40"
                                                    >
                                                        <i className="fa-solid fa-book-open text-emerald-400 text-sm"></i>
                                                        อ่านระเบียบข้อบังคับวันลาทั้งหมด
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {selectedTeacher && selectedTeacherStats && (
                                        <div className="space-y-5">
                                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="bg-emerald-50 text-emerald-800 text-xs sm:text-sm font-bold px-3.5 py-1 rounded-full border border-emerald-200">
                                                            ลากิจส่วนตัว (ปี {selectedYear})
                                                        </span>
                                                        <h4 className="text-4xl font-extrabold text-slate-800 mt-3">
                                                            {(selectedTeacher.personalQuota - selectedTeacherStats.personalUsed).toFixed(1)}
                                                            <span className="text-xs sm:text-sm font-normal text-slate-400 ml-1.5">วันคงเหลือ</span>
                                                        </h4>
                                                        {(selectedTeacher.personalQuota - selectedTeacherStats.personalUsed) < 0 && (
                                                            <p className="text-red-600 font-extrabold text-xs sm:text-sm mt-2 animate-pulse flex items-center gap-1.5">
                                                                <i className="fa-solid fa-triangle-exclamation"></i>
                                                                หักเงินเดือน (สิทธิ์เกินกำหนด)
                                                            </p>
                                                        )}
                                                    </div>
                                                    <div className="bg-emerald-50 text-emerald-700 p-3.5 rounded-2xl border border-emerald-100">
                                                        <i className="fa-solid fa-briefcase text-2xl"></i>
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-5 pt-4 border-t border-slate-100 text-xs sm:text-sm space-y-2 text-slate-600">
                                                    <div className="flex justify-between">
                                                        <span>1. สถิติเข้าปฏิบัติงานสาย:</span>
                                                        <span className="font-bold">
                                                            {selectedTeacherStats.lateCount} ครั้ง (-{selectedTeacherStats.latePenalty} วัน)
                                                            {selectedTeacherStats.lateCount >= 9 && <span className="text-red-600 font-extrabold ml-1.5">[ลงบันทึกความผิด]</span>}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>2. ลืมบันทึกเวลาเข้า-ออกงาน:</span>
                                                        <span className="font-bold">
                                                            {selectedTeacherStats.forgotTimeCount} ครั้ง (-{selectedTeacherStats.forgotScanPenalty} วัน)
                                                            {selectedTeacherStats.forgotTimeCount >= 9 && <span className="text-red-600 font-extrabold ml-1.5">[ลงบันทึกความผิด]</span>}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>3. ออกนอกสถานที่ (> 1.30 ชม.):</span>
                                                        <span className="font-bold">{selectedTeacherStats.middayOutLongCount} ครั้ง (-{selectedTeacherStats.middayOutLongPenalty} วัน)</span>
                                                    </div>
                                                    {selectedTeacher.role !== 'maid' && selectedTeacher.role !== 'janitor' && (
                                                        <div className="flex justify-between">
                                                            <span>4. ขาดการประชุมพบกันฉันน้องพี่:</span>
                                                            <span className="font-bold">{selectedTeacherStats.missedMeetingCount} ครั้ง (-{selectedTeacherStats.missedMeetingPenalty} วัน)</span>
                                                        </div>
                                                    )}
                                                    <div className="flex justify-between pt-2 border-t border-slate-100">
                                                        <span>หักสะสมค่าปฏิบัติงานเวร:</span>
                                                        <span className="font-bold text-red-600">{selectedTeacherStats.dutyFeeTotal} บาท</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>หักสะสมค่าสอน Summer Course:</span>
                                                        <span className="font-bold text-amber-700">{selectedTeacherStats.summerFeeTotal} บาท</span>
                                                    </div>
                                                </div>

                                                <div className="mt-4 pt-3 border-t border-slate-100 flex justify-between text-xs sm:text-sm text-slate-400 font-medium">
                                                    <span>โควตาตั้งต้น: {selectedTeacher.personalQuota} วัน</span>
                                                    <span>ยื่นลาจริงปี {selectedYear}: {selectedTeacherStats.personalDeductedFromLeaves.toFixed(1)} วัน</span>
                                                </div>
                                            </div>

                                            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <span className="bg-emerald-50 text-emerald-800 text-xs sm:text-sm font-bold px-3.5 py-1 rounded-full border border-emerald-200">
                                                            ลาป่วย (ปี {selectedYear})
                                                        </span>
                                                        <h4 className="text-4xl font-extrabold text-slate-800 mt-3">
                                                            {(selectedTeacher.sickQuota - selectedTeacherStats.sickUsed).toFixed(1)}
                                                            <span className="text-xs sm:text-sm font-normal text-slate-400 ml-1.5">วันคงเหลือ</span>
                                                        </h4>
                                                        {(selectedTeacher.sickQuota - selectedTeacherStats.sickUsed) < 0 && (
                                                            <p className="text-red-600 font-extrabold text-xs sm:text-sm mt-2 animate-pulse flex items-center gap-1.5">
                                                                <i className="fa-solid fa-triangle-exclamation"></i>
                                                                หักเงินเดือน (สิทธิ์เกินกำหนด)
                                                            </p>
                                                        )}
                                                    </div>
                                                    <div className="bg-emerald-50 text-emerald-700 p-3.5 rounded-2xl border border-emerald-100">
                                                        <i className="fa-solid fa-heart-pulse text-2xl"></i>
                                                    </div>
                                                </div>
                                                <div className="mt-5 pt-4 border-t border-slate-100 flex justify-between text-xs sm:text-sm text-slate-400 font-medium">
                                                    <span>โควตาตั้งต้น: {selectedTeacher.sickQuota} วัน</span>
                                                    <span>ใช้ลาป่วยปี {selectedYear}: {selectedTeacherStats.sickUsed.toFixed(1)} วัน</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="space-y-6 lg:col-span-2 text-left">
                                    {/* แบบฟอร์มยื่นลา */}
                                    <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-center border-b pb-4 mb-5 border-slate-100 flex-wrap gap-2">
                                            <h2 className="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2.5">
                                                <i className="fa-regular fa-paper-plane text-emerald-700 text-xl"></i>
                                                แบบฟอร์มยื่นขออนุญาตลางาน และสรุปผลการคำนวณวันลา
                                            </h2>
                                            <span className="text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1 rounded-full border">
                                                คำนวณตามปฏิทินปี {selectedYear}
                                            </span>
                                        </div>

                                        <form onSubmit={handleRequestLeave} className="space-y-6">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                                <div>
                                                    <label className="block text-slate-700 text-xs sm:text-sm font-bold mb-1.5">วันที่เริ่มลา</label>
                                                    <input 
                                                        type="date" 
                                                        value={formData.startDate}
                                                        onChange={(e) => setFormData({ ...formData, startDate: e.target.value })}
                                                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-700"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 text-xs sm:text-sm font-bold mb-1.5">สิ้นสุดวันที่</label>
                                                    <input 
                                                        type="date" 
                                                        value={formData.period !== "all_day" ? formData.startDate : formData.endDate}
                                                        onChange={(e) => setFormData({ ...formData, endDate: e.target.value })}
                                                        disabled={formData.period !== "all_day"}
                                                        className={`w-full px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold ${formData.period !== "all_day" ? "bg-slate-100 text-slate-400 cursor-not-allowed border-slate-300" : "bg-slate-50 border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700"}`}
                                                        required={formData.period === "all_day"}
                                                    />
                                                </div>
                                            </div>

                                                className="w-full bg-slate-50 border border-slate-300 px-3.5 py-2.5 rounded-xl font-bold"

                                                <option value="morning">ครึ่งเช้า (0.5)</option>

                                                className="w-full bg-slate-50 border border-slate-300 px-3.5 py-2.5 rounded-xl font-bold"

                                            onChange={(e) => setEditingLeave({ ...editingLeave, reason: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-2.5 rounded-xl font-semibold"
                                            required

                                    </div>

                                    </button>

                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ปีการศึกษา</label>

                                            type="text"
