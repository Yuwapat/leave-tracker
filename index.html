        function isStaffWeeklyOff(user, date) {
            const dayOfWeek = date.getDay(); // 0 = อาทิตย์, 6 = เสาร์
            if (!user) return false;
            
            const role = user?.role;
            if (role === "admin" || role === "hr" || role === "teacher") {
                return dayOfWeek === 0 || dayOfWeek === 6; // ครูและฝ่ายบริหาร หยุดเสาร์-อาทิตย์
            }
            
            // พ่อบ้านและแม่บ้านทุกคน สิทธิ์หยุดหลักคือ "วันอาทิตย์"
            if (dayOfWeek === 0) return true;
            
            if (role === "janitor") {
                return false; // พ่อบ้านไม่มีวันหยุดเสาร์เพิ่มพิเศษ
            }
            
            if (role === "maid") {
                if (dayOfWeek === 6) {
                    // คำนวณลำดับสัปดาห์ของวันเสาร์ในเดือนนั้น ๆ
                    const dayOfMonth = date.getDate();
                    const satNumber = Math.ceil(dayOfMonth / 7); 
                    const name = user.name || "";
                    
                    if (satNumber === 1 && (name.includes("สุทิน") || name.includes("สุวภัทร"))) return true;
                    if (satNumber === 2 && (name.includes("สมใจ") || name.includes("อรทัย"))) return true;
                    if (satNumber === 3 && (name.includes("สำราญ") || name.includes("สมจิต"))) return true;
                    if (satNumber === 4 && name.includes("กรกช")) return true;
                }
            }
            return false;
        }

                                // หากไม่มีรายละเอียด Breakdown แซนวิชรายวันในตาราง ให้คำนวณใหม่โดยอัตโนมัติ
                                if (leafObj.breakdown.length === 0 && leafObj.startDate) {
                                    const teacherObj = data.users ? data.users.find(u => String(u.id || u.ID) === leafObj.teacherId) : null;
                                    const calc = calculateLeaveDays(leafObj.startDate, leafObj.endDate, leafObj.period, teacherObj || selectedTeacher);
                                    leafObj.breakdown = calc.breakdown;
                                }
                                return leafObj;
                            });
                            setLeaves(mappedLeaves.filter(ml => ml.id));
                        }

                        showToast("ดึงข้อมูลล่าสุดจาก Google Sheets สำเร็จเรียบร้อยแล้วจ้ะ");
                    } catch (error) {
                        console.error("Fetch Google Sheets Error:", error);
                        showToast("ไม่สามารถซิงก์ข้อมูลจาก Google Sheets ได้", "error");
                    } finally {
                        setIsLoading(false);
                    }
                };

                fetchSheetData();
            }, [GOOGLE_SHEET_URL]);

            React.useEffect(() => {
                if (currentUser) {
                    if (currentUser?.role === "teacher" || currentUser?.role === "maid" || currentUser?.role === "janitor") {
                        setSelectedTeacherId(currentUser.id);
                        setActiveTab("teacher");
                    } else {
                        const firstTeacher = users.find(u => u?.role !== "admin" && u?.role !== "hr") || users[0];
                        setSelectedTeacherId(firstTeacher ? firstTeacher.id : "");
                        setActiveTab("admin");
                    }
                }
            }, [currentUser, users]);

            React.useEffect(() => {
                if (formData.period !== "all_day" && formData.startDate) {
                    setFormData(prev => ({ ...prev, endDate: prev.startDate }));
                }
            }, [formData.startDate, formData.period]);

            // ==================== [ ลำดับการประกาศฟังก์ชันผู้ช่วยและตัวแปรรันใน App อย่างเสถียร ] ====================

            const showToast = (message, type = "success") => {
                setNotification({ message, type });
                setTimeout(() => setNotification(null), 4000);
            };

            const syncDataToGoogleSheets = async (payload) => {
                if (!GOOGLE_SHEET_URL) return;
                try {
                    await fetch(GOOGLE_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Google Sheets sync failed:", e);
                }
            };

            const triggerConfirm = (title, message, onConfirmCallback) => {
                setConfirmDialog({
                    isOpen: true,
                    title,
                    message,
                    onConfirm: () => {
                        onConfirmCallback();
                        setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null });
                    }
                });
            };

            function getLocalDateString(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function isSchoolHoliday(dateStr) {
                return holidays.some(h => h.date === dateStr);
            }

            function getHolidayName(dateStr) {
                const hol = holidays.find(h => h.date === dateStr);
                return hol ? hol.name : "";
            }

            function getSchoolActivity(dateStr) {
                return activities.find(a => a.date === dateStr);
            }

            // สิทธิ์การแสดงผลคำอธิบายระดับสิทธิ์ระบบความปลอดภัย
            function getRoleText(role) {
                if (role === 'admin') return 'ผู้ดูแลระบบสูงสุด';
                if (role === 'hr') return 'ฝ่ายบุคคล (HR)';
                if (role === 'teacher') return 'คุณครู';
                if (role === 'maid') return 'แม่บ้าน';
                if (role === 'janitor') return 'พ่อบ้าน';
                return 'บุคลากร';
            }

            function formatThaiDate(dateStr) {
                if (!dateStr) return "-";
                const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            }

            function renderAvatar(teacherObj, sizeClass = "w-11 h-11 text-sm") {
                if (teacherObj && teacherObj.photo) {
                    return (
                        <div className="relative flex-shrink-0">
                            <img 
                                src={teacherObj.photo} 
                                alt={teacherObj.name} 
                                className={`${sizeClass.split(' ')[0]} ${sizeClass.split(' ')[1]} rounded-full object-cover border-2 border-emerald-700 shadow-md`}
                                onError={(e) => {
                                    e.target.style.display = 'none';
                                    e.target.nextSibling.style.display = 'flex';
                                }}
                            />
                        </div>
                    );
                }
                const initialChar = teacherObj ? teacherObj.name.trim().charAt(0) : "?";
                return (
                    <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold flex items-center justify-center border-2 border-white shadow-md uppercase text-center flex-shrink-0`}>
                        {initialChar}
                    </div>
                );
            }

            function getContiguousNonWorkingBlockLength(targetDate, direction, userObj = selectedTeacher) {
                let current = new Date(targetDate.getTime());
                let count = 0;
                while (true) {
                    current.setDate(current.getDate() + direction);
                    const currentStr = getLocalDateString(current);
                    if (isStaffWeeklyOff(userObj, current) || isSchoolHoliday(currentStr)) {
                        count++;
                    } else {
                        break; 
                    }
                }
                return count;
            }

            // 🧮 ฟังก์ชันคำนวณวันหักลาสะสมแบบสมบูรณ์ตามเกณฑ์โรงเรียนยุวพัฒน์
            const calculateLeaveDays = (startDateStr, endDateStr, period = "all_day", userObj = selectedTeacher) => {
                const actualEndDateStr = period !== "all_day" ? startDateStr : endDateStr;
                if (!startDateStr || !actualEndDateStr || !userObj) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };
                
                const start = new Date(startDateStr);
                const end = new Date(actualEndDateStr);
                
                if (end < start) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };

                const breakdown = [];
                let totalDeducted = 0;
                let dutyFeeDeduction = 0;

                let current = new Date(start.getTime());
                while (current <= end) {
                    const dateStr = getLocalDateString(current);
                    const dayOfWeek = current.getDay();
                    const isWeeklyOff = isStaffWeeklyOff(userObj, current);
                    const isHoliday = isSchoolHoliday(dateStr);
                    
                    if (isWeeklyOff || isHoliday) {
                        const hName = getHolidayName(dateStr);
                        const reasonLabel = isWeeklyOff ? "วันหยุดประจำสัปดาห์" : `วันหยุดราชการ (${hName})`;
                        breakdown.push({ date: dateStr, base: 0, penalty: 0, penaltyReason: reasonLabel, final: 0, dutyFee: 0 });
                    } else {
                        // วันทำงานปกติ
                        let base = period !== "all_day" ? 0.5 : 1.0;
                        let finalDeductedForDay = base;
                        let penaltyReason = "อัตราปกติ";
                        let fee = period !== "all_day" ? 50 : 100;
                        dutyFeeDeduction += fee;

                        const isTeacherRole = userObj.role === "teacher" || userObj.role === "admin" || userObj.role === "hr";

                        // ตรวจสอบเงื่อนไขวันค่อม / ติดวันหยุด
                        if (isTeacherRole) {
                            // 👩‍🏫 ครูและฝ่ายบริหาร:
                            if (period === "afternoon" && dayOfWeek === 5) {
                                // ลา 0.5 วันบ่าย ติดวันเสาร์ หัก 1.5 วัน
                                finalDeductedForDay = 1.5;
                                penaltyReason = "ลา 0.5 วันบ่าย ติดวันเสาร์";
                            } else if (period === "morning" && dayOfWeek === 1) {
                                // ลา 0.5 วันเช้า ติดวันอาทิตย์ หัก 1.5 วัน
                                finalDeductedForDay = 1.5;
                                penaltyReason = "ลา 0.5 วันเช้า ติดวันอาทิตย์";
                            } else if (period === "all_day" && (dayOfWeek === 5 || dayOfWeek === 1)) {
                                // เช็คคลาเต็มวัน ติดวันเสาร์-อาทิตย์ และวันหยุดตามปฏิทิน -> หัก 3 วัน
                                let hasAdjacentHoliday = false;
                                if (dayOfWeek === 5) {
                                    const thurs = new Date(current.getTime());
                                    thurs.setDate(thurs.getDate() - 1);
                                    if (isSchoolHoliday(getLocalDateString(thurs))) hasAdjacentHoliday = true;
                                } else if (dayOfWeek === 1) {
                                    const tues = new Date(current.getTime());
                                    tues.setDate(tues.getDate() + 1);
                                    if (isSchoolHoliday(getLocalDateString(tues))) hasAdjacentHoliday = true;
                                }

                                if (hasAdjacentHoliday) {
                                    finalDeductedForDay = 3.0;
                                    penaltyReason = "ลาเต็มวัน ติดเสาร์-อาทิตย์ และวันหยุดปฏิทิน";
                                } else {
                                    finalDeductedForDay = 2.0;
                                    penaltyReason = "ลาเต็มวัน ติดวันเสาร์-อาทิตย์";
                                }
                            }
                        } else {
                            // 🧹 แม่บ้านและพ่อบ้าน (วันหยุดประจำสัปดาห์หลักคือวันอาทิตย์):
                            if (period === "afternoon" && dayOfWeek === 6) {
                                // ลา 0.5 วันบ่าย ติดวันอาทิตย์ หัก 1.5 วัน
                                finalDeductedForDay = 1.5;
                                penaltyReason = "ลา 0.5 วันบ่าย ติดวันอาทิตย์";
                            } else if (period === "morning" && dayOfWeek === 1) {
                                // ลา 0.5 วันเช้า ติดวันอาทิตย์ หัก 1.5 วัน
                                finalDeductedForDay = 1.5;
                                penaltyReason = "ลา 0.5 วันเช้า ติดวันอาทิตย์";
                            } else if (period === "all_day" && (dayOfWeek === 6 || dayOfWeek === 1)) {
                                // ลาเต็มวันติดวันอาทิตย์ และวันหยุดปฏิทิน -> หัก 3 วัน
                                let hasAdjacentHoliday = false;
                                if (dayOfWeek === 6) {
                                    const fri = new Date(current.getTime());
                                    fri.setDate(fri.getDate() - 1);
                                    if (isSchoolHoliday(getLocalDateString(fri))) hasAdjacentHoliday = true;
                                } else if (dayOfWeek === 1) {
                                    const tues = new Date(current.getTime());
                                    tues.setDate(tues.getDate() + 1);
                                    if (isSchoolHoliday(getLocalDateString(tues))) hasAdjacentHoliday = true;
                                }

                                if (hasAdjacentHoliday) {
                                    finalDeductedForDay = 3.0;
                                    penaltyReason = "ลาเต็มวัน ติดวันอาทิตย์ และวันหยุดปฏิทิน";
                                } else {
                                    finalDeductedForDay = 2.0;
                                    penaltyReason = "ลาเต็มวัน ติดวันอาทิตย์";
                                }
                            }
                        }

                        // ตรวจสอบวันประชุม / วันกิจกรรมพิเศษ
                        const activity = getSchoolActivity(dateStr);
                        if (activity) {
                            const isMeeting = activity.type === "meeting";
                            const isSpecialFull = activity.type === "special_full";
                            const isSpecialHalf = activity.type === "special_half";

                            if (isTeacherRole) {
                                if (isMeeting) {
                                    if (period === "afternoon") {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาครึ่งบ่าย ตรงกับวันประชุมพบกันฉันน้องพี่";
                                    } else if (period === "all_day") {
                                        finalDeductedForDay = 2.0;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันประชุมพบกันฉันน้องพี่";
                                    }
                                } else if (isSpecialFull) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 2.0;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    } else {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    }
                                } else if (isSpecialHalf) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    } else {
                                        finalDeductedForDay = 1.0;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    }
                                }
                            } else {
                                // แม่บ้าน / พ่อบ้าน (กิจกรรมพิเศษ)
                                if (isSpecialFull) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 2.0;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    } else {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    }
                                } else if (isSpecialHalf) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    } else {
                                        finalDeductedForDay = 1.0;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    }
                                }
                            }
                        }

                        // กฎค่อมวันหยุดแซนวิชเต็มรูปแบบ (ลาค่อมวันหยุด หักบวกวันหยุดสะสมเพิ่มทั้งหมด)
                        if (period === "all_day") {
                            const prevNonWork = getContiguousNonWorkingBlockLength(current, -1, userObj);
                            const nextNonWork = getContiguousNonWorkingBlockLength(current, 1, userObj);
                            if (prevNonWork > 0 && nextNonWork > 0) {
                                const totalSandwichDays = prevNonWork + nextNonWork;
                                const sandwichPenalty = 1.0 + totalSandwichDays;
                                if (sandwichPenalty > finalDeductedForDay) {
                                    finalDeductedForDay = sandwichPenalty;
                                    penaltyReason = `ลาเต็มวันค่อมวันหยุด (บวกสะสมหยุดต่อ ${totalSandwichDays} วัน)`;
                                }
                            }
                        }

                        breakdown.push({
                            date: dateStr,
                            base: base,
                            penalty: finalDeductedForDay - base,
                            penaltyReason: penaltyReason,
                            final: finalDeductedForDay,
                            dutyFee: fee
                        });
                        totalDeducted += finalDeductedForDay;
                    }
                    current.setDate(current.getDate() + 1);
                }
                return { total: totalDeducted, breakdown, dutyFeeDeduction };
            };

            const getTeacherStats = (teacherId) => {
                const teacherObj = users.find(u => u.id === teacherId);
                if (!teacherObj) return { sickUsed: 0, personalUsed: 0, personalDeductedFromLeaves: 0, latePenalty: 0, lateCount: 0, forgotTimePenalty: 0, forgotTimeCount: 0, middayOutPenalty: 0, middayOutCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0, missedMeetingPenalty: 0 };
                
                const sickUsed = leaves
                    .filter(l => l.teacherId === teacherId && l.status === "approved" && l.type === "sick")
                    .reduce((sum, l) => sum + l.totalDeducted, 0);
                    
                const personalDeductedFromLeaves = leaves
                    .filter(l => l.teacherId === teacherId && l.status === "approved" && l.type === "personal")
                    .reduce((sum, l) => sum + l.totalDeducted, 0);
                    
                const rawLateCount = teacherObj?.lateCount || 0;
                const forgotTimeCount = teacherObj?.forgotTimeCount || 0;
                const middayOutShortCount = teacherObj?.middayOutShortCount || 0;
                const middayOutLongCount = teacherObj?.middayOutLongCount || 0;
                const missedMeetingCount = teacherObj?.missedMeetingCount || 0;

                // 🚗 "ออกระหว่างวัน 1.01 - 1.30 ชม. นับเป็นการทำงานสาย 1 ครั้ง"
                const effectiveLateCount = rawLateCount + middayOutShortCount;

                // ⏰ ทุก 3 ครั้ง หักวันลากิจสะสม 1 วัน
                const latePenalty = Math.floor(effectiveLateCount / 3);
                const forgotTimePenalty = Math.floor(forgotTimeCount / 3);
                
                // 🚗 "ออกระหว่างวันตั้งแต่ 1.31 ชม. ขึ้นไป หักลากิจโดยตรงครั้งละ 0.5 วัน"
                const middayOutPenalty = middayOutLongCount * 0.5;

                // 📋 ไม่เข้าประชุมพบกันฉันน้องพี่ หัก 1 วันต่อครั้ง
                const missedMeetingPenalty = missedMeetingCount * 1.0;

                const personalUsed = personalDeductedFromLeaves + latePenalty + forgotTimePenalty + middayOutPenalty + missedMeetingPenalty;
                
                return { 
                    sickUsed, 
                    personalUsed, 
                    personalDeductedFromLeaves, 
                    latePenalty, 
                    lateCount: rawLateCount, 
                    effectiveLateCount,
                    forgotTimePenalty, 
                    forgotTimeCount, 
                    middayOutPenalty, 
                    middayOutCount: middayOutLongCount, 
                    middayOutShortCount, 
                    middayOutLongCount, 
                    missedMeetingCount,
                    missedMeetingPenalty
                };
            };

            const selectedTeacher = users.find(u => u.id === selectedTeacherId);
            const selectedTeacherStats = selectedTeacher ? getTeacherStats(selectedTeacherId) : null;
            const leaveCalcResult = calculateLeaveDays(formData.startDate, formData.endDate, formData.period, selectedTeacher);

            const handleLogin = (e) => {
                e.preventDefault();
                const input = loginId.trim().toLowerCase();
                const matched = users.find(u => 
                    (u.email && u.email.toLowerCase() === input) || 
                    (u.id.toLowerCase() === input)
                );
                
                if (matched && matched.password === loginPassword) {
                    setCurrentUser(matched);
                    
                    // 🔔 ระบบจำประวัติล็อกอินในเครื่อง
                    if (rememberMe) {
                        localStorage.setItem("leave_remember_me", "true");
                        localStorage.setItem("leave_saved_id", loginId.trim());
                        localStorage.setItem("leave_saved_password", loginPassword);
                    } else {
                        localStorage.setItem("leave_remember_me", "false");
                        localStorage.removeItem("leave_saved_id");
                        localStorage.removeItem("leave_saved_password");
                    }

                    // 📡 ส่งคำสั่งยิงแจ้งเตือนการเข้าใช้งานสำเร็จไปยัง Google Apps Script เข้าอีเมลแอดมินเตย
                    syncDataToGoogleSheets({
                        action: "loginNotify",
                        teacherId: matched.id,
                        name: matched.prefix + matched.name,
                        role: matched.role,
                        loginTime: new Date().toLocaleString('th-TH')
                    });

                    showToast(`ยินดีต้อนรับคุณ ${matched.prefix}${matched.name}`);
                } else {
                    showToast("อีเมลโรงเรียน/ชื่อผู้ใช้ หรือ รหัสผ่านไม่ถูกต้อง", "error");
                }
            };

            const handleLoginSubmit = (e) => handleLogin(e);

            const handleLogout = () => {
                setCurrentUser(null);
                if (!rememberMe) {
                    setLoginId("");
                    setLoginPassword("");
                }
                showToast("ออกจากระบบเรียบร้อยแล้ว");
            };

            const handleRequestLeaveSubmit = (e) => {
                e.preventDefault();
                if (!formData.startDate || !formData.reason) {
                    showToast("กรุณากรอกข้อมูลวันที่และเหตุผลการลาให้ครบถ้วน", "error");
                    return;
                }

                const currentTeacher = users.find(u => u.id === selectedTeacherId);
                const stats = getTeacherStats(selectedTeacherId);
                const calc = calculateLeaveDays(formData.startDate, formData.endDate, formData.period, selectedTeacher);

                if (calc.total === 0) {
                    showToast("วันที่เลือกเป็นวันหยุดทั้งหมด ไม่จำเป็นต้องยื่นใบลา", "error");
                    return;
                }

                const currentBalance = formData.type === "personal" 
                    ? currentTeacher.personalQuota - stats.personalUsed
                    : currentTeacher.sickQuota - stats.sickUsed;

                const newRequest = {
                    id: "L" + String(leaves.length + 1).padStart(2, '0') + "_" + Date.now().toString().slice(-4),
                    teacherId: selectedTeacherId,
                    startDate: formData.startDate,
                    endDate: formData.period !== "all_day" ? formData.startDate : formData.endDate,
                    type: formData.type,
                    period: formData.period,
                    reason: formData.reason,
                    totalDeducted: calc.total,
                    status: "approved",
                    breakdown: calc.breakdown,
                    createdAt: getLocalDateString(new Date()),
                    dutyFeeDeduction: calc.dutyFeeDeduction
                };

                setLeaves([newRequest, ...leaves]);
                
                syncDataToGoogleSheets({
                    action: "requestLeave",
                    ...newRequest
                });

                setFormData({ startDate: "", endDate: "", type: "personal", reason: "", period: "all_day" });
                showToast("บันทึกข้อมูลและส่งข้อมูลเข้าฐานข้อมูลออนไลน์สำเร็จ");
            };

            const handleAdjustCountSubmit = (id, field, amount) => {
                const updatedUsers = users.map(u => {
                    if (u.id === id) {
                        const newCount = Math.max(0, (u[field] || 0) + amount);
                        
                        syncDataToGoogleSheets({
                            action: "updateCount",
                            teacherId: id,
                            field: field,
                            count: newCount
                        });

                        return { ...u, [field]: newCount };
                    }
                    return u;
                });
                setUsers(updatedUsers);

                e.preventDefault();
                if (!newPasswordVal.trim()) return;
                
                setUsers(users.map(u => {
                    if (u.id === currentUser.id) return { ...u, password: newPasswordVal };
                    return u;
                }));
                setCurrentUser(prev => ({ ...prev, password: newPasswordVal }));
                showToast("เปลี่ยนรหัสผ่านสำเร็จ");

                syncDataToGoogleSheets({
                    action: "updatePassword",
                    teacherId: currentUser.id,
                    password: newPasswordVal
                });

                setNewPasswordVal("");
                setShowChangePasswordModal(false);
            };

            const handleAddTeacher = (e) => {
                e.preventDefault();
                if (!newTeacher.name) {
                    showToast("กรุณากรอกชื่อ-นามสกุลครู", "error");
                    return;
                }
                // สแกนหารหัส ID ตัวเลขที่มากที่สุดในตารางปัจจุบัน แล้วบวกเพิ่มทีละ 1
                const maxCurrentId = Math.max(...users.map(u => Number(u.id) || 0));
                const nextId = String(maxCurrentId + 1);
                
                // หากเป็นครู ใช้เมลต่อท้ายย่อ ถ้าเป็นแม่บ้าน/พ่อบ้าน ใช้ Username สั้น ๆ ตายตัว
                const finalEmail = newTeacher.email.trim() || (newTeacher.role === "maid" || newTeacher.role === "janitor" ? `staff_${nextId}` : `teacher.${nextId}@yuwapat.ac.th`);

                const u = {
                    id: nextId, prefix: newTeacher.prefix, name: newTeacher.name, role: newTeacher.role, password: newTeacher.password || "1234", email: finalEmail, sickQuota: Number(newTeacher.sickQuota), personalQuota: Number(newTeacher.personalQuota), lateCount: 0, forgotTimeCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0, photo: "", hireDate: newTeacher.hireDate || getLocalDateString(new Date())
                };
                setUsers([...users, u]);
                setNewTeacher({ prefix: "นาย", name: "", email: "", sickQuota: 30, personalQuota: 15, role: "teacher", password: "1234", photo: "", hireDate: "" });
                setShowAddTeacherModal(false);
                showToast(`เพิ่มบุคลากร ${u.id} - ${u.prefix}${u.name} สำเร็จ`);
            };

            const handleOpenEditTeacher = (teacher) => {
                setEditingTeacher({ ...teacher });
                setShowEditTeacherModal(true);
            };

            const handleUpdateTeacher = (e) => {
                e.preventDefault();
                if (!editingTeacher.name) {
                    showToast("กรุณากรอกชื่อ-นามสกุลครู", "error");
                    return;
                }
                setUsers(users.map(u => {
                    if (u.id === editingTeacher.id) {
                        return {
                            ...u,
                            prefix: editingTeacher.prefix,
                            name: editingTeacher.name,
                            sickQuota: Number(editingTeacher.sickQuota),
                            personalQuota: Number(editingTeacher.personalQuota),
                            photo: editingTeacher.photo || "",
                            hireDate: editingTeacher.hireDate
                        };
                    }
                    return u;
                }));
                setShowEditTeacherModal(false);
                setEditingTeacher(null);
                showToast("แก้ไขข้อมูลสิทธิ์และวันที่เริ่มงานเรียบร้อยแล้ว");
            };

            const handleDeleteTeacher = (id) => {
                triggerConfirm(
                    "ลบรายชื่อบุคลากร",
                    `ต้องการลบบุคลากร ${id} หรือไม่?`,
                    () => {
                        setUsers(users.filter(u => u.id !== id));
                        showToast("ลบข้อมูลบุคลากรเรียบร้อยแล้ว", "error");
                    }
                );
            };

            const handleRoleChange = (userId, newRole) => {
                if (userId === currentUser.id) {
                    showToast("ไม่สามารถปรับเปลี่ยนสิทธิ์ตัวเองได้", "error");
                    return;
                }
                setUsers(users.map(u => {
                    if (u.id === userId) return { ...u, role: newRole };
                    return u;
                }));
                showToast(`อัปเดตสิทธิ์ระบบเรียบร้อย`);

                syncDataToGoogleSheets({
                    action: "updateRole",
                    teacherId: userId,
                    role: newRole
                });
            };

            const handleUserPasswordChange = (userId, newPass) => {
                if (!newPass.trim()) return;
                setUsers(users.map(u => {
                    if (u.id === userId) return { ...u, password: newPass };
                    return u;
                }));
                showToast(`อัปเดตรหัสผ่านสำเร็จ`);

                syncDataToGoogleSheets({
                    action: "updatePassword",
                    teacherId: userId,
                    password: newPass
                });
            };

            const handleUserEmailChange = (userId, newEmail) => {
                if (!newEmail.trim()) return;
                setUsers(users.map(u => {
                    if (u.id === userId) return { ...u, email: newEmail.trim() };
                    return u;
                }));
                showToast("อัปเดตอีเมลเรียบร้อย");

                    action: "updateEmail",
                    teacherId: userId,
                    email: newEmail.trim()
                });
            };

            const handleAddHolidaySubmit = (e) => {
                e.preventDefault();
                if (!newHoliday.date || !newHoliday.name) {
                    showToast("กรุณากรอกข้อมูลวันหยุดให้ครบถ้วน", "error");
                    return;
                }
                setHolidays([...holidays, newHoliday].sort((a,b) => a.date.localeCompare(b.date)));
                setNewHoliday({ date: "", name: "" });
                setShowAddHolidayModal(false);
                showToast("เพิ่มวันหยุดเรียบร้อย");
            };

            const handleDeleteHoliday = (date) => {
                triggerConfirm("ลบวันหยุด", "ต้องการนำวันหยุดออกใช่หรือไม่?", () => {
                    setHolidays(holidays.filter(h => h.date !== date));
                    showToast("ลบวันหยุดเรียบร้อยแล้ว", "error");
                });
            };

            const handleAddActivitySubmit = (e) => {
                e.preventDefault();
                if (!newActivity.date || !newActivity.name) {
                    showToast("กรุณากรอกข้อมูลให้ครบถ้วน", "error");
                    return;

                setActivities([...activities, newActivity].sort((a,b) => a.date.localeCompare(b.date)));

                setShowAddActivityModal(false);
                showToast("บันทึกวันกิจกรรมเรียบร้อย");
            };

            const handleDeleteActivity = (date) => {
                triggerConfirm("ยกเลิกกิจกรรม", "ต้องการลบกิจกรรมใช่หรือไม่?", () => {
                    setActivities(activities.filter(a => a.date !== date));
                    showToast("ลบวันกิจกรรมเรียบร้อยแล้ว", "error");
                });
            };

                const thaiFirstNames = [
                    "กิตติ", "เฉลิม", "ณัฐพงษ์", "ทรงพล", "ธนพล", "นพดล", "ประเสริฐ", "พงษ์ศักดิ์", "ยุทธนา", "วรวุฒิ",
                    "สุรชัย", "เกรียงไกร", "จารุวรรณ", "ชลลดา", "ดวงพร", "ทิพวรรณ", "นงลักษณ์", "เบญจวรรณ", "ปัทมา", "พรทิพย์"
                ];
                const thaiLastNames = [
                    "สุวรรณรัตน์", "สมบูรณ์ดี", "รักษาใจ", "ดีเสมอ", "เจริญรุ่งเรือง", "เลิศวิจิตร", "ตั้งมโนมั่น", "เกียรติขจร", "ประชานิยม"
                ];
                const prefixes = ["นาย", "นาง", "นางสาว"];

                const currentCount = users.filter(u => u.role === "teacher").length;
                if (currentCount >= 47) {
                    showToast("ในระบบมีจำนวนบุคลากรครบถ้วนแล้ว (49 คน)", "info");
                    return;
                }

                const additionalUsers = [];
                const neededTeachersCount = 47 - currentCount;
                
                for (let i = 1; i <= neededTeachersCount; i++) {
                    const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                    const firstName = thaiFirstNames[Math.floor(Math.random() * thaiFirstNames.length)];
                    const lastName = thaiLastNames[Math.floor(Math.random() * thaiLastNames.length)];
                    const sickQuota = Math.floor(Math.random() * 11) + 20; 
                    const personalQuota = Math.floor(Math.random() * 8) + 10; 
                    const newId = String(100 + i);
                    const email = `teacher.${newId.toLowerCase()}@yuwapat.ac.th`;

                    additionalUsers.push({
                        id: newId, prefix, name: `${firstName} ${lastName}`, role: "teacher", password: "1234", email, sickQuota, personalQuota, lateCount: 0, forgotTimeCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0, photo: "", hireDate: "2024-05-16"
                    });
                }

                setUsers([...users, ...additionalUsers]);
                showToast(`สร้างรายชื่อบุคลากรจำลองเพิ่มเติมสำเร็จ ปัจจุบันมีบุคลากรครบ 49 คนพอดี`);

                                <p className="text-[9px] text-slate-300 mt-1.5 uppercase tracking-widest font-light">Leave Management Portal</p>
                            </header>

                                    <i className="fa-solid fa-triangle-exclamation text-red-500 text-base"></i>
                                    <span className="font-semibold">{notification.message}</span>
                                </div>

                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <i className="fa-solid fa-user text-slate-400 text-sm"></i>
                                        </div>
                                        <input 
                                            type="text" 
                                            placeholder="อีเมลโรงเรียน หรือ Username พนักงาน..."

                                            onChange={(e) => setLoginId(e.target.value)}

                                            required
                                        />

                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            <i className="fa-solid fa-key text-slate-400 text-sm"></i>
                                        </div>
                                        <input 
                                            type="password" 
                                            placeholder="กรอกรหัสผ่าน"

                                            required
                                        />
                                    </div>
                                </div>

                                <div className="flex items-center gap-2 text-left">

                                >
                                    <i className="fa-solid fa-shield-halved"></i>
                                    เข้าสู่ระบบความปลอดภัย
                                </button>
                            </form>
                        </div>
                    </div>
                );

            return (

                                                                </td>
                                                                <td className="py-4 px-3 font-bold text-slate-800">
                                                                    <span className={pRemaining <= 0 ? "text-[#E11D48]" : ""}>{pRemaining.toFixed(1)} / {t.personalQuota} วัน</span>

                                                                    <span className={sRemaining <= 0 ? "text-[#E11D48]" : ""}>{sRemaining.toFixed(1)} / {t.sickQuota} วัน</span>

                                                                    type="text" 
                                                                    value={u.password}

                                                                />
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>

                                                type="text" 
                                                value={newTeacher.name}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, name: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                                required
                                            />
                                        </div>
                                    </div>
                                    
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">
                                            {newTeacher.role === "maid" || newTeacher.role === "janitor" ? "ชื่อผู้ใช้งานเข้าสู่ระบบ (Username) *" : "อีเมลสังกัดโรงเรียน (@yuwapat.ac.th)"}
                                        </label>
                                        <input 
                                            type="text" 
                                            value={newTeacher.email}
                                            onChange={(e) => setNewTeacher({ ...newTeacher, email: e.target.value })}
                                            placeholder={newTeacher.role === "maid" || newTeacher.role === "janitor" ? "ตัวอย่าง: somjai_m" : "sommai.d@yuwapat.ac.th"}
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold"
                                            required={newTeacher.role === "maid" || newTeacher.role === "janitor"}
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 text-left">
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">สิทธิ์การทำงาน</label>
                                            <select 
                                                value={newTeacher.role}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, role: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-700 cursor-pointer"
                                            >
                                                <option value="teacher">คุณครูทั่วไป (Teacher)</option>
                                                <option value="maid">แม่บ้าน (Maid)</option>
                                                <option value="janitor">พ่อบ้าน (Janitor)</option>
                                                <option value="hr">ฝ่ายบุคคล (HR)</option>
                                                <option value="admin">แอดมินสูงสุด (Admin)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">รหัสผ่านเริ่มต้น</label>
                                            <input 
                                                type="text" 
                                                value={newTeacher.password}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, password: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-mono font-bold text-center"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 text-left">
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">โควตาลากิจตั้งต้น (วัน)</label>
                                            <input 
                                                type="number" 
                                                value={newTeacher.personalQuota}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, personalQuota: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">โควตาลาป่วยตั้งต้น (วัน)</label>
                                            <input 
                                                type="number" 
                                                value={newTeacher.sickQuota}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, sickQuota: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold py-3.5 rounded-xl text-xs sm:text-sm transition shadow-md mt-4">
                                        ลงทะเบียนประวัติลงฐานข้อมูล
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showEditTeacherModal && editingTeacher && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-8 w-full max-w-md border animate-fade-in relative">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-600 to-navy-800"></div>
                                <div className="flex justify-between items-center border-b pb-4 mb-5">
                                    <h3 className="text-sm sm:text-base font-bold text-slate-800 uppercase tracking-wide text-left">
                                        <i className="fa-solid fa-user-pen text-emerald-700 mr-2 text-sm"></i>
                                        แก้ไขสิทธิ์และโควตาส่วนตัว
                                    </h3>
                                    <button onClick={() => { setShowEditTeacherModal(false); setEditingTeacher(null); }} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleUpdateTeacher} className="space-y-4">
                                    <div className="grid grid-cols-3 gap-2 text-left">
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">คำนำหน้า</label>
                                            <select 
                                                value={editingTeacher.prefix}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, prefix: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                            >
                                                <option value="นาย">นาย</option>
                                                <option value="นาง">นาง</option>
                                                <option value="นางสาว">นางสาว</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">ชื่อและนามสกุลจริง</label>
                                            <input 
                                                type="text" 
                                                value={editingTeacher.name}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, name: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 text-left">
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">สิทธิ์ลากิจเริ่มต้น (วัน)</label>
                                            <input 
                                                type="number" 
                                                step="0.5"
                                                value={editingTeacher.personalQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, personalQuota: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-500 text-xs mb-1 font-bold">สิทธิ์ลาป่วยเริ่มต้น (วัน)</label>
                                            <input 
                                                type="number" 
                                                step="0.5"
                                                value={editingTeacher.sickQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, sickQuota: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                                required
                                            />
                                        </div>
                                    </div>
                                    
                                    <div className="flex gap-2.5 justify-end mt-5">
                                        <button 
                                            type="button" 
                                            onClick={() => { setShowEditTeacherModal(false); setEditingTeacher(null); }}
                                            className="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-slate-500 bg-slate-100 hover:bg-slate-200"
                                        >
                                            ยกเลิก
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-white bg-emerald-700 hover:bg-emerald-800 shadow"
                                        >
                                            บันทึกข้อมูล
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAddHolidayModal && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-sm border animate-fade-in">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-sm sm:text-base font-bold text-slate-800 uppercase tracking-wide text-left">เพิ่มวันหยุดราชการประจำปฏิทิน</h3>
                                    <button onClick={() => setShowAddHolidayModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleAddHolidaySubmit} className="space-y-4">
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">เลือกวันหยุด</label>
                                        <input 
                                            type="date" 
                                            value={newHoliday.date}
                                            onChange={(e) => setNewHoliday({ ...newHoliday, date: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-center"
                                            required
                                        />
                                    </div>
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ชื่ออธิบายรายละเอียดวันหยุด</label>
                                        <input 
                                            type="text" 
                                            value={newHoliday.name}
                                            onChange={(e) => setNewHoliday({ ...newHoliday, name: e.target.value })}
                                            placeholder="วันสงกรานต์, วันเข้าพรรษา..."
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl text-xs sm:text-sm transition duration-300 shadow mt-2 border border-emerald-600">
                                        บันทึกวันหยุดปฏิทิน
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showAddActivityModal && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-sm border animate-fade-in">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-sm sm:text-base font-bold text-slate-800 uppercase tracking-wide text-left">เพิ่มวันกิจกรรมหรือประชุมสิทธิ์พิเศษ</h3>
                                    <button onClick={() => setShowAddActivityModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleAddActivitySubmit} className="space-y-4">
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">วันจัดกิจกรรม</label>
                                        <input 
                                            type="date" 
                                            value={newActivity.date}
                                            onChange={(e) => setNewActivity({ ...newActivity, date: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold text-center"
                                            required
                                        />
                                    </div>
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ประเภทของกิจกรรม</label>
                                        <select 
                                            value={newActivity.type}
                                            onChange={(e) => setNewActivity({ ...newActivity, type: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm font-bold text-slate-700"
                                        >
                                            <option value="meeting">ประชุมพบกันฉันน้องพี่ (มีบทลงโทษลาคูณ 1.5/2.0 และลักลอบขาดหัก 1.0)</option>
                                            <option value="special_full">กิจกรรมพิเศษตลอดทั้งวัน (ลงโทษทวีคูณ)</option>
                                            <option value="special_half">กิจกรรมพิเศษครึ่งวัน (เช้าหรือบ่าย)</option>
                                        </select>
                                    </div>
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ช่วงเวลาการจัดงาน</label>
                                        <select 
                                            value={newActivity.session}
                                            onChange={(e) => setNewActivity({ ...newActivity, session: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-sm font-bold text-slate-700"
                                        >
                                            <option value="morning">ช่วงเช้า (Morning)</option>
                                            <option value="afternoon">ช่วงบ่าย (Afternoon)</option>
                                            <option value="all_day">ตลอดทั้งวัน (All Day)</option>
                                        </select>
                                    </div>
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ชื่อพิธีหรือรายละเอียด</label>
                                        <input 
                                            type="text" 
                                            value={newActivity.name}
                                            onChange={(e) => setNewActivity({ ...newActivity, name: e.target.value })}
                                            placeholder="พิธีไหว้ครู, ประชุมพบกันฉันน้องพี่..."
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl text-xs sm:text-sm transition duration-300 shadow mt-2 border border-emerald-600">
                                        บันทึกกิจกรรมพรีเมียม
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showChangePasswordModal && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-sm border animate-fade-in relative">
                                <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-600 to-navy-800"></div>
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="text-sm sm:text-base font-bold text-slate-800 uppercase tracking-wide text-left">เปลี่ยนรหัสผ่านใหม่</h3>
                                    <button onClick={() => setShowChangePasswordModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleSelfPasswordChange} className="space-y-4">
                                    <div className="text-left">
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">กรอกรหัสผ่านใหม่</label>
                                        <input 
                                            type="text" 
                                            value={newPasswordVal}
                                            onChange={(e) => setNewPasswordVal(e.target.value)}
                                            placeholder="ระบุรหัสผ่านใหม่ของคุณ"
                                            className="w-full bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold"
                                            required
                                        />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3.5 rounded-xl text-xs sm:text-sm transition duration-300 shadow">
                                        ยืนยันการตั้งรหัสผ่านใหม่
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-navy-950 text-slate-400 py-8 text-center border-t border-emerald-700/20 text-xs font-medium mt-12">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <p>© ๒๕๖๙ ระบบคำนวณและสรุปวันลาครูระดับพรีเมียม - โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                            <p className="flex items-center gap-1.5 justify-center text-slate-500">
                                <span className="inline-block w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                                ระบบความจำปลอดภัย Local Storage ออฟไลน์สมบูรณ์
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
