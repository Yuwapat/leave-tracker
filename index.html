        const SUMMER_COURSES = [
            { start: "2026-09-28", end: "2026-10-09", name: "Summer Course October 2026" },
            { start: "2027-03-01", end: "2027-03-26", name: "Summer Course March 2027" }

        function isDateInSummer(dateStr) {
            return SUMMER_COURSES.some(s => dateStr >= s.start && dateStr <= s.end);
        }

        function getField(obj, ...keys) {
            if (!obj || typeof obj !== "object") return undefined;
            for (const k of keys) {
                if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== "") return obj[k];
            }
            const normalizedLookup = keys.map(k => String(k).toLowerCase().replace(/[\s_\-]/g, ""));
            for (const [prop, val] of Object.entries(obj)) {
                const normProp = String(prop).toLowerCase().replace(/[\s_\-]/g, "");
                if (normalizedLookup.includes(normProp) && val !== undefined && val !== null && String(val).trim() !== "") {
                    return val;
                }
            }
            return undefined;
        }

        function getAcademicYearFromDate(dateStr) {
            if (!dateStr) return "2569";
            const str = String(dateStr).trim();
            let year = 2026, month = 5;
            if (str.includes("-")) {
                const parts = str.split("-");
                if (parts[0].length === 4) { year = parseInt(parts[0], 10); month = parseInt(parts[1], 10); }
                else if (parts[2] && parts[2].length >= 4) { year = parseInt(parts[2], 10); month = parseInt(parts[1], 10); }
            } else if (str.includes("/")) {
                const parts = str.split("/");
                if (parts[0].length === 4) { year = parseInt(parts[0], 10); month = parseInt(parts[1], 10); }
                else if (parts[2] && parts[2].length >= 4) { year = parseInt(parts[2], 10); month = parseInt(parts[1], 10); }
            }
            if (year > 2400) return String(month >= 5 ? year : year - 1);
            return String(month >= 5 ? (year + 543) : (year - 1 + 543));
        }

        function normalizeRole(rawRole, id = "") {
            const strId = String(id).trim();
            if (strId === "44") return "admin";
            if (strId === "25") return "hr";
            if (!rawRole) return "teacher";
            const str = String(rawRole).toLowerCase().trim();
            if (str.includes("admin") || str.includes("แอดมิน")) return "admin";
            if (str.includes("hr") || str.includes("บุคคล")) return "hr";
            if (str.includes("maid") || str.includes("แม่บ้าน")) return "maid";
            if (str.includes("janitor") || str.includes("พ่อบ้าน")) return "janitor";
            return "teacher";
        }

        function getNthSaturdayOfMonth(dateObj) {
            if (dateObj.getDay() !== 6) return 0;
            return Math.ceil(dateObj.getDate() / 7);
        }

        function isMaidSaturdayOff(teacherId, dateObj) {
            if (dateObj.getDay() !== 6) return false;
            const nthSat = getNthSaturdayOfMonth(dateObj);
            const strId = String(teacherId);
            if (nthSat === 1 && (strId === "52" || strId === "57")) return true;
            if (nthSat === 2 && (strId === "53" || strId === "54")) return true;
            if (nthSat === 3 && (strId === "56" || strId === "60")) return true;
            if (nthSat === 4 && strId === "55") return true;
            return false;
        }

            const getTeacherStats = (teacherId) => {
                const teacherObj = users.find(u => String(u.id).trim() === String(teacherId).trim());
                if (!teacherObj) return { sickUsed: 0, personalUsed: 0, personalDeductedFromLeaves: 0, latePenalty: 0, lateCount: 0, dutyFeeTotal: 0, summerFeeTotal: 0, userLeavesList: [] };
                
                const userLeaves = currentYearLeaves.filter(l => {
                    const lId = String(l.teacherId || "").trim();
                    const tId = String(teacherId || "").trim();

                    const isNameMatch = l.teacherName && teacherObj.name && l.teacherName.replace(/\s+/g, '').includes(teacherObj.name.replace(/\s+/g, ''));
                    const isApproved = !l.status || l.status.includes("อนุมัติ") || l.status.toLowerCase().includes("approved");
                    const isNotCanceled = !l.status || (!l.status.includes("ยกเลิก") && !l.status.includes("ไม่อนุมัติ"));
                    return (isIdMatch || isNameMatch) && isApproved && isNotCanceled;

                const personalDeductedFromLeaves = userLeaves.filter(l => l.type === "personal" || l.type === "ลากิจส่วนตัว" || l.type === "ลากิจ").reduce((sum, l) => sum + Number(l.totalDeducted || 0), 0);

                const personalUsed = personalDeductedFromLeaves + latePenalty + forgotScanPenalty + middayOutLongPenalty + missedMeetingPenalty;
                
                return {

            const handleImageUpload = (file, callback) => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 240;
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                        } else {
                            if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            };

            };

            const formatThaiDate = (dateStr) => {
                if (!dateStr) return "-";
                const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = new Date(dateStr);
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            };

            const getLocalDateString = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const calculateLeaveDays = (startDateStr, endDateStr, period = "all_day", targetUser = selectedTeacher, isCovid = false) => {
                const actualEndDateStr = period !== "all_day" ? startDateStr : endDateStr;
                if (!startDateStr || !actualEndDateStr || !targetUser) return { total: 0, breakdown: [], dutyFeeDeduction: 0, summerFeeDeduction: 0 };
                
                const start = new Date(startDateStr);
                const end = new Date(actualEndDateStr);
                if (end < start) return { total: 0, breakdown: [], dutyFeeDeduction: 0, summerFeeDeduction: 0 };

                const breakdown = [];
                let totalDeducted = 0, totalDutyFee = 0, totalSummerFee = 0;
                const userRole = normalizeRole(targetUser.role, targetUser.id);
                const isMaidOrJanitor = userRole === "maid" || userRole === "janitor";

                let current = new Date(start.getTime());
                while (current <= end) {
                    const dateStr = getLocalDateString(current);
                    const dayOfWeek = current.getDay(); 
                    const hol = currentYearHolidays.find(h => h.date === dateStr);
                    const isHolidayAllDay = hol && (!hol.session || hol.session === "all_day");
                    const isHolidayHalfDay = hol && hol.session && hol.session !== "all_day";

                    let isWeeklyOff = false;
                    if (isMaidOrJanitor) {
                        isWeeklyOff = (dayOfWeek === 0) || (dayOfWeek === 6 && isMaidSaturdayOff(targetUser.id, current));
                    } else {
                        isWeeklyOff = (dayOfWeek === 0 || dayOfWeek === 6);
                    }

                    if (isHolidayAllDay || isWeeklyOff) {
                        const hName = hol ? hol.name : "วันหยุดประจำสัปดาห์";
                        breakdown.push({ date: dateStr, base: 0, penaltyReason: `วันหยุด (${hName})`, final: 0 });
                    } else if (isHolidayHalfDay && hol.session === period) {
                        breakdown.push({ date: dateStr, base: 0, penaltyReason: `วันหยุดโรงเรียน (${hol.name})`, final: 0 });
                    } else {
                        let baseDeduction = 1.0;
                        let reason = "อัตราการลาตามเกณฑ์ปกติ";
                        const schoolActivity = currentYearActivities.find(a => a.date === dateStr);
                        const isMeetingDay = schoolActivity && (schoolActivity.name.includes("ประชุม") || schoolActivity.name.includes("ฉันน้องพี่"));

                        if (isCovid) {
                            if (schoolActivity) {
                                const isActivityAllDay = schoolActivity.session === "all_day";
                                baseDeduction = (period === "all_day") ? (isActivityAllDay ? 2.0 : 1.5) : (isActivityAllDay ? 1.5 : 1.0);
                                reason = `ลาป่วยโควิด-19 ตรงวันกิจกรรมพิเศษ (${schoolActivity.name})`;
                            } else {
                                baseDeduction = (period !== "all_day") ? 0.5 : 1.0;
                                reason = "ลาป่วยตรวจพบเชื้อโควิด-19 (ไม่คิดหักเพิ่มติดวันหยุด)";
                            }
                        } else {
                            if (!isMaidOrJanitor && isMeetingDay) {
                                if (period === "afternoon") { baseDeduction = 1.5; reason = "ตรงวันประชุมพบกันฉันน้องพี่ (ช่วงบ่าย)"; }
                                else if (period === "all_day") { baseDeduction = 2.0; reason = "ตรงวันประชุมพบกันฉันน้องพี่ (เต็มวัน)"; }
                                else { baseDeduction = 0.5; reason = "ช่วงเช้าปกติ (มีการประชุมช่วงบ่าย)"; }
                            } else if (schoolActivity) {
                                const isActivityAllDay = schoolActivity.session === "all_day";
                                baseDeduction = (period === "all_day") ? (isActivityAllDay ? 2.0 : 1.5) : (isActivityAllDay ? 1.5 : 1.0);
                                reason = `ตรงวันกิจกรรมพิเศษประจำโรงเรียน (${schoolActivity.name})`;
                            } else {
                                if (period === "all_day") {
                                    baseDeduction = (dayOfWeek === 5 || dayOfWeek === 1) ? 2.0 : 1.0;
                                    reason = (dayOfWeek === 5 || dayOfWeek === 1) ? "ลาเต็มวันติดวันหยุดเสาร์-อาทิตย์" : "เต็มวันปกติ";
                                } else if (period === "afternoon" && dayOfWeek === 5) {
                                    baseDeduction = 1.5; reason = "ลาครึ่งวันบ่ายติดวันเสาร์";
                                } else if (period === "morning" && dayOfWeek === 1) {
                                    baseDeduction = 1.5; reason = "ลาครึ่งวันเช้าติดวันอาทิตย์";
                                } else {
                                    baseDeduction = 0.5; reason = "ลาครึ่งวันปกติ";
                                }
                            }
                        }

                        if (!isMaidOrJanitor) totalDutyFee += (period !== "all_day" ? 50 : 100);
                        if (!isMaidOrJanitor && isDateInSummer(dateStr)) totalSummerFee += (period !== "all_day" ? 100 : 200);

                        breakdown.push({ date: dateStr, base: period !== "all_day" ? 0.5 : 1.0, penaltyReason: reason, final: baseDeduction });
                        totalDeducted += baseDeduction;
                    }
                    current.setDate(current.getDate() + 1);

                return { total: totalDeducted, breakdown, dutyFeeDeduction: totalDutyFee, summerFeeDeduction: totalSummerFee };

                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: "editLeave",
                            id: updatedLeave.id,
                            startDate: updatedLeave.startDate,
                            endDate: updatedLeave.endDate,
                            type: updatedLeave.type === "personal" ? "ลากิจส่วนตัว" : "ลาป่วย",
                            period: updatedLeave.period === "all_day" ? "เต็มวัน" : (updatedLeave.period === "morning" ? "ครึ่งวันเช้า" : "ครึ่งวันบ่าย"),
                            reason: updatedLeave.reason,
                            totalDeducted: updatedLeave.totalDeducted,
                            dutyFeeDeduction: updatedLeave.dutyFeeDeduction,
                            summerFeeDeduction: updatedLeave.summerFeeDeduction,
                            academicYear: updatedLeave.academicYear
                        })
                    }).catch(err => console.warn("Sheet edit note:", err));
                }
            };

            const handleSaveHoliday = (holidayData, originalDate = null) => {
                const targetAcYear = holidayData.academicYear || getAcademicYearFromDate(holidayData.date);
                const itemToSave = { ...holidayData, academicYear: targetAcYear };
                const updated = originalDate ? allHolidays.map(h => h.date === originalDate ? itemToSave : h) : [...allHolidays, itemToSave];
                setAllHolidays(updated);
                localStorage.setItem("leave_holidays_all", JSON.stringify(updated));
                if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "saveHoliday", ...itemToSave, originalDate })
                    }).catch(err => console.warn("Holiday save note:", err));
                }
                showToast("บันทึกวันหยุดเรียบร้อยแล้ว");
            };

            const handleDeleteHoliday = (dateStr) => {
                const updated = allHolidays.filter(h => h.date !== dateStr);
                setAllHolidays(updated);
                localStorage.setItem("leave_holidays_all", JSON.stringify(updated));
                if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "deleteHoliday", date: dateStr })
                    }).catch(err => console.warn("Holiday delete note:", err));
                }
                showToast("ลบวันหยุดเรียบร้อยแล้ว");
            };

            const handleSaveActivity = (activityData, originalDate = null) => {
                const targetAcYear = activityData.academicYear || getAcademicYearFromDate(activityData.date);
                const itemToSave = { ...activityData, academicYear: targetAcYear };
                const updated = originalDate ? allActivities.map(a => a.date === originalDate ? itemToSave : a) : [...allActivities, itemToSave];
                setAllActivities(updated);
                localStorage.setItem("leave_activities_all", JSON.stringify(updated));
                if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "saveActivity", ...itemToSave, originalDate })
                    }).catch(err => console.warn("Activity save note:", err));
                }
                showToast("บันทึกกิจกรรมเรียบร้อยแล้ว");
            };

            const handleDeleteActivity = (dateStr) => {
                const updated = allActivities.filter(a => a.date !== dateStr);
                setAllActivities(updated);
                localStorage.setItem("leave_activities_all", JSON.stringify(updated));
                if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                    fetch(GOOGLE_SHEET_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: "deleteActivity", date: dateStr })
                    }).catch(err => console.warn("Activity delete note:", err));
                }
                showToast("ลบกิจกรรมเรียบร้อยแล้ว");
            };

            const handleUpdateDisciplineCount = (teacherId, field, delta) => {
                setUsers(users.map(u => {
                    if (String(u.id) === String(teacherId)) {
                        const currentVal = Number(u[field] || 0);
                        const newVal = Math.max(0, currentVal + delta);
                        const updated = { ...u, [field]: newVal };
                        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                            fetch(GOOGLE_SHEET_URL, {
                                method: 'POST', mode: 'no-cors',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({ action: "updateCount", teacherId, field, count: newVal })
                            }).catch(err => console.warn("Update note:", err));
                        }
                        return updated;
                    }
                    return u;
                }));
                showToast("ปรับปรุงสถิติตามข้อบังคับเรียบร้อยแล้ว");
            };

            const handleUpdateUserField = (teacherId, actionType, fieldValue) => {
                setUsers(users.map(u => {
                    if (String(u.id) === String(teacherId)) {
                        let updated = { ...u };
                        if (actionType === "updateRole") updated.role = fieldValue;
                        if (actionType === "updatePassword") updated.password = fieldValue;
                        if (actionType === "updateEmail") updated.email = fieldValue;
                        if (GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                            fetch(GOOGLE_SHEET_URL, {
                                method: 'POST', mode: 'no-cors',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({
                                    action: actionType, teacherId,
                                    role: actionType === "updateRole" ? fieldValue : undefined,
                                    password: actionType === "updatePassword" ? fieldValue : undefined,
                                    email: actionType === "updateEmail" ? fieldValue : undefined
                                })
                            }).catch(err => console.warn("User update note:", err));
                        }
                        return updated;
                    }
                    return u;
                }));
                showToast("บันทึกการปรับเปลี่ยนเรียบร้อยแล้ว");
            };

            const renderAvatar = (teacherObj, sizeClass = "w-12 h-12 text-sm") => {
                if (teacherObj && teacherObj.photo) {
                    return (
                        <div className="relative flex-shrink-0">
                            <img 
                                src={teacherObj.photo} 
                                alt={teacherObj.name} 
                                className={`${sizeClass.split(' ')[0]} ${sizeClass.split(' ')[1]} rounded-full object-cover border-2 border-emerald-700 shadow-sm`}
                                onError={(e) => {
                                    e.target.style.display = 'none';
                                    if (e.target.nextSibling) e.target.nextSibling.style.display = 'flex';
                                }}
                            />
                            <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold items-center justify-center border-2 border-white shadow-sm uppercase text-center flex-shrink-0 hidden`}>
                                {teacherObj.name ? teacherObj.name.trim().charAt(0) : "?"}
                            </div>
                        </div>
                    );
                }
                const initialChar = teacherObj && teacherObj.name ? teacherObj.name.trim().charAt(0) : "?";
                return (
                    <div className={`${sizeClass} rounded-full bg-gradient-to-tr from-navy-800 to-emerald-700 text-white font-extrabold flex items-center justify-center border-2 border-white shadow-sm uppercase text-center flex-shrink-0`}>
                        {initialChar}
                    </div>
                );
            };

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4 font-['Sarabun']">
                        <div className="w-full max-w-lg bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-200">
                            <header className="luxury-gradient text-white p-8 text-center border-b-4 border-emerald-700">
                                <div className="w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center mx-auto mb-3.5 bg-white/10 rounded-3xl p-2 border border-white/20 shadow-inner">
                                    <img 
                                        src="logo.png" 
                                        alt="Yuwapat Logo" 
                                        className="w-full h-full object-contain drop-shadow-md"
                                        onError={(e) => {
                                            if (e.target.src.indexOf('logo.png') !== -1) {
                                                e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                            }
                                        }}
                                    />
                                </div>
                                <h2 className="text-xl font-extrabold text-white">Yuwapat Early Childhood School</h2>
                                <p className="text-sm text-emerald-100 mt-1">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                                <p className="text-xs text-slate-300 mt-1">ระบบบริหารจัดการวันลาและสถิติการปฏิบัติงานบุคลากร</p>
                            </header>

                            {notification && (
                                <div className="mx-8 mt-5 p-4 text-xs sm:text-sm rounded-xl border flex items-center gap-3 bg-red-50 text-red-800 border-red-200">
                                    <i className="fa-solid fa-circle-exclamation text-red-500 text-lg"></i>
                                    <span className="font-semibold">{notification.message}</span>
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="p-8 space-y-5 text-left">
                                <div>
                                    <label className="block text-slate-700 text-xs sm:text-sm font-bold uppercase mb-1">อีเมลสังกัดโรงเรียน / รหัสประจำตัว</label>
                                    <input 
                                        type="text" 
                                        placeholder="กรอกรหัสประจำตัว (เช่น 1, 2, 44) หรือ Email"
                                        value={loginId}
                                        onChange={(e) => setLoginId(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-4 py-3.5 rounded-xl font-semibold text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-emerald-700"
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-slate-700 text-xs sm:text-sm font-bold uppercase mb-1">รหัสผ่านเข้าสู่ระบบ</label>
                                    <input 
                                        type="password" 
                                        placeholder="กรอกรหัสผ่าน (เริ่มต้น 1234)"
                                        value={loginPassword}
                                        onChange={(e) => setLoginPassword(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-4 py-3.5 rounded-xl font-semibold text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-emerald-700"
                                        required
                                    />
                                </div>

                                <div className="flex items-center gap-2 mt-2">
                                    <input 
                                        type="checkbox" 
                                        id="rememberMe" 
                                        checked={rememberMe}
                                        onChange={(e) => setRememberMe(e.target.checked)}
                                        className="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500 cursor-pointer"
                                    />
                                    <label htmlFor="rememberMe" className="text-sm font-bold text-slate-600 cursor-pointer select-none">
                                        จดจำการเข้าสู่ระบบในเครื่องนี้ (Auto-login)
                                    </label>
                                </div>

                                <button 
                                    type="submit"
                                    className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-4 px-6 rounded-xl transition duration-200 shadow-md text-sm sm:text-base uppercase tracking-wider mt-4"
                                >
                                    เข้าสู่ระบบความปลอดภัย
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const currentRole = normalizeRole(currentUser.role, currentUser.id);
            const isAdminOrHr = currentRole === "admin" || currentRole === "hr";

            return (
                <div className="min-h-screen flex flex-col bg-[#F8FAFC]">
                    <header className="luxury-gradient text-white shadow-xl sticky top-0 z-30 border-b border-emerald-700/50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                            <div className="flex flex-col lg:flex-row items-center justify-between gap-3">
                                <div className="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
                                    <div className="flex items-center gap-3">
                                        <div className="w-11 h-11 sm:w-13 sm:h-13 flex items-center justify-center flex-shrink-0 bg-white/10 rounded-2xl p-1.5 border border-white/20 shadow-inner">
                                            <img 
                                                src="logo.png" 
                                                alt="Yuwapat Logo" 
                                                className="w-full h-full object-contain drop-shadow"
                                                onError={(e) => {
                                                    if (e.target.src.indexOf('logo.png') !== -1) {
                                                        e.target.src = "https://lh3.googleusercontent.com/d/1c3cjNBo_XSXdYjn6RAWkodMqChNPrk49";
                                                    }
                                                }}
                                            />
                                        </div>
                                        <div className="text-left">
                                            <h1 className="text-base sm:text-lg font-extrabold text-white tracking-tight leading-tight">Yuwapat Early Childhood School</h1>
                                            <p className="text-xs text-emerald-200 font-medium">โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                                        </div>
                                    </div>

                                    <div className="flex lg:hidden items-center gap-2 bg-navy-950/80 px-2.5 py-1.5 rounded-xl border border-emerald-500/30">
                                        <div className="text-right">
                                            <p className="text-[10px] font-bold text-emerald-400 uppercase leading-none">{currentRole === 'admin' ? 'แอดมิน' : currentRole === 'hr' ? 'HR' : 'บุคลากร'}</p>
                                            <p className="text-xs font-bold text-white truncate max-w-[100px]">{currentUser.name}</p>
                                        </div>
                                        <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 text-white w-7 h-7 rounded-lg flex items-center justify-center transition">
                                            <i className="fa-solid fa-power-off text-xs"></i>
                                        </button>
                                    </div>
                                </div>

                                <div className="flex items-center gap-2.5 flex-wrap w-full lg:w-auto justify-end">
                                    <div className="flex items-center bg-navy-950/90 px-3 py-1.5 rounded-xl border border-emerald-500/40 shadow-sm">
                                        <i className="fa-solid fa-graduation-cap text-emerald-400 mr-2 text-xs"></i>
                                        <span className="text-xs font-bold text-slate-300 mr-2 hidden sm:inline">ปีการศึกษา:</span>
                                        <select 
                                            value={selectedYear}
                                            onChange={(e) => setSelectedYear(e.target.value)}
                                            className="bg-navy-900 border border-emerald-600/50 text-emerald-300 px-2.5 py-1 rounded-lg text-xs font-extrabold focus:outline-none focus:ring-1 focus:ring-emerald-400 cursor-pointer"
                                        >
                                            <option value="2568">2568 (1 พ.ค. 68 – 30 เม.ย. 69)</option>
                                            <option value="2569">2569 (1 พ.ค. 69 – 30 เม.ย. 70)</option>
                                            <option value="2570">2570 (1 พ.ค. 70 – 30 เม.ย. 71)</option>
                                            <option value="2571">2571 (1 พ.ค. 71 – 30 เม.ย. 72)</option>
                                        </select>
                                        <button 
                                            onClick={() => fetchSheetData(true)}
                                            disabled={isSyncing}
                                            className={`ml-2 text-slate-300 hover:text-emerald-400 p-1 transition ${isSyncing ? 'animate-spin text-emerald-400' : ''}`}
                                            title="ซิงก์ดึงข้อมูลสดจากชีทใหม่"
                                        >
                                            <i className="fa-solid fa-rotate text-xs"></i>
                                        </button>
                                    </div>

                                    {isAdminOrHr && (
                                        <div className="flex bg-navy-950/90 p-1 rounded-xl border border-emerald-700/40 shadow-sm">
                                            <button 
                                                onClick={() => setActiveTab("teacher")}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeTab === 'teacher' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                <i className="fa-solid fa-user text-xs"></i>
                                                พอร์ทัลบุคลากร
                                            </button>
                                            <button 
                                                onClick={() => setActiveTab("admin")}
                                                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 ${activeTab === 'admin' ? 'bg-emerald-700 text-white shadow' : 'text-slate-300 hover:text-white'}`}
                                            >
                                                <i className="fa-solid fa-user-shield text-xs"></i>
                                                บริหารบุคคล (ADMIN/HR)
                                            </button>
                                        </div>
                                    )}

                                    <div className="hidden lg:flex items-center gap-2.5 bg-navy-950/90 pl-3.5 pr-2 py-1.5 rounded-xl border border-emerald-700/40 shadow-sm text-left">
                                        <div>
                                            <p className="text-[10px] font-bold text-emerald-400 uppercase leading-none">
                                                {currentRole === 'admin' ? 'ผู้ดูแลระบบสูงสุด' : currentRole === 'hr' ? 'งานบุคคล (HR)' : 'บุคลากร'}
                                            </p>
                                            <p className="text-xs font-bold text-white mt-0.5 leading-none">{currentUser.prefix}{currentUser.name}</p>
                                        </div>
                                        <button 
                                            onClick={handleLogout}
                                            className="bg-red-600 hover:bg-red-700 text-white w-7 h-7 rounded-lg flex items-center justify-center transition shadow"
                                            title="ออกจากระบบ"
                                        >
                                            <i className="fa-solid fa-power-off text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    {notification && (
                        <div className="fixed top-20 right-4 z-50 animate-bounce">
                            <div className="shadow-2xl rounded-2xl p-4 flex items-center gap-3 bg-emerald-50 border border-emerald-200 text-emerald-800">
                                <i className="fa-solid fa-circle-check text-emerald-600 text-2xl"></i>
                                <div className="text-left">
                                    <p className="font-bold text-sm">ระบบแจ้งเตือนสารสนเทศ</p>
                                    <p className="text-xs mt-0.5">{notification.message}</p>
                                </div>
                            </div>
                        </div>
                    )}

                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-md border text-center">
                                <i className="fa-solid fa-triangle-exclamation text-amber-500 text-4xl mb-4"></i>
                                <h3 className="text-base sm:text-lg font-bold text-slate-800">{confirmDialog.title}</h3>
                                <p className="text-xs sm:text-sm text-slate-600 mt-2">{confirmDialog.message}</p>
                                <div className="grid grid-cols-2 gap-3 mt-6">
                                    <button 
                                        onClick={() => setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null })}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs sm:text-sm"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        onClick={confirmDialog.onConfirm}
                                        className="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs sm:text-sm shadow"
                                    >
                                        ยืนยันการทำรายการ
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
                        {activeTab === "teacher" && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="space-y-6 lg:col-span-1 text-left">
                                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                                        {isAdminOrHr ? (
                                            <div className="mb-5">
                                                <label className="block text-xs sm:text-sm font-bold text-slate-700 mb-1.5">เลือกมุมมองบุคลากร ({users.length} ท่าน)</label>
                                                <select 
                                                    value={selectedTeacherId}
                                                    onChange={(e) => setSelectedTeacherId(e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-300 text-slate-800 px-3.5 py-3 rounded-xl font-bold text-xs sm:text-sm"
                                                >
                                                    {users.map(u => (
                                                        <option key={u.id} value={u.id}>
                                                            [{u.id}] {u.prefix}{u.name} ({u.role === 'admin' ? 'แอดมิน' : u.role === 'hr' ? 'HR' : u.role === 'teacher' ? 'ครู' : u.role === 'maid' ? 'แม่บ้าน' : 'พ่อบ้าน'})
                                                        </option>
                                                    ))}
                                                </select>
                                            </div>
                                        ) : null}

                                        {selectedTeacher && (
                                            <div className="bg-navy-900 text-white rounded-2xl p-5 shadow-md relative overflow-hidden">
                                                <div className="flex items-center gap-4">
                                                    {renderAvatar(selectedTeacher, "w-14 h-14 text-base")}
                                                    <div className="overflow-hidden text-left">
                                                        <p className="text-xs text-emerald-400 font-mono font-bold">รหัสประจำตัว: {selectedTeacher.id}</p>
                                                        <h3 className="font-extrabold text-base text-white truncate">{selectedTeacher.prefix}{selectedTeacher.name}</h3>
                                                        <p className="text-xs text-slate-300 mt-0.5">
                                                            {selectedTeacher.role === 'teacher' ? 'ครูผู้สอน / บุคลากรทางการศึกษา' : selectedTeacher.role === 'maid' ? 'เจ้าหน้าที่แม่บ้าน' : selectedTeacher.role === 'janitor' ? 'เจ้าหน้าที่พ่อบ้าน' : 'เจ้าหน้าที่บริหาร'}
                                                        </p>
                                                        <div className="inline-block mt-2 bg-emerald-950/80 border border-emerald-500/50 px-2 py-0.5 rounded text-[11px] font-bold text-emerald-300">
                                                            ปีการศึกษา {selectedYear}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 gap-2.5 mt-4">
                                                    <button 
                                                        onClick={() => {
                                                            setViewDisciplineTeacher(selectedTeacher);
                                                            setShowViewDisciplineModal(true);
                                                        }}
                                                        className="w-full bg-emerald-700 hover:bg-emerald-600 text-white py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 shadow"
                                                    >
                                                        <i className="fa-solid fa-calendar-check text-sm"></i>
                                                        ตรวจสอบประวัติการลงเวลา & สถิติวินัย
                                                    </button>
                                                    
                                                    <button 
                                                        onClick={() => {
                                                            const isMaid = selectedTeacher.role === "maid" || selectedTeacher.role === "janitor";
                                                            setRuleTab(isMaid ? "maid" : "teacher");
                                                            setShowRuleModal(true);
                                                        }}

                                                                    defaultValue={u.email}
                                                                    onBlur={(e) => handleUpdateUserField(u.id, "updateEmail", e.target.value)}
                                                                    className="bg-slate-50 border border-slate-300 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-mono w-48"
                                                                />
                                                            </td>
                                                            <td className="py-3.5 px-3">
                                                                <input 
                                                                    type="text" 
                                                                    defaultValue={u.password}
                                                                    onBlur={(e) => handleUpdateUserField(u.id, "updatePassword", e.target.value)}
                                                                    className="bg-slate-50 border border-slate-300 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-mono w-28 text-center font-bold"
                                                                />
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Modals เพิ่ม/แก้ไขบุคลากร */}
                    {showAddTeacherModal && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-lg border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">บันทึกเพิ่มข้อมูลบุคลากรใหม่</h3>
                                    <button onClick={() => setShowAddTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!newTeacher.name) return;
                                    const newId = String(users.length + 1);
                                    const u = { ...newTeacher, id: newId, lateCount: 0, forgotTimeCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0 };
                                    setUsers([...users, u]);

                                    if (newTeacher.photo && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: newId,
                                                base64: newTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowAddTeacherModal(false);
                                    showToast(`เพิ่มข้อมูลบุคลากรเรียบร้อยแล้ว`);
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div className="flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        {newTeacher.photo ? (
                                            <img src={newTeacher.photo} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-700 shadow" />
                                        ) : (
                                            <div className="w-14 h-14 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-xl"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เลือกรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setNewTeacher({ ...newTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-slate-200 file:text-slate-800 hover:file:bg-slate-300 cursor-pointer"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={newTeacher.name}
                                            onChange={(e) => setNewTeacher({ ...newTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">บทบาทหน้าที่</label>
                                            <select 
                                                value={newTeacher.role}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, role: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-300 px-3.5 py-3 rounded-xl font-bold"
                                            >
                                                <option value="teacher">ครูผู้สอน</option>
                                                <option value="maid">แม่บ้าน</option>
                                                <option value="janitor">พ่อบ้าน</option>
                                                <option value="hr">ฝ่ายบุคคล (HR)</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">รหัสผ่านเข้าใช้งาน</label>
                                            <input 
                                                type="text" 
                                                value={newTeacher.password}
                                                onChange={(e) => setNewTeacher({ ...newTeacher, password: e.target.value })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกข้อมูลบุคลากร
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showEditTeacherModal && editingTeacher && (
                        <div className="fixed inset-0 bg-navy-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 w-full max-w-lg border text-left">
                                <div className="flex justify-between items-center border-b pb-4 mb-4">
                                    <h3 className="text-base font-bold text-slate-800">แก้ไขข้อมูลบุคลากร</h3>
                                    <button onClick={() => setShowEditTeacherModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-xl"></i>
                                    </button>
                                </div>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    setUsers(users.map(u => u.id === editingTeacher.id ? editingTeacher : u));

                                    if (editingTeacher.photo && editingTeacher.photo.startsWith("data:image") && GOOGLE_SHEET_URL && !GOOGLE_SHEET_URL.includes("YOUR_SCRIPT_ID")) {
                                        fetch(GOOGLE_SHEET_URL, {
                                            method: 'POST',
                                            mode: 'no-cors',
                                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                            body: JSON.stringify({
                                                action: "uploadPhoto",
                                                teacherId: editingTeacher.id,
                                                base64: editingTeacher.photo
                                            })
                                        }).catch(err => console.error("Photo upload error:", err));
                                    }

                                    setShowEditTeacherModal(false);
                                    showToast("ปรับปรุงข้อมูลเรียบร้อยแล้ว");
                                }} className="space-y-4 text-xs sm:text-sm">
                                    <div className="flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-200">
                                        {editingTeacher.photo ? (
                                            <img src={editingTeacher.photo} className="w-14 h-14 rounded-full object-cover border-2 border-emerald-700 shadow" />
                                        ) : (
                                            <div className="w-14 h-14 rounded-full bg-slate-200 flex items-center justify-center text-slate-400">
                                                <i className="fa-solid fa-camera text-xl"></i>
                                            </div>
                                        )}
                                        <div className="flex-1">
                                            <label className="block text-slate-700 font-bold mb-1">เปลี่ยนรูปถ่ายประจำตัว</label>
                                            <input 
                                                type="file" 
                                                accept="image/*"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) {
                                                        handleImageUpload(file, (base64) => {
                                                            setEditingTeacher({ ...editingTeacher, photo: base64 });
                                                        });
                                                    }
                                                }}
                                                className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-black file:bg-slate-200 file:text-slate-800 hover:file:bg-slate-300 cursor-pointer"
                                            />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-slate-700 font-bold mb-1.5">ชื่อ-นามสกุลจริง</label>
                                        <input 
                                            type="text" 
                                            value={editingTeacher.name}
                                            onChange={(e) => setEditingTeacher({ ...editingTeacher, name: e.target.value })}
                                            className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                            required
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">โควตาลากิจส่วนตัว</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.personalQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, personalQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-700 font-bold mb-1.5">โควตาลาป่วย</label>
                                            <input 
                                                type="number" 
                                                value={editingTeacher.sickQuota}
                                                onChange={(e) => setEditingTeacher({ ...editingTeacher, sickQuota: Number(e.target.value) })}
                                                className="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-xl"
                                                required
                                            />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow mt-2">
                                        บันทึกปรับปรุงข้อมูล
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-navy-950 text-slate-400 py-8 text-center text-xs sm:text-sm mt-12 border-t border-emerald-700/30">
                        <p>© ๒๕๖๙ ระบบบริหารจัดการวันลาและสถิติการปฏิบัติงาน - โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์ (ปีการศึกษา {selectedYear})</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
