        function isStaffWeeklyOff(user, date) {
            const dayOfWeek = date.getDay(); // 0 = อาทิตย์, 6 = เสาร์
            if (!user) return false;
            
            const role = user?.role;
            if (role === "admin" || role === "hr" || role === "teacher") {
                return dayOfWeek === 0 || dayOfWeek === 6;
            }
            if (dayOfWeek === 0) return true;
            if (role === "janitor") return false; 
            
            if (role === "maid") {
                if (dayOfWeek === 6) {
                    const dayOfMonth = date.getDate();
                    const satNumber = Math.ceil(dayOfMonth / 7); 
                    const name = user.name || "";
                    
                    if (satNumber === 1 && (name.includes("สุทิน") || name.includes("สุวภัทร"))) return true;
                    if (satNumber === 2 && (name.includes("สมใจ") || name.includes("อรทัย"))) return true;
                    if (satNumber === 3 && (name.includes("สำราญ") || name.includes("สมจิต"))) return true;
                    if (satNumber === 4 && name.includes("กรกช")) return true;
                }
            }
            return false;
        }

        function normalizeRole(rawRole) {
            if (!rawRole) return "teacher";
            const str = String(rawRole).toLowerCase().trim();
            if (str.includes("admin") || str.includes("แอดมิน") || str.includes("ผู้ดูแล")) return "admin";
            if (str.includes("hr") || str.includes("บุคคล")) return "hr";
            if (str.includes("maid") || str.includes("แม่บ้าน")) return "maid";
            if (str.includes("janitor") || str.includes("พ่อบ้าน")) return "janitor";
            return "teacher";
        }

            function getLocalDateString(date) {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            function isSchoolHoliday(dateStr) { return holidays.some(h => h.date === dateStr); }

            function getSchoolActivity(dateStr) { return activities.find(a => a.date === dateStr); }

                if (role === 'janitor') return 'พ่อบ้าน';
                return 'บุคลากร';

                if (type === "missedMeetingCount") return "ขาดประชุมพบกันฉันน้องพี่";
                return "บันทึกวินัย";
            }

            function formatThaiDate(dateStr) {
                if (!dateStr) return "-";
                const months = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
            }

            function renderAvatar(teacherObj, sizeClass = "w-11 h-11 text-sm") {

                    return (

                    );
                }

                        {initialChar}
                    </div>
                );
            }

            function getContiguousNonWorkingBlockLength(targetDate, direction, userObj) {
                let current = new Date(targetDate.getTime());
                let count = 0;
                while (true) {
                    current.setDate(current.getDate() + direction);
                    const currentStr = getLocalDateString(current);
                    if (isStaffWeeklyOff(userObj, current) || isSchoolHoliday(currentStr)) {
                        count++;
                    } else {
                        break; 
                    }
                }
                return count;
            }

            const calculateLeaveDays = (startDateStr, endDateStr, period = "all_day", userObj = selectedTeacher) => {
                const actualEndDateStr = period !== "all_day" ? startDateStr : endDateStr;
                if (!startDateStr || !actualEndDateStr || !userObj) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };
                
                const start = new Date(startDateStr);
                const end = new Date(actualEndDateStr);
                
                if (end < start) return { total: 0, breakdown: [], dutyFeeDeduction: 0 };

                const breakdown = [];
                let totalDeducted = 0;
                let dutyFeeDeduction = 0;

                let current = new Date(start.getTime());
                while (current <= end) {
                    const dateStr = getLocalDateString(current);
                    const dayOfWeek = current.getDay();
                    const isWeeklyOff = isStaffWeeklyOff(userObj, current);
                    const isHoliday = isSchoolHoliday(dateStr);

                    } else {
                        let base = period !== "all_day" ? 0.5 : 1.0;
                        let finalDeductedForDay = base;
                        let penaltyReason = "อัตราปกติ";

                        const isTeacherRole = userObj?.role === "teacher" || userObj?.role === "admin" || userObj?.role === "hr";

                                finalDeductedForDay = 1.5;

                            } else if (period === "all_day" && (dayOfWeek === 5 || dayOfWeek === 1)) {
                                let hasAdjacentHoliday = false;
                                if (dayOfWeek === 5) {
                                    const thurs = new Date(current.getTime());
                                    thurs.setDate(thurs.getDate() - 1);
                                    if (isSchoolHoliday(getLocalDateString(thurs))) hasAdjacentHoliday = true;
                                } else if (dayOfWeek === 1) {
                                    const tues = new Date(current.getTime());
                                    tues.setDate(tues.getDate() + 1);
                                    if (isSchoolHoliday(getLocalDateString(tues))) hasAdjacentHoliday = true;
                                }

                                if (hasAdjacentHoliday) {
                                    finalDeductedForDay = 3.0;
                                    penaltyReason = "ลาเต็มวัน ติดเสาร์-อาทิตย์ และวันหยุดปฏิทิน";
                                } else {
                                    finalDeductedForDay = 2.0;
                                    penaltyReason = "ลาเต็มวัน ติดวันเสาร์-อาทิตย์";
                                }
                            }
                        } else {
                            if (period === "afternoon" && dayOfWeek === 6) {
                                finalDeductedForDay = 1.5;
                                penaltyReason = "ลา 0.5 วันบ่าย ติดวันอาทิตย์";
                            } else if (period === "morning" && dayOfWeek === 1) {
                                finalDeductedForDay = 1.5;
                                penaltyReason = "ลา 0.5 วันเช้า ติดวันอาทิตย์";
                            } else if (period === "all_day" && (dayOfWeek === 6 || dayOfWeek === 1)) {
                                let hasAdjacentHoliday = false;
                                if (dayOfWeek === 6) {
                                    const fri = new Date(current.getTime());
                                    fri.setDate(fri.getDate() - 1);
                                    if (isSchoolHoliday(getLocalDateString(fri))) hasAdjacentHoliday = true;
                                } else if (dayOfWeek === 1) {
                                    const tues = new Date(current.getTime());
                                    tues.setDate(tues.getDate() + 1);
                                    if (isSchoolHoliday(getLocalDateString(tues))) hasAdjacentHoliday = true;
                                }

                                if (hasAdjacentHoliday) {
                                    finalDeductedForDay = 3.0;
                                    penaltyReason = "ลาเต็มวัน ติดวันอาทิตย์ และวันหยุดปฏิทิน";
                                } else {
                                    finalDeductedForDay = 2.0;
                                    penaltyReason = "ลาเต็มวัน ติดวันอาทิตย์";
                                }
                            }
                        }

                        const activity = getSchoolActivity(dateStr);
                        if (activity) {
                            const isMeeting = activity.type === "meeting";
                            const isSpecialFull = activity.type === "special_full";
                            const isSpecialHalf = activity.type === "special_half";

                            if (isTeacherRole) {
                                if (isMeeting) {
                                    if (period === "afternoon") {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาครึ่งบ่าย ตรงกับวันประชุมพบกันฉันน้องพี่";
                                    } else if (period === "all_day") {
                                        finalDeductedForDay = 2.0;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันประชุมพบกันฉันน้องพี่";
                                    }
                                } else if (isSpecialFull) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 2.0;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    } else {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    }
                                } else if (isSpecialHalf) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    } else {
                                        finalDeductedForDay = 1.0;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    }
                                }
                            } else {
                                if (isSpecialFull) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 2.0;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    } else {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษตลอดวัน";
                                    }
                                } else if (isSpecialHalf) {
                                    if (period === "all_day") {
                                        finalDeductedForDay = 1.5;
                                        penaltyReason = "ลาเต็มวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    } else {
                                        finalDeductedForDay = 1.0;
                                        penaltyReason = "ลาครึ่งวัน ตรงกับวันกิจกรรมพิเศษครึ่งวัน";
                                    }
                                }
                            }
                        }

                        if (period === "all_day") {
                            const prevNonWork = getContiguousNonWorkingBlockLength(current, -1, userObj);
                            const nextNonWork = getContiguousNonWorkingBlockLength(current, 1, userObj);
                            if (prevNonWork > 0 && nextNonWork > 0) {
                                const totalSandwichDays = prevNonWork + nextNonWork;
                                const sandwichPenalty = 1.0 + totalSandwichDays;
                                if (sandwichPenalty > finalDeductedForDay) {
                                    finalDeductedForDay = sandwichPenalty;
                                    penaltyReason = `ลาเต็มวันค่อมวันหยุด (บวกสะสมหยุดต่อ ${totalSandwichDays} วัน)`;
                                }
                            }
                        }

                        breakdown.push({
                            date: dateStr,
                            base: base,
                            penalty: finalDeductedForDay - base,
                            penaltyReason: penaltyReason,
                            final: finalDeductedForDay,
                            dutyFee: fee
                        });
                        totalDeducted += finalDeductedForDay;
                    }
                    current.setDate(current.getDate() + 1);
                }
                return { total: totalDeducted, breakdown, dutyFeeDeduction };

            const getTeacherStats = (teacherId) => {
                const teacherObj = users.find(u => u.id === teacherId);
                if (!teacherObj) return { sickUsed: 0, personalUsed: 0, personalDeductedFromLeaves: 0, latePenalty: 0, lateCount: 0, forgotTimePenalty: 0, forgotTimeCount: 0, middayOutPenalty: 0, middayOutCount: 0, middayOutShortCount: 0, middayOutLongCount: 0, missedMeetingCount: 0, missedMeetingPenalty: 0 };
                
                const sickUsed = leaves
                    .filter(l => l.teacherId === teacherId && l.status === "approved" && l.type === "sick")
                    .reduce((sum, l) => sum + (Number(l.totalDeducted) || 0), 0);
                    
                const personalDeductedFromLeaves = leaves
                    .filter(l => l.teacherId === teacherId && l.status === "approved" && l.type === "personal")
                    .reduce((sum, l) => sum + (Number(l.totalDeducted) || 0), 0);
                    
                const rawLateCount = Number(teacherObj?.lateCount) || 0;
                const forgotTimeCount = Number(teacherObj?.forgotTimeCount) || 0;
                const middayOutShortCount = Number(teacherObj?.middayOutShortCount) || 0;
                const middayOutLongCount = Number(teacherObj?.middayOutLongCount) || 0;
                const missedMeetingCount = Number(teacherObj?.missedMeetingCount) || 0;

                const effectiveLateCount = rawLateCount + middayOutShortCount;

                const latePenalty = Math.floor(effectiveLateCount / 3);
                const forgotTimePenalty = Math.floor(forgotTimeCount / 3);
                const middayOutPenalty = middayOutLongCount * 0.5;
                const missedMeetingPenalty = missedMeetingCount * 1.0;

                const personalUsed = personalDeductedFromLeaves + latePenalty + forgotTimePenalty + middayOutPenalty + missedMeetingPenalty;
                
                return { sickUsed, personalUsed, personalDeductedFromLeaves, latePenalty, lateCount: rawLateCount, effectiveLateCount, forgotTimePenalty, forgotTimeCount, middayOutPenalty, middayOutCount: middayOutLongCount, middayOutShortCount, middayOutLongCount, missedMeetingCount, missedMeetingPenalty };

                                    <div className="flex bg-navy-950 p-1 rounded-xl border border-emerald-700/30">
                                        <button onClick={() => setActiveTab("teacher")} className={`px-5 py-2.5 rounded-lg text-xs font-bold ${activeTab === 'teacher' ? 'bg-emerald-700 text-white' : 'text-slate-300'}`}>พอร์ทัลบุคลากร</button>
                                        <button onClick={() => setActiveTab("admin")} className={`px-5 py-2.5 rounded-lg text-xs font-bold ${activeTab === 'admin' ? 'bg-emerald-700 text-white' : 'text-slate-300'}`}>ฝ่ายบริหารงานบุคคล</button>
                                    </div>
                                )}
                                <div className="flex items-center gap-3 bg-navy-950 pl-4 pr-2 py-1.5 rounded-xl border border-emerald-700/30">
                                    <div className="text-right">
                                        <p className="text-[10px] font-bold text-emerald-400 uppercase">{getRoleText(currentUser.role)}</p>
                                        <p className="text-xs font-bold text-white">{currentUser.prefix}{currentUser.name}</p>
                                    </div>
                                    <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 text-white w-8 h-8 rounded-lg flex items-center justify-center transition shadow"><i className="fa-solid fa-power-off text-xs"></i></button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {notification && (
                        <div className="fixed top-20 right-4 z-50 animate-bounce">
                            <div className={`shadow-2xl rounded-2xl p-4 border flex items-center gap-3 font-bold text-xs ${notification.type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-emerald-50 border-emerald-200 text-emerald-800'}`}>
                                <i className={`fa-solid ${notification.type === 'error' ? 'fa-circle-xmark text-red-500' : 'fa-circle-check text-emerald-600'} text-xl`}></i>
                                <span>{notification.message}</span>
                            </div>
                        </div>
                    )}

                    {confirmDialog.isOpen && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm border text-center">
                                <i className="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-3 block"></i>
                                <h3 className="font-extrabold text-slate-800 text-sm mb-1">{confirmDialog.title}</h3>
                                <p className="text-xs text-slate-500 mb-5">{confirmDialog.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDialog({ isOpen: false, title: "", message: "", onConfirm: null })} className="flex-1 bg-slate-100 text-slate-600 py-2 rounded-xl text-xs font-bold">ยกเลิก</button>
                                    <button onClick={confirmDialog.onConfirm} className="flex-1 bg-red-600 text-white py-2 rounded-xl text-xs font-bold">ยืนยัน</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
                        {/* ==================== 1. พอร์ทัลบุคลากร (TEACHER / MAID / JANITOR) ==================== */}
                        {activeTab === "teacher" && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {/* ฝั่งซ้าย: ข้อมูลบุคลากร + สถิติวินัยสะสม + กฎเกณฑ์ */}
                                <div className="space-y-6 lg:col-span-1">
                                    <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-100 text-left">
                                        {currentUser?.role !== "teacher" && currentUser?.role !== "maid" && currentUser?.role !== "janitor" && (
                                            <div className="mb-4">
                                                <label className="block text-xs font-bold text-slate-500 mb-1.5">จำลองมุมมองบุคลากร:</label>
                                                <select value={selectedTeacherId} onChange={(e) => setSelectedTeacherId(e.target.value)} className="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs font-bold text-slate-800">
                                                    {users.map(u => (
                                                        <option key={u.id} value={u.id}>[{u.id}] {u.prefix}{u.name} ({getRoleText(u.role)})</option>
                                                    ))}
                                                </select>
                                            </div>
                                        )}

                                        {selectedTeacher && (
                                            <div className="bg-navy-900 text-white rounded-xl p-5 shadow flex items-center gap-4">
                                                {renderAvatar(selectedTeacher, "w-14 h-14 text-base")}
                                                <div className="text-left overflow-hidden">
                                                    <p className="text-xs text-emerald-400 font-mono font-bold">ID: {selectedTeacher.id}</p>
                                                    <h3 className="font-extrabold text-sm text-white truncate">{selectedTeacher.prefix}{selectedTeacher.name}</h3>
                                                    <p className="text-xs text-slate-300 mt-1">ตำแหน่ง: {getRoleText(selectedTeacher.role)}</p>
                                                    <p className="text-[11px] text-slate-400 mt-0.5">📅 วันเริ่มงาน: {formatThaiDate(selectedTeacher.hireDate)}</p>
                                                </div>
                                            </div>
                                        )}

                                        <button 
                                            onClick={() => setShowViewLogsModal(true)}
                                            className="w-full mt-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 font-bold py-2.5 px-4 rounded-xl text-xs transition border border-emerald-200 flex items-center justify-center gap-2"
                                        >
                                            <i className="fa-solid fa-calendar-check text-emerald-700"></i>
                                            <span>📅 ดูประวัติวันที่ลืมลงเวลา / ออกนอกงานย้อนหลัง</span>
                                        </button>
                                    </div>

                                    {/* สถิติวินัยและการใช้สิทธิ์ลากิจ/ลาป่วย */}
                                    {selectedTeacher && selectedTeacherStats && (
                                        <div className="space-y-4 text-left">
                                            <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-100 relative">
                                                <span className="bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">ลากิจส่วนตัว</span>
                                                <h4 className="text-4xl font-extrabold text-slate-800 mt-3">
                                                    {(selectedTeacher.personalQuota - selectedTeacherStats.personalUsed).toFixed(1)}
                                                    <span className="text-xs font-bold text-slate-400 ml-2">วันคงเหลือ</span>
                                                </h4>
                                                
                                                <div className="mt-4 border-t pt-3 text-xs space-y-2 text-slate-500 font-semibold">
                                                    <div className="flex justify-between items-center">
                                                        <span>1. มาสายสะสม:</span>
                                                        <span className={selectedTeacherStats.effectiveLateCount >= 3 ? "text-red-600 font-bold" : "text-slate-800"}>
                                                            {selectedTeacherStats.effectiveLateCount} ครั้ง (-{selectedTeacherStats.latePenalty} วัน)
                                                            {isTeacherRole && selectedTeacherStats.effectiveLateCount >= 9 && <span className="text-red-600 font-black block text-[9px]">⚠️ ลงบันทึกความผิด</span>}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between items-center">
                                                        <span>2. ลืมบันทึกเวลา:</span>
                                                        <span className={selectedTeacherStats.forgotTimeCount >= 3 ? "text-red-600 font-bold" : "text-slate-800"}>
                                                            {selectedTeacherStats.forgotTimeCount} ครั้ง (-{selectedTeacherStats.forgotTimePenalty} วัน)
                                                            {isTeacherRole && selectedTeacherStats.forgotTimeCount >= 9 && <span className="text-red-600 font-black block text-[9px]">⚠️ ลงบันทึกความผิด</span>}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>3. ออกระหว่างวัน &gt; 1.30 ชม.:</span>
                                                        <span className={selectedTeacherStats.middayOutLongCount > 0 ? "text-red-600 font-bold" : "text-slate-800"}>{selectedTeacherStats.middayOutLongCount} ครั้ง (-{selectedTeacherStats.middayOutPenalty} วัน)</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>4. ขาดประชุมพบกันฉันน้องพี่:</span>
                                                        <span className={selectedTeacherStats.missedMeetingCount > 0 ? "text-red-600 font-bold" : "text-slate-800"}>{selectedTeacherStats.missedMeetingCount} ครั้ง (-{selectedTeacherStats.missedMeetingPenalty} วัน)</span>
                                                    </div>
                                                </div>

                                                {(selectedTeacher.personalQuota - selectedTeacherStats.personalUsed) <= 0 && (
                                                    <div className="mt-3 p-2 bg-red-50 text-red-600 text-center rounded-xl font-black text-xs border border-red-100 animate-pulse">
                                                        💸 หักเงินเดือน
                                                    </div>
                                                )}

                                                <div className="mt-3 pt-2 border-t text-[11px] text-slate-400 flex justify-between font-bold">
                                                    <span>โควตาตั้งต้น: {selectedTeacher.personalQuota} วัน</span>
                                                    <span>ยื่นลาจริง: {selectedTeacherStats.personalDeductedFromLeaves.toFixed(1)} วัน</span>
                                                </div>
                                            </div>

                                            <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-100">
                                                <span className="bg-emerald-50 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-100">ลาป่วยสะสม</span>
                                                <h4 className="text-4xl font-extrabold text-slate-800 mt-3">
                                                    {(selectedTeacher.sickQuota - selectedTeacherStats.sickUsed).toFixed(1)}
                                                    <span className="text-xs font-bold text-slate-400 ml-2">วันคงเหลือ</span>
                                                </h4>
                                                {(selectedTeacher.sickQuota - selectedTeacherStats.sickUsed) <= 0 && (
                                                    <div className="mt-3 p-2 bg-red-50 text-red-600 text-center rounded-xl font-black text-xs border border-red-100 animate-pulse">
                                                        💸 หักเงินเดือน
                                                    </div>
                                                )}
                                                <div className="mt-3 pt-2 border-t text-[11px] text-slate-400 flex justify-between font-bold">
                                                    <span>โควตาตั้งต้น: {selectedTeacher.sickQuota} วัน</span>
                                                    <span>ลาป่วยรวม: {selectedTeacherStats.sickUsed.toFixed(1)} วัน</span>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* กล่องกฎเกณฑ์การหักวันลา */}
                                    <div className="bg-navy-900 text-slate-200 rounded-2xl p-5 shadow-md text-left text-xs space-y-3">
                                        <h3 className="font-extrabold text-emerald-300 text-sm flex items-center gap-2">
                                            <i className="fa-solid fa-circle-exclamation text-emerald-500"></i>
                                            กฎเกณฑ์และระเบียบการหักวันลา ({isTeacherRole ? "สำหรับคุณครู" : "สำหรับแม่บ้าน-พ่อบ้าน"})
                                        </h3>
                                        <ul className="space-y-2 text-slate-300">
                                            <li className="flex gap-2"><span className="text-emerald-400 font-bold">✔</span> <span>{isTeacherRole ? "วันเสาร์-อาทิตย์ และวันหยุดปฏิทิน ไม่คิดหักวันลา" : "วันอาทิตย์ และวันหยุดปฏิทิน ไม่คิดหักวันลา"}</span></li>
                                            <li className="flex gap-2"><span className="text-amber-400 font-bold">⚠️</span> <span>ลาครึ่งวันติดวันหยุดประจำสัปดาห์ หักเป็น <strong>1.5 วัน</strong></span></li>
                                            <li className="flex gap-2"><span className="text-amber-400 font-bold">⚠️</span> <span>ลาเต็มวันติดวันหยุดประจำสัปดาห์ หักเป็น <strong>2.0 วัน</strong> (ควบวันหยุดปฏิทินหัก <strong>3.0 วัน</strong>)</span></li>
                                            <li className="flex gap-2"><span className="text-red-400 font-bold">🚨</span> <span><strong>ลาค่อมวันหยุด (Sandwich):</strong> หักบวกวันหยุดสะสมเพิ่มทั้งหมด</span></li>
                                            <li className="flex gap-2 text-emerald-400 border-t border-navy-800 pt-2"><span className="font-bold">⏰</span> <span><strong>สาย / ออกงาน 1.01-1.30 ชม.:</strong> ครบทุก 3 ครั้ง หัก <strong>1.0 วัน</strong> {isTeacherRole && "(ครบ 9 ครั้งลงบันทึกความผิด)"}</span></li>
                                            <li className="flex gap-2 text-emerald-400"><span className="font-bold">📝</span> <span><strong>ลืมบันทึกเวลาเข้า-ออก:</strong> ครบทุก 3 ครั้ง หัก <strong>1.0 วัน</strong> {isTeacherRole && "(ครบ 9 ครั้งลงบันทึกความผิด)"}</span></li>
                                            <li className="flex gap-2 text-emerald-400"><span className="font-bold">🚗</span> <span><strong>ออกงาน &gt; 1.30 ชม.:</strong> หักลากิจโดยตรง <strong>0.5 วัน</strong>/ครั้ง</span></li>
                                            <li className="flex gap-2 text-amber-300"><span className="font-bold">🤝</span> <span>ลา 0.5 วัน หักค่าเวร <strong>50 บาท</strong> | ลา 1 วัน หักค่าเวร <strong>100 บาท</strong></span></li>
                                        </ul>
                                    </div>
                                </div>

                                {/* ฝั่งขวา: ฟอร์มกรอกยื่นขอลา + ประวัติการลางาน */}
                                <div className="space-y-6 lg:col-span-2">
                                    <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-100 text-left">
                                        <h2 className="text-base sm:text-lg font-extrabold text-slate-800 mb-5 pb-3 border-b flex items-center gap-2">
                                            <i className="fa-solid fa-paper-plane text-emerald-700"></i> บันทึกยื่นใบขอลาและตรวจผลคำนวณสะสม
                                        </h2>

                                        <form onSubmit={handleRequestLeaveSubmit} className="space-y-6">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                                <div>
                                                    <label className="block text-slate-700 text-xs font-bold mb-1.5">วันเริ่มหยุด</label>
                                                    <input 
                                                        type="date" 
                                                        value={formData.startDate} 
                                                        onChange={(e) => setFormData({ ...formData, startDate: e.target.value })} 
                                                        className="w-full bg-slate-50 border border-slate-200 text-slate-800 px-4 py-3 rounded-xl text-xs font-bold focus:bg-white focus:ring-2 focus:ring-emerald-700 focus:outline-none" 
                                                        required 
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 text-xs font-bold mb-1.5">วันสุดท้ายที่ลา</label>
                                                    <input 
                                                        type="date" 
                                                        value={formData.period !== "all_day" ? formData.startDate : formData.endDate} 
                                                        onChange={(e) => setFormData({ ...formData, endDate: e.target.value })} 
                                                        disabled={formData.period !== "all_day"} 
                                                        className={`w-full px-4 py-3 rounded-xl text-xs font-bold ${formData.period !== "all_day" ? "bg-slate-100 text-slate-400 cursor-not-allowed border-slate-200" : "bg-slate-50 border border-slate-200 text-slate-800 focus:bg-white focus:ring-2 focus:ring-emerald-700 focus:outline-none"}`} 
                                                        required={formData.period === "all_day"} 
                                                    />
                                                    {formData.period !== "all_day" && (
                                                        <p className="text-[10px] text-emerald-700 font-bold mt-1">※ ล็อกวันให้อัตโนมัติสำหรับการลาครึ่งวัน</p>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                                <div>
                                                    <label className="block text-slate-700 text-xs font-bold mb-1.5">ช่วงเวลาที่ต้องการลา</label>
                                                    <div className="grid grid-cols-3 gap-2">
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setFormData({ ...formData, period: "all_day" })} 
                                                            className={`py-3 px-2 rounded-xl text-xs font-bold border flex items-center justify-center gap-1 transition ${formData.period === 'all_day' ? 'bg-emerald-50 border-emerald-600 text-emerald-800 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                                        >
                                                            <i className="fa-solid fa-sun text-emerald-700"></i> เต็มวัน (1.0)
                                                        </button>
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setFormData({ ...formData, period: "morning" })} 
                                                            className={`py-3 px-2 rounded-xl text-xs font-bold border flex items-center justify-center gap-1 transition ${formData.period === 'morning' ? 'bg-emerald-50 border-emerald-600 text-emerald-800 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                                        >
                                                            <i className="fa-solid fa-cloud-sun text-emerald-700"></i> ครึ่งเช้า (0.5)
                                                        </button>
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setFormData({ ...formData, period: "afternoon" })} 
                                                            className={`py-3 px-2 rounded-xl text-xs font-bold border flex items-center justify-center gap-1 transition ${formData.period === 'afternoon' ? 'bg-emerald-50 border-emerald-600 text-emerald-800 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                                        >
                                                            <i className="fa-solid fa-cloud-moon text-emerald-700"></i> ครึ่งบ่าย (0.5)
                                                        </button>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-slate-700 text-xs font-bold mb-1.5">ชนิดการลา</label>
                                                    <div className="grid grid-cols-2 gap-2">
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setFormData({ ...formData, type: "personal" })} 
                                                            className={`py-3 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-1.5 transition ${formData.type === 'personal' ? 'bg-emerald-50 border-emerald-600 text-emerald-800 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                                        >
                                                            <i className="fa-solid fa-briefcase text-emerald-700"></i> ลากิจส่วนตัว
                                                        </button>
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setFormData({ ...formData, type: "sick" })} 
                                                            className={`py-3 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-1.5 transition ${formData.type === 'sick' ? 'bg-emerald-50 border-emerald-600 text-emerald-800 shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}
                                                        >
                                                            <i className="fa-solid fa-heart-pulse text-emerald-700"></i> ลาป่วยพนักงาน
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-slate-700 text-xs font-bold mb-1.5">เหตุผลความจำเป็นที่ลา</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="ระบุเหตุผลความจำเป็น..." 
                                                    value={formData.reason} 
                                                    onChange={(e) => setFormData({ ...formData, reason: e.target.value })} 
                                                    className="w-full bg-slate-50 border border-slate-200 text-slate-800 px-4 py-3 rounded-xl text-xs font-bold focus:bg-white focus:ring-2 focus:ring-emerald-700 focus:outline-none" 
                                                    required 
                                                />
                                            </div>

                                            {leaveCalcResult.total > 0 && (
                                                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 shadow-inner">
                                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-3 mb-3">
                                                        <div>
                                                            <span className="text-[10px] font-bold text-emerald-700 uppercase tracking-widest">การคำนวณโดยระบบ AI</span>
                                                            <h4 className="font-extrabold text-slate-800 text-xs sm:text-sm">สรุปผลวิเคราะห์การหักวันลาและค่าเวร</h4>
                                                        </div>
                                                        <div className="bg-white px-3 py-1.5 rounded-xl border shadow-sm text-right">
                                                            <p className="text-[10px] text-slate-400 font-bold">ยอดหักวันลาสะสม / ค่าเวร</p>
                                                            <p className="text-base font-black text-red-600">หักวันลา: {leaveCalcResult.total.toFixed(2)} วัน</p>
                                                            <p className="text-xs font-bold text-amber-700">หักค่าเวร: {leaveCalcResult.dutyFeeDeduction} บาท</p>
                                                        </div>
                                                    </div>

                                                    <div className="space-y-1.5 max-h-36 overflow-y-auto pr-1">
                                                        {leaveCalcResult.breakdown.map((day, idx) => (
                                                            <div key={idx} className="flex justify-between items-center bg-white p-2.5 rounded-xl border text-[11px]">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="font-bold text-slate-700">{formatThaiDate(day.date)}</span>
                                                                    <span className="bg-emerald-50 text-emerald-800 font-bold px-2 py-0.5 rounded text-[9px] border border-emerald-100">{day.penaltyReason}</span>
                                                                </div>
                                                                <div className="font-bold text-right">
                                                                    {day.final === 0 ? <span className="text-slate-400">ยกเว้น (0 วัน)</span> : <span className="text-red-600">หัก {day.final.toFixed(1)} วัน (ค่าเวร {day.dutyFee} บ.)</span>}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}

                                            <button type="submit" className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold py-3.5 px-6 rounded-xl transition text-xs uppercase shadow-md flex items-center justify-center gap-2">
                                                <i className="fa-solid fa-paper-plane"></i>
                                                ส่งใบคำขออนุมัติและปรับยอดสะสม
                                            </button>
                                        </form>
                                    </div>

                                    <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-100 text-left">

                                                            </td>
                                                        </tr>

                                                {holidays.length === 0 ? (
                                                    <div className="text-center py-8 text-slate-400 text-xs">ไม่มีวันหยุดในปฏิทิน</div>

                                                    holidays.map((h, i) => (
                                                        <div key={i} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs font-semibold">

                                            <div className="flex justify-between items-center mb-5 border-b pb-4">
                                                <div>
                                                    <h3 className="font-extrabold text-slate-800 text-base">วันกิจกรรมพิเศษประจำโรงเรียน ({activities.length})</h3>

                                                    onClick={() => setShowAddActivityModal(true)}

                                                    <i className="fa-solid fa-plus text-xs"></i> เพิ่มกิจกรรม

                                                            </button>
                                                        </div>

                    {showAddTeacherModal && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">

                                <div className="flex justify-between items-center border-b pb-3 mb-4">

                                            <option value="janitor">พ่อบ้าน (Janitor)</option>
                                            <option value="hr">ฝ่ายบุคคล (HR)</option>
                                            <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                                        </select>
                                    </div>

                                            <option value="middayOutLongCount">ออกนอกสถานที่ (&gt; 1.30 ชม.)</option>
                                            <option value="lateCount">มาทำงานสาย</option>
                                            <option value="missedMeetingCount">ขาดประชุมพบกันฉันน้องพี่</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ระบุวันที่ทำรายการ</label>
                                        <input type="date" value={newLogData.date} onChange={(e) => setNewLogData({ ...newLogData, date: e.target.value })} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-xs font-bold" required />
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">หมายเหตุ / อธิบายเพิ่มเติม</label>
                                        <input type="text" placeholder="เช่น ลืมสแกนเวลาช่วงเย็น..." value={newLogData.note} onChange={(e) => setNewLogData({ ...newLogData, note: e.target.value })} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-xs font-semibold" />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">บันทึกประวัติย้อนหลัง</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal 3: ดูประวัติย้อนหลังสำหรับครู */}
                    {showViewLogsModal && selectedTeacher && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-lg border text-left max-h-[80vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-3 mb-3">
                                    <h3 className="text-sm font-bold text-slate-800">ประวัติการลืมลงเวลา / ออกนอกสถานที่ย้อนหลัง</h3>
                                    <button onClick={() => setShowViewLogsModal(false)} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <div className="overflow-y-auto flex-1 space-y-2 pr-1">
                                    {disciplineLogs.filter(l => l.teacherId === selectedTeacher.id).length === 0 ? (
                                        <div className="text-center py-8 text-slate-400 text-xs font-bold">
                                            <i className="fa-solid fa-circle-check text-emerald-600 text-3xl mb-2 block"></i>
                                            ไม่มีประวัติการลืมบันทึกเวลาหรือออกนอกงาน
                                        </div>
                                    ) : (
                                        disciplineLogs.filter(l => l.teacherId === selectedTeacher.id).map(log => (
                                            <div key={log.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs flex justify-between items-center">
                                                <div>
                                                    <span className="font-extrabold text-slate-800 block">{getDisciplineTypeName(log.type)}</span>
                                                    <span className="text-[10px] text-slate-500">📅 {formatThaiDate(log.date)} • {log.note}</span>
                                                </div>
                                                {currentUser?.role === "admin" && (
                                                    <button onClick={() => handleDeleteDisciplineLog(log.id)} className="text-red-500 hover:text-red-700 p-1"><i className="fa-solid fa-trash-can"></i></button>
                                                )}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal 4: เพิ่มวันหยุดราชการ */}
                    {showAddHolidayModal && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-sm border text-left">
                                <div className="flex justify-between items-center border-b pb-3 mb-3">
                                    <h3 className="text-sm font-bold text-slate-800">เพิ่มวันหยุดราชการประจำปฏิทิน</h3>
                                    <button onClick={() => setShowAddHolidayModal(false)} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <form onSubmit={handleAddHoliday} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">วันที่หยุด</label>
                                        <input type="date" value={newHoliday.date} onChange={(e) => setNewHoliday({ ...newHoliday, date: e.target.value })} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-xs font-bold" required />
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ชื่อวันหยุด</label>
                                        <input type="text" placeholder="เช่น วันมาฆบูชา, วันสงกรานต์" value={newHoliday.name} onChange={(e) => setNewHoliday({ ...newHoliday, name: e.target.value })} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-xs font-semibold" required />
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">บันทึกวันหยุด</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal 5: เพิ่มวันกิจกรรมพิเศษ */}
                    {showAddActivityModal && (
                        <div className="fixed inset-0 bg-navy-950/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-[24px] shadow-2xl p-6 w-full max-w-sm border text-left">
                                <div className="flex justify-between items-center border-b pb-3 mb-3">
                                    <h3 className="text-sm font-bold text-slate-800">เพิ่มกิจกรรมพิเศษประจำโรงเรียน</h3>
                                    <button onClick={() => setShowAddActivityModal(false)} className="text-slate-400"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <form onSubmit={handleAddActivity} className="space-y-3">
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">วันที่จัดกิจกรรม</label>
                                        <input type="date" value={newActivity.date} onChange={(e) => setNewActivity({ ...newActivity, date: e.target.value })} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-xs font-bold" required />
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ชื่อกิจกรรม</label>
                                        <input type="text" placeholder="เช่น พิธีไหว้ครู, วันวิทยาศาสตร์" value={newActivity.name} onChange={(e) => setNewActivity({ ...newActivity, name: e.target.value })} className="w-full bg-slate-50 border px-3 py-2 rounded-xl text-xs font-semibold" required />
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ประเภทกิจกรรม</label>
                                        <select value={newActivity.type} onChange={(e) => setNewActivity({ ...newActivity, type: e.target.value })} className="w-full bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                                            <option value="special_half">กิจกรรมพิเศษครึ่งวัน</option>
                                            <option value="special_full">กิจกรรมพิเศษตลอดวัน</option>
                                            <option value="meeting">ประชุมพบกันฉันน้องพี่</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-slate-500 text-xs mb-1 font-bold">ช่วงเวลา</label>
                                        <select value={newActivity.session} onChange={(e) => setNewActivity({ ...newActivity, session: e.target.value })} className="w-full bg-slate-50 border p-2.5 rounded-xl text-xs font-bold">
                                            <option value="morning">ช่วงเช้า</option>
                                            <option value="afternoon">ช่วงบ่าย</option>
                                            <option value="all_day">ตลอดวัน</option>
                                        </select>
                                    </div>
                                    <button type="submit" className="w-full bg-navy-900 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">บันทึกกิจกรรม</button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-navy-950 text-slate-400 py-6 text-center border-t border-emerald-700/20 text-xs font-medium mt-12">
                        <p>© ๒๕๖๙ ระบบคำนวณและสรุปวันลาครูระดับพรีเมียม - โรงเรียนอนุบาลยุวพัฒน์นครสวรรค์</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
